<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세포호흡 한눈에 보기 · V-Lab</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* V-Lab 공용 글꼴·색 토큰만 가져옴 (공용 클래스는 이 파일의 클래스 이름과 겹치므로 lab-theme.css 전체는 쓰지 않음) */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
:root{--font: 'IBM Plex Sans KR', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; --bg: #ffffff; --panel: #ffffff; --panel-2: #F7F8FA; --line: #E6E8EC; --line-2: #F0F1F3; --text: #111111; --text-2: #3F4652; --muted: #6B7280; --accent: #3182F6; --accent-soft: #EAF2FF; --ok: #12A66B; --warn: #F5A623; --err: #E5484D; --radius: 12px; --radius-sm: 8px;}
</style>
<style>
/* Layout: 세포 한 장면(왼쪽 큰 그림) + 선택한 단계 설명(오른쪽), 아래에 ATP 막대와 4단계 비교표 */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#1d2b2f; --muted:#5b6d72; --line:#d3dfdc;
  --accent:#167a86; --accent-ink:#ffffff; --soft:#e2f0ee;
  --easy:#fff6dc; --easy-ink:#5a4300; --easy-line:#f1d27a;
  --plate:#ffffff; --plate-line:#cfdcda;
  --st0:#167a86; --st1:#2f8fa3; --st2:#d9762b; --st3:#b04f86; --st4:#3b74c0; --st5:#6a7f3a;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.65;padding-inline:clamp(16px,2.5vw,36px);padding-block:18px 32px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.15;margin:2px 0 0;text-wrap:balance}
.eq{font-size:15px;color:var(--muted);margin:4px 0 0}
.eq b{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;font-size:15px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tabs button:focus-visible,.play:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.play{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 16px;cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
.fig{display:flex;flex-direction:column;gap:10px;min-width:0}
.plate{position:relative;background:var(--plate);border:1px solid var(--plate-line);border-radius:18px;overflow:hidden;aspect-ratio:1000/620;max-width:100%}
.plate svg{width:100%;height:100%;display:block}
.plate .hit{cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip.stage{background:var(--c);color:#fff}
h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.3vw,30px);line-height:1.25;margin:0;text-wrap:balance}
.easy{background:var(--easy);border:1px solid var(--easy-line);border-radius:14px;padding:12px 16px}
.easy p{margin:0;color:var(--easy-ink);font-size:18px;line-height:1.7}
.lbl{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.easy .lbl{color:var(--easy-ink);opacity:.8}
.book p{margin:0;font-size:15.5px}
.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.io div{background:var(--soft);border-radius:12px;padding:8px 12px;min-width:0}
.io ul{margin:0;padding-left:18px;font-size:15px}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.bar h3,.tbl h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.stack{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:900;color:#fff;font-size:15px}
.stack div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0;overflow:hidden;padding-inline:6px}
@media (max-width:640px){.stack .wide{display:none}}
.legend{font-size:13.5px;color:var(--muted);margin:0}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
thead th{font-size:15px;color:#fff}
tbody th{color:var(--muted);font-size:13.5px;white-space:nowrap}
td.sel,th.sel{background:color-mix(in srgb,var(--c) 14%,transparent)}
.num{font-variant-numeric:tabular-nums}
svg text{font-family:var(--body)}
.dim{opacity:.18;transition:opacity .4s}
.lit{opacity:1;transition:opacity .4s}

/* ===== V-Lab 공용 테마에 맞춘 덮어쓰기 ===== */
:root{--bg:#ffffff;--surface:#ffffff;--ink:#111111;--muted:#6B7280;--line:#E6E8EC;--accent:#111111;--accent-ink:#ffffff;--soft:#F7F8FA;
  --easy:#FFF8E6;--easy-ink:#5A4300;--easy-line:#F1D27A;--plate:#ffffff;--plate-line:#E6E8EC;--display:var(--font);--body:var(--font)}
html,body{background:#ffffff;color:#111111}
body{font-family:var(--font);font-size:16px;padding-block:16px 32px}
h1,h2,.bar h3,.tbl h3,.zhead h3{font-family:var(--font);font-weight:700;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.25} h2{font-size:22px} .bar h3,.tbl h3,.zhead h3{font-size:18px}
.eyebrow{font-size:12.5px;letter-spacing:.08em}
.panel,.bar,.tbl,.plate,.zbox,.zplate{border-radius:12px;box-shadow:none}
.easy,.io div,.cell,.ledger .row>div{border-radius:8px}
.chip{border-radius:8px;font-size:13.5px}
.tabs button,.ctl button,.zbox button,.play{border-radius:8px;border:1px solid #E6E8EC;font-size:14.5px;font-weight:600}
.tabs button:hover,.ctl button:hover:not(:disabled),.zbox button:hover:not(:disabled){border-color:#111}
.play,.ctl button.primary,.zbox button.primary{background:#111;border-color:#111;color:#fff}
.play#motion{background:#fff;color:#111;border-color:#E6E8EC}
.route button{border-radius:8px;border:1px solid #E6E8EC}
.route button .n{font-family:var(--font);font-weight:700}
.cell .v{font-family:var(--font);font-weight:700}
.navbtn{box-shadow:none;border:1px solid #E6E8EC;background:#fff}
.dot{border-radius:50%}
table{font-size:14.5px} thead th{font-weight:700} tbody th{font-size:13.5px}
.easy p{font-size:16.5px} .book p{font-size:15px} .io ul{font-size:14.5px} .legend,.hint,.ledger .note{font-size:13.5px}
/* 뷰어 안: 파일 자체 제목 숨김, 그림은 창 높이를 넘지 않게 */
body.vlab-embed header.top > div:first-child{display:none}
body.vlab-embed{padding-block:12px 28px}
.plate{max-height:calc(100vh - 150px)}
.zplate{max-height:calc(100vh - 260px)}
</style>
</head>
<body>
<script>if(/embed/.test(location.hash))document.body.classList.add("vlab-embed");</script>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Ⅲ. 세포호흡과 광합성 · 02 세포호흡</div>
      <h1>세포호흡 한눈에 보기</h1>
      <p class="eq"><b>포도당 + 산소</b> → <b>이산화 탄소 + 물 + 에너지(ATP)</b></p>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main>
    <section class="fig">
      <div class="plate" id="plate"></div>
    </section>
    <aside class="panel" id="panel">
      <div class="chips"><span class="chip stage" id="chip"></span><span class="chip" id="place"></span></div>
      <h2 id="title"></h2>
      <div class="easy"><span class="lbl">쉽게 말하면</span><p id="easy"></p></div>
      <div class="io" id="io"></div>
      <div class="book"><span class="lbl">교과서 설명</span><p id="book"></p></div>
      <button class="play" id="play">▶ 처음부터 차례로 보기</button>
      <button class="play" id="motion" aria-pressed="false" style="background:transparent;color:var(--ink);border-color:var(--line)">움직임 끄기</button>
    </aside>
  </main>
  <section class="bar">
    <h3>포도당 1분자로 만드는 ATP는 최대 32개</h3>
    <div class="stack" id="stack" role="img" aria-label="해당 과정 2, TCA 회로 2, 산화적 인산화 최대 28, 합계 최대 32 ATP">
      <div style="flex:2;background:var(--st1)">2</div>
      <div style="flex:2;background:var(--st3)">2</div>
      <div style="flex:28;background:var(--st4)">최대 28<span class="wide">&nbsp;· 산화적 인산화 (NADH 10 × 2.5 + FADH₂ 2 × 1.5)</span></div>
    </div>
    <p class="legend">해당 과정 2 + TCA 회로 2 (기질수준인산화) + 산화적 인산화 최대 28 = 최대 32. 피루브산의 산화에서는 ATP가 직접 만들어지지 않아요.</p>
  </section>
  <section class="tbl">
    <h3>네 단계 비교표 (포도당 1분자 기준)</h3>
    <div class="scroll"><table id="table"></table></div>
  </section>
</div>

<script>
(()=>{
/* 수업 화면에서는 항상 움직이도록 기본값을 켬 (기기의 '애니메이션 줄이기' 설정과 무관). 필요하면 '움직임 끄기' 버튼으로 끔 */
let RM = false; try{ RM = localStorage.getItem('still')==='1'; }catch(e){}
const sec = s => RM ? 0.001 : s;

/* ---------- 그림 도구 ---------- */
const SUB = {'NAD+':'NAD⁺','FADH2':'FADH₂','CO2':'CO₂','H2O':'H₂O','O2':'O₂','NADP+':'NADP⁺'};
const KIND = {
  'NADH':{f:'#e8589a',t:'#fff',s:'#c43d7d'}, 'NAD+':{f:'#fde3ee',t:'#a8275f',s:'#e8589a'},
  'FADH2':{f:'#4a9f57',t:'#fff',s:'#357a40'}, 'FAD':{f:'#e0f2db',t:'#2f7a3a',s:'#4a9f57'},
  'ATP':{f:'#f28c28',t:'#fff',s:'#c96a10'}, 'ADP':{f:'#ffecd2',t:'#a85a0d',s:'#f28c28'},
  'CoA':{f:'#8a6fd1',t:'#fff',s:'#6a51b0'}, 'CO2':{f:'#8f9ba7',t:'#fff',s:'#6f7b87'},
  'O2':{f:'#e5534b',t:'#fff',s:'#b83a33'}, 'H2O':{f:'#5fb4e6',t:'#fff',s:'#3a8fc2'},
  'plain':{f:'#ffffff',t:'#2b3a40',s:'#9fb2b6'},
  'nutr':{f:'#eef4dc',t:'#3f5a17',s:'#9db36a'}
};
const tw = s => 18 + [...s].reduce((a,c)=>a+(/[가-힣]/.test(c)?16:/[A-Z0-9]/.test(c)?11:8),0);
/* 그림 글자 크기: 작은 글자일수록 더 크게 키움 */
const fz = s => s<=18 ? s+5 : s<=24 ? s+4 : s+2;
const twb = s => Math.round(tw(s)*1.25);
function tag(x,y,label,kind,big){
  const k = KIND[kind||label]||KIND.plain, txt = SUB[label]||label, h = big?44:38, w = twb(txt)+(big?10:0);
  return `<g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${k.f}" stroke="${k.s}" stroke-width="1.6"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="${big?22:19}" font-weight="700" fill="${k.t}">${txt}</text></g>`;
}
const C = (x,y,r=14)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gC)" stroke="#2a5aa8" stroke-width="1.2"/>`;
const bond = (x1,y1,x2,y2,c='#2a5aa8')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;
function row(n,x,y,gap=34,r=14){let s='';for(let i=0;i<n-1;i++)s+=bond(x+i*gap,y,x+(i+1)*gap,y);for(let i=0;i<n;i++)s+=C(x+i*gap,y,r);return s;}
const P = (x,y)=>`<g><circle cx="${x}" cy="${y}" r="14" fill="#ffd75e" stroke="#c99a12" stroke-width="1.5"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="900" fill="#7a5a00">P</text></g>`;
const Hp = (x,y)=>`<g><circle cx="${x}" cy="${y}" r="14" fill="#3aa0d8" stroke="#1f7fb5" stroke-width="1.2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">H⁺</text></g>`;
const E = (x,y)=>`<g><circle cx="${x}" cy="${y}" r="18" fill="url(#gE)"/><circle cx="${x}" cy="${y}" r="11" fill="#ffd23f" stroke="#e0a800" stroke-width="1.2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="900" fill="#7a5500">e⁻</text></g>`;
const co2m = (x,y)=>`<g><circle cx="${x-17}" cy="${y}" r="8" fill="#e5534b"/><circle cx="${x+17}" cy="${y}" r="8" fill="#e5534b"/>${C(x,y,12)}</g>`;
const T = (x,y,s,size=16,w=700,fill='#2b3a40',anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${fz(size)}" font-weight="${w}" fill="${fill}">${s}</text>`;
const halo = (x,y,s,size=16,w=700,fill='#2b3a40',anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${fz(size)}" font-weight="${w}" fill="${fill}" stroke="#fff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
const arrow = (d,c='#55707a',w=3,dash='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} marker-end="url(#ah)" style="color:${c}"/>`;
const place = (x,y,s,c='#2b3a40')=>`<g><rect x="${x}" y="${y-22}" width="${twb(s)+12}" height="36" rx="9" fill="#ffffffcc" stroke="${c}" stroke-width="1.2"/>${T(x+(twb(s)+12)/2,y+3,s,14,700,c)}</g>`;

/* 애니메이션 */
const ease = `calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"`;
function mv(inner,x1,y1,x2,y2,dur=1,begin=0){
  if(RM) return `<g transform="translate(${x2} ${y2})">${inner}</g>`;
  return `<g transform="translate(${x1} ${y1})">${inner}<animateTransform attributeName="transform" type="translate" from="${x1} ${y1}" to="${x2} ${y2}" dur="${dur}s" begin="${begin}s" fill="freeze" ${ease}/></g>`;
}
function fin(inner,begin=0,dur=.5){ if(RM) return inner; return `<g opacity="0">${inner}<animate attributeName="opacity" from="0" to="1" dur="${dur}s" begin="${begin}s" fill="freeze"/></g>`; }
function fout(inner,begin=0,dur=.4){ if(RM) return ''; return `<g>${inner}<animate attributeName="opacity" from="1" to="0" dur="${dur}s" begin="${begin}s" fill="freeze"/></g>`; }
function mvGone(inner,x1,y1,x2,y2,dur=1,begin=0){ if(RM) return ''; return `<g>${mv(inner,x1,y1,x2,y2,dur,begin)}<animate attributeName="opacity" from="1" to="0" begin="${begin+dur}s" dur=".3s" fill="freeze"/></g>`; }
/* 경로 따라 한 번 이동 후 사라짐 */
function trip(inner,d,dur=1,begin=0,stay=false){
  if(RM) return '';
  return `<g opacity="0">${inner}<animateMotion path="${d}" dur="${dur}s" begin="${begin}s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;${stay?1:0}" keyTimes="0;.08;.85;1" dur="${dur}s" begin="${begin}s" fill="freeze"/></g>`;
}
/* 무한 반복 경로 */
function loop(inner,d,dur=2,offset=0){
  if(RM) return '';
  return `<g opacity="0">${inner}<animateMotion path="${d}" dur="${dur}s" begin="${-offset}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="${dur}s" begin="${-offset}s" repeatCount="indefinite"/></g>`;
}
function spin(cx,cy,inner,dur=2){ if(RM) return inner; return `<g>${inner}<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/></g>`; }

function bilayerH(y1,y2,x1,x2,gap=15){
  let s=`<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" fill="#fbe9b8"/>`;
  const L=(y2-y1)/2-9;
  for(let x=x1+gap/2;x<x2;x+=gap){
    s+=`<path d="M${x-2.5},${y1+7}v${L}M${x+2.5},${y1+7}v${L}M${x-2.5},${y2-7}v${-L}M${x+2.5},${y2-7}v${-L}" stroke="#ddb24e" stroke-width="1.6" fill="none"/>`;
    s+=`<circle cx="${x}" cy="${y1}" r="7" fill="#f7c948" stroke="#d39a1c" stroke-width="1"/><circle cx="${x}" cy="${y2}" r="7" fill="#f7c948" stroke="#d39a1c" stroke-width="1"/>`;
  }
  return s;
}
function bilayerV(x1,x2,y1,y2,gap=15){
  let s=`<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" fill="#fbe9b8"/>`;
  const L=(x2-x1)/2-9;
  for(let y=y1+gap/2;y<y2;y+=gap){
    s+=`<path d="M${x1+7},${y-2.5}h${L}M${x1+7},${y+2.5}h${L}M${x2-7},${y-2.5}h${-L}M${x2-7},${y+2.5}h${-L}" stroke="#ddb24e" stroke-width="1.6" fill="none"/>`;
    s+=`<circle cx="${x1}" cy="${y}" r="7" fill="#f7c948" stroke="#d39a1c" stroke-width="1"/><circle cx="${x2}" cy="${y}" r="7" fill="#f7c948" stroke="#d39a1c" stroke-width="1"/>`;
  }
  return s;
}
/* 탄소 고리 모양 묶음 */
function cluster(n,cx,cy,r=13){
  const R = n<=2?16:n===3?20:n===4?22:n===5?25:28;
  const pts=[];
  for(let i=0;i<n;i++){const a=(n===2?0:-Math.PI/2)+i*2*Math.PI/n; pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  let s='';
  for(let i=0;i<n;i++){ if(n===2&&i===1)break; const a=pts[i],b=pts[(i+1)%n]; s+=bond(a[0],a[1],b[0],b[1]); }
  pts.forEach(p=>s+=C(p[0],p[1],r));
  return s;
}
function card(x,y,w,h,title){return `<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" stroke="#c9d6d4"/></g>${title?T(x+16,y+28,title,16,900,'#2b3a40','start'):''}`;}

const DEFS = `<defs>
<radialGradient id="gC" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#cfe1ff"/><stop offset=".5" stop-color="#5a8fdc"/><stop offset="1" stop-color="#2a5aa8"/></radialGradient>

    ${nut('f',`${on('f')?ring(346,48,stw('지방')):''}${st(346,48,'지방')}${st(300,98,'글리세롤')}${st(404,98,'지방산')}${arrow('M334,64 L314,80','#6a7f3a',2)}${arrow('M358,64 L388,80','#6a7f3a',2)}`)}
    ${lines('c',['M206,114 V238'])}
    ${lines('f',['M292,114 C284,250 236,300 210,330','M406,114 C410,190 408,240 404,296'])}
    ${lines('p',['M80,142 C40,220 40,330 84,358','M86,142 C120,182 330,176 392,296','M88,140 C190,170 480,140 548,270'])}
    ${NUT?'':halo(300,606,'👆 왼쪽 위의 영양소를 눌러 보세요',17,900,'#4f6a1f')}
  </g>`;
  return {o, g1, g2, g3, g4, g5, flow, F};
}

let cur=0, timer=null, NUT=null;
const $=id=>document.getElementById(id);
function draw(){
  const S=STG[cur], sc=scene();
  const cls = n => cur===0||cur===5 ? 'lit' : (cur===n?'lit':'dim');
  const svg = `<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">${DEFS}${sc.o}
    <g class="${cur===5?'dim':'lit'}">${cur>=1&&cur<=4? sc.F[cur] : sc.flow}</g>
    ${[1,2,3,4].map(n=>`<g class="hit ${cls(n)}" data-s="${n}">${sc['g'+n]}</g>`).join('')}
    ${cur===5? fin(sc.g5,0,.6):''}
  </svg>`;
  $('plate').innerHTML=svg;
  $('plate').setAttribute('aria-label',`${S.name} 그림`);
  $('plate').querySelectorAll('.nut').forEach(g=>g.addEventListener('click',e=>{e.stopPropagation();stop();const k=g.dataset.n;NUT=NUT===k?null:k;draw();}));
  $('plate').querySelectorAll('.hit').forEach(g=>g.addEventListener('click',()=>{stop();sel(+g.dataset.s);}));
  document.documentElement.style.setProperty('--c',`var(${S.c})`);
  $('chip').textContent = S.k==='전체'?'전체 보기':S.k==='+'?'더 알아보기':`${S.k} ${S.name}`;
  $('place').textContent=`장소: ${S.place}`;
  $('title').textContent=S.t; $('easy').textContent=S.e; $('book').textContent=S.b;
  $('io').innerHTML=`<div><span class="lbl">들어가는 것</span><ul>${S.i.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><span class="lbl">나오는 것</span><ul>${S.o.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===cur));
  $('table').querySelectorAll('[data-col]').forEach(td=>td.classList.toggle('sel',+td.dataset.col===cur));
}
function sel(i){cur=i;NUT=null;draw();}
function stop(){ if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 처음부터 차례로 보기';} }
STG.forEach((S,i)=>{const b=document.createElement('button');b.textContent=i===0?'전체':i===5?'다른 영양소는?':`${S.k} ${S.name}`;b.style.setProperty('--c',`var(${S.c})`);b.onclick=()=>{stop();sel(i);};$('tabs').appendChild(b);});
function motionLabel(){ const b=document.getElementById('motion'); if(b){ b.textContent = RM ? '움직임 켜기' : '움직임 끄기'; b.setAttribute('aria-pressed', RM); } }
document.getElementById('motion').onclick=()=>{ RM=!RM; try{localStorage.setItem('still',RM?'1':'0');}catch(e){} motionLabel(); draw(); };
motionLabel();
$('play').onclick=()=>{
  if(timer){stop();return;}
  let n=1; sel(1); $('play').textContent='■ 멈추기';
  timer=setInterval(()=>{ n++; if(n>4){ stop(); sel(0); return;} sel(n); },6000);
};

 ['생성물','피루브산 2, NADH 2','아세틸조효소 A 2, NADH 2, CO₂ 2','NADH 6, FADH₂ 2, CO₂ 4','H₂O, NAD⁺, FAD'],
 ['ATP','2 (순생성)','0','2','최대 28'],
 ['ATP 만드는 방법','기질수준인산화','–','기질수준인산화','산화적 인산화 (전자전달계 + 화학삼투)'],
 ['산소 필요','필요 없음','필요 (산소가 충분할 때 진행)','필요 (산소가 충분할 때 진행)','필요 (최종 전자 수용체)']
];
let th=`<thead><tr><th style="background:var(--st0)"></th>${[1,2,3,4].map(i=>`<th data-col="${i}" style="background:var(${STG[i].c})">${STG[i].k} ${STG[i].name}</th>`).join('')}</tr></thead><tbody>`;
ROWS.forEach(r=>{th+=`<tr><th>${r[0]}</th>${r.slice(1).map((c,i)=>`<td data-col="${i+1}" class="num">${c}</td>`).join('')}</tr>`;});
$('table').innerHTML=th+'</tbody>';
draw();
