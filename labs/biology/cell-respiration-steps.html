<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세포호흡 단계별 탐험 · V-Lab</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* V-Lab 공용 글꼴·색 토큰만 가져옴 (공용 클래스는 이 파일의 클래스 이름과 겹치므로 lab-theme.css 전체는 쓰지 않음) */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
:root{--font: 'IBM Plex Sans KR', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; --bg: #ffffff; --panel: #ffffff; --panel-2: #F7F8FA; --line: #E6E8EC; --line-2: #F0F1F3; --text: #111111; --text-2: #3F4652; --muted: #6B7280; --accent: #3182F6; --accent-soft: #EAF2FF; --ok: #12A66B; --warn: #F5A623; --err: #E5484D; --radius: 12px; --radius-sm: 8px;}
</style>
<style>
/* Layout: 교과서 그림판(왼쪽, 넓게) + 설명 패널(오른쪽). 위에는 4단계 여정 지도, 그림판 아래 화살표 조작부. 좁은 화면에서는 위아래로 쌓임 */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#1d2b2f; --muted:#5b6d72; --line:#d3dfdc;
  --accent:#167a86; --accent-ink:#ffffff; --soft:#e2f0ee;
  --easy:#fff6dc; --easy-ink:#5a4300; --easy-line:#f1d27a;
  --plate:#ffffff; --plate-line:#cfdcda;
  --st1:#2f8fa3; --st2:#d9762b; --st3:#b04f86; --st4:#3b74c0;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.65;padding-inline:clamp(16px,2.5vw,36px);padding-block:18px 32px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.15;margin:2px 0 0;text-wrap:balance}
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 640px;max-width:900px}
.route button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:9px 12px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);min-width:0;position:relative}
.route button .n{font-family:var(--display);font-size:20px;line-height:1;color:var(--c)}
.route button .nm{font-weight:700;font-size:15px;line-height:1.3}
.route button .pl{font-size:12px;color:var(--muted)}
.route button[aria-current="step"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.route button:focus-visible,.ctl button:focus-visible,.navbtn:focus-visible,.dot:focus-visible,#o2:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}.route{flex-basis:100%}}
@media (max-width:560px){.route{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:12px;min-width:0}
.plate{position:relative;background:var(--plate);border:1px solid var(--plate-line);border-radius:18px;overflow:hidden;aspect-ratio:1000/600;max-width:100%}
#svgwrap,#svgwrap svg{width:100%;height:100%;display:block}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.88);box-shadow:0 2px 10px rgba(20,50,60,.25);font-size:30px;line-height:52px;color:#1d4d55;cursor:pointer;display:grid;place-items:center;padding:0}
.navbtn.prev{left:10px}.navbtn.next{right:10px}
.navbtn:disabled{opacity:.25;cursor:default}
.ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.ctl button{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 18px;cursor:pointer}
.ctl button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{display:grid;place-items:center;line-height:1;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.ctl .dot{padding:0}
.dot.on{background:var(--c);border-color:var(--c);color:#fff}
.dot.done{border-color:var(--c);color:var(--c)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip.stage{background:var(--c);color:#fff}
.stepno{margin:0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.3vw,30px);line-height:1.25;margin:-6px 0 0;text-wrap:balance}
.easy{background:var(--easy);border:1px solid var(--easy-line);border-radius:14px;padding:12px 16px}
.easy p{margin:0;color:var(--easy-ink);font-size:18px;line-height:1.7}
.lbl{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.easy .lbl{color:var(--easy-ink);opacity:.8}
.book p{margin:0;font-size:15.5px;color:var(--ink)}
.keys .chip{background:transparent;border:1.5px solid var(--c);color:var(--ink)}
#o2{font:inherit;font-weight:700;border-radius:12px;border:2px dashed #d0453c;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer;align-self:flex-start}
#o2[aria-pressed="true"]{background:#d0453c;color:#fff;border-style:solid}
.ledger{border-top:1px dashed var(--line);padding-top:12px}
.ledger .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{border-radius:12px;padding:8px 6px;text-align:center;background:var(--soft);min-width:0}
.cell .k{font-size:12.5px;font-weight:700;color:var(--muted)}
.cell .v{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.cell.pulse{animation:pulse .9s ease}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.12);background:color-mix(in srgb,var(--c) 30%,var(--soft))}100%{transform:scale(1)}}
.ledger .note{font-size:13px;color:var(--muted);margin:8px 0 0}
.cell .v{white-space:nowrap;font-size:clamp(18px,4.2vw,26px)}
@media (max-width:640px){.navbtn{width:36px;height:36px;font-size:22px}.navbtn.prev{left:4px}.navbtn.next{right:4px}.dots{order:-1;flex-basis:100%}.ctl #replay{margin-left:auto}}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.zhit{cursor:pointer}.zhit:hover ellipse,.zhit:hover rect{stroke-width:5}
.keys button.chip{font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--c);color:#fff;border:1.5px solid var(--c)}
.zoom{position:fixed;inset:0;background:rgba(10,25,28,.6);display:grid;place-items:center;padding:16px;z-index:50}
.zoom[hidden]{display:none}
.zbox{background:var(--surface);color:var(--ink);border-radius:20px;width:100%;max-width:1320px;max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.zhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.zhead h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.2vw,28px);margin:0;flex:1;min-width:0}
.zbody{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.zbody{grid-template-columns:minmax(0,1fr)}}
.zplate{aspect-ratio:1000/600;max-width:100%;background:var(--plate);border:1px solid var(--plate-line);border-radius:14px;overflow:hidden}
.zplate svg{width:100%;height:100%;display:block}
.ztext{display:flex;flex-direction:column;gap:12px;min-width:0}
.zctl{display:flex;gap:8px;flex-wrap:wrap}
.zbox button{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;cursor:pointer}
.zbox button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zbox button:disabled{opacity:.4;cursor:default}
.zbox button:focus-visible,.keys button.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg text{font-family:var(--body)}
@media (prefers-reduced-motion: reduce){.cell.pulse{animation:none}}

/* ===== V-Lab 공용 테마에 맞춘 덮어쓰기 ===== */
:root{--bg:#ffffff;--surface:#ffffff;--ink:#111111;--muted:#6B7280;--line:#E6E8EC;--accent:#111111;--accent-ink:#ffffff;--soft:#F7F8FA;
  --easy:#FFF8E6;--easy-ink:#5A4300;--easy-line:#F1D27A;--plate:#ffffff;--plate-line:#E6E8EC;--display:var(--font);--body:var(--font)}
html,body{background:#ffffff;color:#111111}
body{font-family:var(--font);font-size:16px;padding-block:16px 32px}
h1,h2,.bar h3,.tbl h3,.zhead h3{font-family:var(--font);font-weight:700;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.25} h2{font-size:22px} .bar h3,.tbl h3,.zhead h3{font-size:18px}
.eyebrow{font-size:12.5px;letter-spacing:.08em}
.panel,.bar,.tbl,.plate,.zbox,.zplate{border-radius:12px;box-shadow:none}
.easy,.io div,.cell,.ledger .row>div{border-radius:8px}
.chip{border-radius:8px;font-size:13.5px}
.tabs button,.ctl button,.zbox button,.play{border-radius:8px;border:1px solid #E6E8EC;font-size:14.5px;font-weight:600}
.tabs button:hover,.ctl button:hover:not(:disabled),.zbox button:hover:not(:disabled){border-color:#111}
.play,.ctl button.primary,.zbox button.primary{background:#111;border-color:#111;color:#fff}
.play#motion{background:#fff;color:#111;border-color:#E6E8EC}
.route button{border-radius:8px;border:1px solid #E6E8EC}
.route button .n{font-family:var(--font);font-weight:700}
.cell .v{font-family:var(--font);font-weight:700}
.navbtn{box-shadow:none;border:1px solid #E6E8EC;background:#fff}
.dot{border-radius:50%}
table{font-size:14.5px} thead th{font-weight:700} tbody th{font-size:13.5px}
.easy p{font-size:16.5px} .book p{font-size:15px} .io ul{font-size:14.5px} .legend,.hint,.ledger .note{font-size:13.5px}
/* 뷰어 안: 파일 자체 제목 숨김, 그림은 창 높이를 넘지 않게 */
body.vlab-embed header.top > div:first-child{display:none}
body.vlab-embed{padding-block:12px 28px}
.plate{max-height:calc(100vh - 150px)}
.zplate{max-height:calc(100vh - 260px)}
</style>
</head>
<body>
<script>if(/embed/.test(location.hash))document.body.classList.add("vlab-embed");</script>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Ⅲ. 세포호흡과 광합성 · 02 세포호흡</div>
      <h1>세포호흡 단계별 탐험</h1>
    </div>
    <nav class="route" id="route" aria-label="세포호흡 4단계"></nav>
  </header>
  <main>
    <section class="fig">
      <div class="plate" id="plate">
        <div id="svgwrap" role="img" aria-label="단계 그림"></div>
        <button class="navbtn prev" id="bprev" aria-label="이전 세부 단계">‹</button>
        <button class="navbtn next" id="bnext" aria-label="다음 세부 단계">›</button>
      </div>
      <div class="ctl">
        <button id="prev">◀ 이전</button>
        <div class="dots" id="dots"></div>
        <button id="replay" title="애니메이션 다시 보기">↻ 다시 보기</button>
        <button id="motion" aria-pressed="false">움직임 끄기</button>
        <button id="next" class="primary">다음 ▶</button>
      </div>
      <p class="hint">키보드 ← → 로도 넘길 수 있어요</p>
    </section>
    <aside class="panel" id="panel">
      <div class="chips"><span class="chip stage" id="stagechip"></span><span class="chip" id="placechip"></span></div>
      <p class="stepno" id="stepno"></p>
      <h2 id="title"></h2>
      <div class="easy"><span class="lbl">쉽게 말하면</span><p id="easy"></p></div>
      <div class="book"><span class="lbl">교과서 설명</span><p id="book"></p></div>
      <div class="chips keys" id="keys"></div>
      <button id="o2" aria-pressed="false" hidden>산소 없애 보기</button>
      <div class="ledger">
        <span class="lbl">지금까지 모은 것 (포도당 1분자 기준)</span>
        <div class="row">
          <div class="cell" id="L-atp"><div class="k">ATP</div><div class="v">0</div></div>
          <div class="cell" id="L-nadh"><div class="k">NADH</div><div class="v">0</div></div>
          <div class="cell" id="L-fadh2"><div class="k">FADH₂</div><div class="v">0</div></div>
          <div class="cell" id="L-co2"><div class="k">CO₂</div><div class="v">0</div></div>
        </div>
        <p class="note" id="lnote"></p>
      </div>
    </aside>
  </main>
  <div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-labelledby="ztitle">
    <div class="zbox">
      <div class="zhead"><span class="chip stage" id="zchip">자세히 보기</span><h3 id="ztitle"></h3><button id="zclose">✕ 닫기</button></div>
      <div class="zbody">
        <div class="zplate" id="zsvg" role="img"></div>
        <div class="ztext">
          <p class="stepno" id="zno"></p>
          <div class="easy"><span class="lbl">쉽게 말하면</span><p id="zeasy"></p></div>
          <div class="book"><span class="lbl">교과서 설명</span><p id="zbook"></p></div>
          <div class="zctl"><button id="zprev">◀ 이전</button><button id="zreplay">↻ 다시 보기</button><button id="znext" class="primary">다음 ▶</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
/* 수업 화면에서는 항상 움직이도록 기본값을 켬 (기기의 '애니메이션 줄이기' 설정과 무관). 필요하면 '움직임 끄기' 버튼으로 끔 */
let RM = false; try{ RM = localStorage.getItem('still')==='1'; }catch(e){}
const sec = s => RM ? 0.001 : s;
let noO2 = false;

/* ---------- 그림 도구 ---------- */
const SUB = {'NAD+':'NAD⁺','FADH2':'FADH₂','CO2':'CO₂','H2O':'H₂O','O2':'O₂','NADP+':'NADP⁺'};
const KIND = {
  'NADH':{f:'#e8589a',t:'#fff',s:'#c43d7d'}, 'NAD+':{f:'#fde3ee',t:'#a8275f',s:'#e8589a'},
  'FADH2':{f:'#4a9f57',t:'#fff',s:'#357a40'}, 'FAD':{f:'#e0f2db',t:'#2f7a3a',s:'#4a9f57'},
  'ATP':{f:'#f28c28',t:'#fff',s:'#c96a10'}, 'ADP':{f:'#ffecd2',t:'#a85a0d',s:'#f28c28'},
  'CoA':{f:'#8a6fd1',t:'#fff',s:'#6a51b0'}, 'CO2':{f:'#8f9ba7',t:'#fff',s:'#6f7b87'},
  'O2':{f:'#e5534b',t:'#fff',s:'#b83a33'}, 'H2O':{f:'#5fb4e6',t:'#fff',s:'#3a8fc2'},
  'plain':{f:'#ffffff',t:'#2b3a40',s:'#9fb2b6'}
};
const tw = s => 18 + [...s].reduce((a,c)=>a+(/[가-힣]/.test(c)?16:/[A-Z0-9]/.test(c)?11:8),0);
/* 그림 글자 크기: 작은 글자일수록 더 크게 키움 */
const fz = s => s<=18 ? s+5 : s<=24 ? s+4 : s+2;
const twb = s => Math.round(tw(s)*1.25);
function tag(x,y,label,kind,big){
  const k = KIND[kind||label]||KIND.plain, txt = SUB[label]||label, h = big?44:38, w = twb(txt)+(big?10:0);
  return `<g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${k.f}" stroke="${k.s}" stroke-width="1.6"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="${big?22:19}" font-weight="700" fill="${k.t}">${txt}</text></g>`;
}
const C = (x,y,r=14)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gC)" stroke="#2a5aa8" stroke-width="1.2"/>`;
const bond = (x1,y1,x2,y2,c='#2a5aa8')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;
function row(n,x,y,gap=34,r=14){let s='';for(let i=0;i<n-1;i++)s+=bond(x+i*gap,y,x+(i+1)*gap,y);for(let i=0;i<n;i++)s+=C(x+i*gap,y,r);return s;}
const P = (x,y)=>`<g><circle cx="${x}" cy="${y}" r="14" fill="#ffd75e" stroke="#c99a12" stroke-width="1.5"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="900" fill="#7a5a00">P</text></g>`;
const Hp = (x,y)=>`<g><circle cx="${x}" cy="${y}" r="14" fill="#3aa0d8" stroke="#1f7fb5" stroke-width="1.2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">H⁺</text></g>`;
const E = (x,y)=>`<g><circle cx="${x}" cy="${y}" r="18" fill="url(#gE)"/><circle cx="${x}" cy="${y}" r="11" fill="#ffd23f" stroke="#e0a800" stroke-width="1.2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="900" fill="#7a5500">e⁻</text></g>`;
const co2m = (x,y)=>`<g><circle cx="${x-17}" cy="${y}" r="8" fill="#e5534b"/><circle cx="${x+17}" cy="${y}" r="8" fill="#e5534b"/>${C(x,y,12)}</g>`;
const T = (x,y,s,size=16,w=700,fill='#2b3a40',anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${fz(size)}" font-weight="${w}" fill="${fill}">${s}</text>`;
const halo = (x,y,s,size=16,w=700,fill='#2b3a40',anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${fz(size)}" font-weight="${w}" fill="${fill}" stroke="#fff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
const arrow = (d,c='#55707a',w=3,dash='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} marker-end="url(#ah)" style="color:${c}"/>`;
const place = (x,y,s,c='#2b3a40')=>`<g><rect x="${x}" y="${y-22}" width="${twb(s)+12}" height="36" rx="9" fill="#ffffffcc" stroke="${c}" stroke-width="1.2"/>${T(x+(twb(s)+12)/2,y+3,s,14,700,c)}</g>`;

/* 애니메이션 */
const ease = `calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"`;
function mv(inner,x1,y1,x2,y2,dur=1,begin=0){
  if(RM) return `<g transform="translate(${x2} ${y2})">${inner}</g>`;
  return `<g transform="translate(${x1} ${y1})">${inner}<animateTransform attributeName="transform" type="translate" from="${x1} ${y1}" to="${x2} ${y2}" dur="${dur}s" begin="${bt(begin)}" fill="freeze" ${ease}/></g>`;
}

function cluster(n,cx,cy,r=13){
  const R = n<=2?16:n===3?20:n===4?22:n===5?25:28;
  const pts=[];
  for(let i=0;i<n;i++){const a=(n===2?0:-Math.PI/2)+i*2*Math.PI/n; pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  let s='';
  for(let i=0;i<n;i++){ if(n===2&&i===1)break; const a=pts[i],b=pts[(i+1)%n]; s+=bond(a[0],a[1],b[0],b[1]); }
  pts.forEach(p=>s+=C(p[0],p[1],r));
  return s;
}

function ledgerAt(si,st){
  const v={atp:0,nadh:0,fadh2:0,co2:0};
  EVENTS.forEach(([a,b,d])=>{ if(a<si||(a===si&&b<=st)) for(const k in d) v[k]+=d[k]; });
  return v;
}

  });
  prevLedger=shown;
  $('lnote').textContent = (si===3&&st===5&&!off) ? 'NADH·FADH₂가 모두 ATP로 바뀌었어요. NADH 10 × 2.5 + FADH₂ 2 × 1.5 + 기질수준인산화 4 = 최대 32 (교과서: 포도당 1분자당 최대 32ATP)' : (NOTES[si]||'');
  try{ history.replaceState(null,'',`#s${si+1}`);}catch(e){}
}
function go(a,b){ si=a; st=b; render(); }
function next(){ const S=STAGES[si]; if(st<S.steps.length-1) st++; else if(si<STAGES.length-1){si++;st=0;} render(); }
function prev(){ if(st>0) st--; else if(si>0){si--;st=STAGES[si].steps.length-1;} render(); }
$('next').onclick=$('bnext').onclick=next; $('prev').onclick=$('bprev').onclick=prev;
function motionLabel(){ const b=document.getElementById('motion'); if(b){ b.textContent = RM ? '움직임 켜기' : '움직임 끄기'; b.setAttribute('aria-pressed', RM); } }
document.getElementById('motion').onclick=()=>{ RM=!RM; try{localStorage.setItem('still',RM?'1':'0');}catch(e){} motionLabel(); render(); };
motionLabel();
$('replay').onclick=render;
$('o2').onclick=()=>{noO2=!noO2; render();};
/* ---------- 자세히 보기 팝업 ---------- */
let zk=null, zi=0, zback=null;
const zopen=()=>!$('zoom').hidden;
function zrender(){
  const st=ZSTEPS[zk][zi];
  TRIG=null;
  $('zsvg').innerHTML=`<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">${DEFS}${ZOOM[ZKEYS[zk][zi]]()}</svg>`;
  $('zsvg').setAttribute('aria-label',st.t);
  $('ztitle').textContent=st.t; $('zno').textContent=`${ZNAME[zk]} ${zi+1} / 3`;
  $('zeasy').textContent=st.e; $('zbook').textContent=st.b;
  $('zprev').disabled=zi===0; $('znext').disabled=zi===2;
}
function openZ(k){ zk=k; zi=0; zback=document.activeElement; $('zoom').hidden=false; zrender(); $('zclose').focus(); }
function closeZ(){ $('zoom').hidden=true; $('zsvg').innerHTML=''; if(zback&&zback.focus) zback.focus(); }
$('zclose').onclick=closeZ;
$('zprev').onclick=()=>{ if(zi>0){zi--;zrender();} };
$('znext').onclick=()=>{ if(zi<2){zi++;zrender();} };
$('zreplay').onclick=zrender;
$('zoom').addEventListener('click',e=>{ if(e.target.id==='zoom') closeZ(); });
document.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-zoom]'); if(t && !zopen()) openZ(t.dataset.zoom); });
document.addEventListener('keydown',e=>{
  if(!zopen()) return;
  if(e.key==='Escape') closeZ(); else if(e.key==='ArrowRight') $('znext').click(); else if(e.key==='ArrowLeft') $('zprev').click(); else return;
  e.preventDefault(); e.stopImmediatePropagation();
},true);
document.addEventListener('keydown',e=>{ if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return; if(e.key==='ArrowRight'){next();e.preventDefault();} if(e.key==='ArrowLeft'){prev();e.preventDefault();} });
const h=location.hash.match(/^#s([1-4])$/); if(h) si=+h[1]-1;
render();
})();
</script>
