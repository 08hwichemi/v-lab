<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화학 전지 실험실 · V-Lab</title>
<style>
/* V-Lab 공용 글꼴·색 토큰만 가져옴 (공용 클래스는 이 파일의 클래스 이름과 겹치므로 lab-theme.css 전체는 쓰지 않음) */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
:root{--font: 'IBM Plex Sans KR', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; --bg: #ffffff; --panel: #ffffff; --panel-2: #F7F8FA; --line: #E6E8EC; --line-2: #F0F1F3; --text: #111111; --text-2: #3F4652; --muted: #6B7280; --accent: #3182F6; --accent-soft: #EAF2FF; --ok: #12A66B; --warn: #F5A623; --err: #E5484D; --radius: 12px; --radius-sm: 8px;}
</style>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#1d2433;--sub:#5b6577;--line:#dde2ea;--pri:#2f6fed;--pri2:#e8efff;--ok:#1f9d61;--warn:#c26a12;--bad:#d64545;--hh:58px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{height:var(--hh);background:#152238;color:#fff;padding:0 16px;display:flex;align-items:center;gap:14px}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.studybtn{margin-left:auto;border:1px solid #3a4b6b;background:#1f3150;color:#e5ecf8;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.modes{display:flex;gap:6px;background:#0c1525;padding:4px;border-radius:12px}
.modes button{border:0;background:transparent;color:#c9d4ea;padding:8px 16px;border-radius:9px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit}
.modes button.on{background:#fff;color:#152238}
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 350px;gap:10px;padding:10px;height:calc(100vh - var(--hh))}
.app>aside{overflow:auto;min-height:0}
main{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
@media(max-width:1250px){.app{height:auto;grid-template-columns:290px minmax(0,1fr)}#side{grid-column:1/-1;max-height:none}.app>aside,main{overflow:visible}}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cardh{padding:7px 12px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.fsbtn{margin-left:auto;border:1px solid var(--line);background:#f6f8fb;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:13px;font-weight:700;color:#334;font-family:inherit}
.fsbtn:hover{background:#e8efff}
.sec{padding:9px 12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12.5px;flex:none}
.lbl{font-size:13.5px;color:var(--sub);margin:7px 0 4px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip:hover{border-color:#9db6f5}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip small{opacity:.7}
.picked{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #cfdaf3;background:#f3f7ff;border-radius:9px;margin-top:5px;font-size:14.5px}
.picked .k{color:var(--sub);font-weight:700;font-size:13.5px;flex:none}
.picked b{flex:1}
.picked button{border:0;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--pri);font-weight:700}
.btn{border:0;background:var(--pri);color:#fff;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.orange{background:#fff1e2;color:#a85707}
.btn.full{width:100%;margin-top:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=range]{width:100%;accent-color:var(--pri)}
.recipe{background:#f7f9fc;border:1px dashed #c9d3e3;border-radius:8px;padding:6px 8px;font-size:13.5px;line-height:1.5;margin-top:5px}
.beakerbox{border:1px solid var(--line);border-radius:10px;padding:7px 8px;margin-top:6px}
.beakerbox>b{font-size:14px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr);gap:10px;align-items:start}
.lcol{display:flex;flex-direction:column;gap:10px;min-width:0}
@media(max-width:1500px){.stage{grid-template-columns:1fr}}
canvas{display:block;width:100%;height:auto}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter{background:#101a2b;color:#fff;border-radius:12px;padding:6px 12px}
.meter .k{font-size:13px;color:#9fb0cc}
.meter .v{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:22px;font-weight:700;color:#7CFFB2;white-space:nowrap}
.meter .v.i{color:#ffd166}.meter .v.t{color:#cfe0ff;font-size:17px;font-family:inherit;padding-top:3px}
#warn{height:38px;flex:none;position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 6px 0 12px;font-size:14px}
#warn.w{background:#fff4e6;border-color:#f5c58e;color:#7a4206}
#warn.n{background:#eef5ff;border-color:#bcd3f7;color:#1f3f75}
#warn .wtxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#warn .wtxt.slide{animation:wslide .45s ease}
@keyframes wslide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#warn .wcnt{flex:none;font-size:12.5px;font-weight:700;opacity:.7}
#warn .wmore{flex:none;border:1px solid currentColor;background:#fff;color:inherit;border-radius:8px;padding:3px 9px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
#warn .wpop{position:absolute;top:42px;left:0;right:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;color:var(--ink)}
.mis.cur{border-color:#2f6fed;background:#f5f8ff}
.ovbox .q{font-size:17px;font-weight:800;color:#5a3ea8;margin:12px 0 10px}
.ovbox .opts{display:flex;flex-direction:column;gap:8px}
.ovbox .opts button{border:2px solid #dde2ea;background:#f8faff;border-radius:12px;padding:12px 14px;text-align:left;font-size:16px;cursor:pointer;font-family:inherit;font-weight:700}
.ovbox .opts button:hover{border-color:#2f6fed;background:#eef4ff}
.ovbox .verdict{font-size:17px;font-weight:800;margin:10px 0}
.ovbox .exp{font-size:15.5px;line-height:1.65;background:#f2fbf6;border-left:4px solid #1f9d61;padding:10px 12px;border-radius:8px}
.ovbox .go{margin-top:16px;width:100%;font-size:16px;padding:11px}
.wbox{border-radius:10px;padding:6px 11px;font-size:14px;line-height:1.4}
.wbox.w{background:#fff4e6;border:1px solid #f5c58e;color:#7a4206}
.wbox.n{background:#eef5ff;border:1px solid #bcd3f7;color:#1f3f75}
#side{display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:#f7f9fc;padding:10px 4px;font-weight:700;cursor:pointer;color:var(--sub);font-family:inherit;font-size:14.5px}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.tabbody{padding:10px 12px;overflow:auto;flex:1;min-height:0}
.mis{border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:8px}
.mis.done{border-color:#9ad7b8;background:#f2fbf6}
.mis .mt{font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center}
.mis .md{font-size:14px;color:#3a4558;line-height:1.55;margin:4px 0}
.mis .grp{font-size:11.5px;background:#eef2f8;color:#56627a;border-radius:6px;padding:1px 6px;font-weight:700}
.mis .pq{font-size:14px;font-weight:700;margin:5px 0 4px;color:#5a3ea8}
.mis .ex{font-size:14px;background:#fff;border-left:3px solid var(--ok);padding:6px 8px;margin-top:6px;line-height:1.55}
.badge{margin-left:auto;font-size:12px;padding:2px 7px;border-radius:20px;background:#eef1f6;color:#667;flex:none}
.badge.ok{background:var(--ok);color:#fff}
.prog{font-size:14px;margin-bottom:6px;color:var(--sub)}
.prog .bar{height:7px;background:#e8ecf3;border-radius:5px;overflow:hidden;margin-top:4px}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.misSec{font-weight:800;font-size:15px;margin:10px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center}
th{background:#f4f6fa}
.th h4{margin:14px 0 6px;font-size:15.5px}
.th h4:first-child{margin-top:0}
.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:16px;background:#f7f9fc;border-radius:8px;padding:6px 9px;margin:4px 0;line-height:1.6}
.th p,.th li{font-size:14px;line-height:1.6;color:#2f3a4d}
.th ul{padding-left:18px;margin:4px 0}
.ebar{display:flex;align-items:center;gap:6px;font-size:13.5px;margin:3px 0}
.ebar .nm{width:76px}
.ebar .tr{flex:1;height:12px;background:#eef1f6;border-radius:4px;position:relative}
.ebar .tr i{position:absolute;top:0;bottom:0;border-radius:4px}
.ebar .vv{width:52px;text-align:right;font-family:ui-monospace,monospace}
.small{font-size:13.5px;color:var(--sub)}
.adv{margin-top:16px;padding:8px 10px;border-radius:10px;background:#fff4e6;border:1px solid #f5c58e;color:#7a4206;font-size:14px;font-weight:700}
.ready{font-size:14.5px}
#banner:empty{display:none}
#banner{background:#152238;color:#fff;border-radius:12px;padding:9px 14px;font-size:15px;line-height:1.5;flex:none}
#banner b{color:#ffe58a}
.tipbtn{border:1px solid #f2d48a;background:#fff8e1;color:#8a5a00;border-radius:8px;padding:3px 9px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13.5px;margin-left:6px}
.tipbox{margin-top:6px;background:#fff8e1;border:1px solid #f2d48a;color:#6b4a00;border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.5}
#banner .tipbox{background:#2a3a58;border-color:#46597d;color:#ffe9a8}
.bbtn{border:0;background:#ffe58a;color:#152238;border-radius:8px;padding:4px 10px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;margin-left:6px}
.ov{position:fixed;inset:0;background:rgba(12,20,35,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.hide{display:none}
.ovbox{background:#fff;border-radius:18px;max-width:660px;width:100%;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ovbox h2{margin:0 0 6px;font-size:23px}
.ovbox p{margin:0 0 16px;color:#5b6577;font-size:15px;line-height:1.5}
.ovchoices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.ovchoices{grid-template-columns:1fr 1fr}}
/* 노트북(좁은 PC): 실험 창은 세로로, 패널은 각자 스크롤 */
@media(max-width:1500px) and (min-width:1251px){.stage{grid-template-columns:1fr}}
/* 태블릿 */
@media(max-width:1250px){
  header{height:auto;min-height:var(--hh);flex-wrap:wrap;padding:8px 12px}
  .app{height:auto}
  .stage{grid-template-columns:1fr}
  #side{min-height:420px}
  .tabbody{max-height:70vh}
}
@media(max-width:1250px) and (min-width:900px){ .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
/* 세로 태블릿·휴대폰 */
@media(max-width:820px){
  #ctrl .sec{padding:8px 10px}
  .chip{padding:8px 10px;min-height:36px}
  .btn{min-height:38px}
}
/* 휴대폰 */
@media(max-width:600px){
  body{font-size:14px}
  header{gap:6px;padding:8px 10px}
  header h1{font-size:17px;flex:1 1 100%}
  .studybtn{margin-left:0;font-size:12.5px;padding:6px 9px}
  .modes{margin-left:auto}
  .modes button{padding:6px 10px;font-size:13.5px}
  .app{padding:6px;gap:8px}
  main{gap:8px}
  .meters{gap:5px}
  .meter{padding:5px 8px}
  .meter .k{font-size:11.5px}
  .meter .v{font-size:16px}
  .meter .v.t{font-size:12.5px}
  .cardh{font-size:14px;padding:6px 10px}
  .fsbtn{font-size:12px;padding:2px 7px}
  #banner{font-size:13.5px;padding:8px 10px}
  #warn{font-size:12.5px;height:36px}
  .ovbox{padding:18px 16px}
  .ovbox h2{font-size:19px}
  .tabs button{font-size:13px;padding:9px 2px}
  .mis .md,.mis .ex{font-size:13.5px}
}
.ovchoices button{border:2px solid #dde2ea;background:#f8faff;border-radius:14px;padding:18px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:8px}
.ovchoices button:hover{border-color:#2f6fed;background:#eef4ff}
.ovchoices b{font-size:17px;color:#152238}
.ovchoices button.sel{border-color:#2f6fed;background:#e8efff;box-shadow:0 0 0 2px #2f6fed inset}
.stepT{font-weight:800;font-size:15.5px;margin:12px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ovchoices button{align-items:center;text-align:center;padding:16px}
.infol{border:1px solid #c9d6f3;background:#f3f7ff;color:#2f6fed;border-radius:20px;padding:3px 10px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.infol:hover{background:#e3ecff}
.info h3{margin:16px 0 6px;font-size:16px}
.info p,.info li{font-size:15px;line-height:1.65;color:#2f3a4d;margin:4px 0}
.info ul{padding-left:20px;margin:4px 0}
.info svg{width:100%;height:auto;background:#f7f9fc;border-radius:12px;margin-top:6px}
.ovchoices span{font-size:14px;color:#4b5566;line-height:1.5}
/* 전체 화면 */
.card.fs{position:fixed;inset:0;z-index:80;border-radius:0;display:flex;flex-direction:column;background:#fbfcfe}
.card.fs canvas{flex:1;min-height:0;width:100%;height:100%;object-fit:contain}
.card.fs .cardh{font-size:17px}

/* ===== V-Lab 공용 테마에 맞춘 덮어쓰기 ===== */
:root{--bg:#fff;--card:#fff;--ink:#111;--sub:#6B7280;--line:#E6E8EC;--pri:#3182F6;--pri2:#EAF2FF;--ok:#12A66B;--warn:#F5A623;--bad:#E5484D}
body{font-family:var(--font);letter-spacing:-0.012em;-webkit-font-smoothing:antialiased}
header{background:#fff;color:#111;border-bottom:1px solid var(--line)}
header h1{font-weight:600;font-size:18px;letter-spacing:-.02em}
body.vlab-embed header h1{display:none}
.studybtn{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;font-weight:600}
.studybtn:hover{background:#F7F8FA}
.modes{background:var(--line-2,#F0F1F3);border-radius:8px}
.modes button{color:#3F4652;border-radius:6px;font-weight:600}
.modes button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.app{padding:14px 16px;gap:14px}
.card{border-radius:12px}
.cardh,.sec h3,.misSec,.mis .mt,.ovbox h2,.stepT,.th h4,.info h3{font-weight:600}
.chip,.btn,.fsbtn,.picked,.recipe,.beakerbox,.wbox,.tipbtn,.tipbox,.bbtn,.infol,.mis,.ovbox .opts button{border-radius:8px}
.chip:hover{border-color:var(--pri)}
.btn{font-weight:600}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.meter{background:#111;border-radius:10px}
.meter .v{font-family:var(--mono);color:#7CFFB2}
.tabs button{background:#F7F8FA;font-weight:600}
.tabs button.on{background:#fff;color:#111;box-shadow:inset 0 -2px 0 var(--pri)}
#banner{background:#111;border-radius:10px}
#banner .tipbox{background:#2a2a2a;border-color:#444}
.ovbox{border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.ovchoices button,.ovchoices button.sel{border-radius:10px}
.ovchoices button.sel{border-color:var(--pri);background:var(--pri2);box-shadow:0 0 0 2px var(--pri) inset}
.ovbox .q,.mis .pq{color:#111}
.badge.ok{background:var(--ok)}
.prog .bar i{background:var(--ok)}
.eq{background:#F7F8FA;border-radius:8px}
th{background:#F7F8FA}
.card.fs{background:#fff}
</style>
</head>
<body>
<script>if(/embed/.test(location.hash))document.body.classList.add("vlab-embed");</script>
<header>
  <h1>⚡ 화학 전지 실험실</h1>
  <button class="studybtn" id="studyBtn">📚 처음 화면</button>
  <div class="modes" id="modes">
    <button data-mode="volta">볼타 전지</button>
    <button data-mode="daniel">다니엘 전지</button>
  </div>
</header>
<div id="popOv" class="ov hide" style="z-index:60"><div class="ovbox" id="popBox"></div></div>
<div id="infoOv" class="ov hide" style="z-index:70"><div class="ovbox" id="infoBox" style="max-width:760px;max-height:92vh;overflow:auto"></div></div>
<div id="studyOv" class="ov"><div class="ovbox">
  <h2>⚡ 화학 전지 실험실</h2>
  <div class="stepT">1. 어떤 전지를 만들까요? <button class="infol" data-info="volta">볼타 전지란?</button><button class="infol" data-info="daniel">다니엘 전지란?</button></div>
  <div class="ovchoices">
    <button data-pickmode="volta"><b>🔋 볼타 전지</b></button>
    <button data-pickmode="daniel"><b>⚗️ 다니엘 전지</b></button>
  </div>
  <div class="stepT">2. 어떻게 공부할까요?</div>
  <div class="ovchoices">
    <button data-study="mission"><b>🎯 미션 · 도전</b></button>
    <button data-study="free"><b>🧪 자유 실험</b></button>
  </div>
  <button class="btn go" id="startBtn" disabled>시작하기</button>
</div></div>

<div class="app">
  <aside id="ctrl" class="card"></aside>

  <main>
    <div id="banner"></div>
    <div id="warn"></div>
    <div class="stage">
      <div class="lcol">
        <div class="card" id="cardMacro">
          <div class="cardh">🧪 실험대 <button class="fsbtn" data-shot="macro" data-name="bench">📷 이미지 저장</button><button class="fsbtn" data-fs="cardMacro" style="margin-left:0">⛶ 크게 보기</button></div>
          <canvas id="macro"></canvas>
        </div>
        <div class="meters">
          <div class="meter"><div class="k">전압계</div><div class="v" id="mV">—</div></div>
          <div class="meter"><div class="k">전류계</div><div class="v i" id="mI">—</div></div>
          <div class="meter"><div class="k">회로 상태</div><div class="v t" id="mS">—</div></div>
        </div>
        <div class="card" id="cardGraph">
          <div class="cardh">📈 전압·전류 <span style="font-weight:600;font-size:13.5px"><span style="color:#2f6fed">━ 전압(V)</span> <span style="color:#e67700">━ 전류(mA)</span></span><button class="fsbtn" data-shot="graph" data-name="voltage-graph">📷 이미지 저장</button><button class="fsbtn" data-fs="cardGraph" style="margin-left:0">⛶ 크게 보기</button></div>
          <canvas id="graph"></canvas>
        </div>
      </div>
      <div class="card" id="cardMicro">

</div>

<script>
/* ================= 데이터 ================= */
const F = 96485, K59 = 0.05916;
const METALS = {
  Mg:{name:'마그네슘',E:-2.37,n:2,M:24.31,plate:'#c3c8ce',ion:'Mg²⁺',ic:'#9aa0a6'},
  Al:{name:'알루미늄',E:-1.66,n:3,M:26.98,plate:'#d5d9de',ion:'Al³⁺',ic:'#b8bec6'},
  Zn:{name:'아연',E:-0.76,n:2,M:65.38,plate:'#9aa4ae',ion:'Zn²⁺',ic:'#b49ee6'},
  Fe:{name:'철',E:-0.44,n:2,M:55.85,plate:'#6f747b',ion:'Fe²⁺',ic:'#86cf80'},
  Pb:{name:'납',E:-0.13,n:2,M:207.2,plate:'#5b6270',ion:'Pb²⁺',ic:'#c7c48f'},
  Cu:{name:'구리',E:0.34,n:2,M:63.55,plate:'#c8733a',ion:'Cu²⁺',ic:'#2f7ee0'},
  Ag:{name:'은',E:0.80,n:1,M:107.87,plate:'#e1e5ea',ion:'Ag⁺',ic:'#8d99a8'}
};
const ORDER = ['Mg','Al','Zn','Fe','Pb','Cu','Ag'];
const SALTS = {
  Mg:{f:'MgSO₄',Mr:120.37,per:1,an:'SO4'}, Al:{f:'Al₂(SO₄)₃',Mr:342.15,per:2,an:'SO4'},
  Zn:{f:'ZnSO₄',Mr:161.45,per:1,an:'SO4'}, Fe:{f:'FeSO₄',Mr:151.91,per:1,an:'SO4'},
  Pb:{f:'Pb(NO₃)₂',Mr:331.2,per:1,an:'NO3'}, Cu:{f:'CuSO₄',Mr:159.61,per:1,an:'SO4'},
  Ag:{f:'AgNO₃',Mr:169.87,per:1,an:'NO3'}
};
const ACIDS = { H2SO4:{f:'H₂SO₄',name:'묽은 황산',Mr:98.08,h:2,an:'SO4'}, HCl:{f:'HCl',name:'묽은 염산',Mr:36.46,h:1,an:'Cl'} };
const ETA_H = {Mg:0.30,Al:0.28,Zn:0.30,Fe:0.12,Pb:0.40,Cu:0.15,Ag:0.10};   // 수소 과전압(시뮬레이션용 근사값, V)
// 금속판이 산과 직접 반응하는 세기(국부 반응). 이온화 경향 순서를 따르되 가장 느린 납도 보이게 설정
const LOCALV = {Mg:1.2,Al:0.8,Zn:0.5,Fe:0.3,Pb:0.15,Cu:0,Ag:0};      // 확대 화면 사건 수(/s, [H⁺]=2 M 기준)
const LOCAL = Object.fromEntries(Object.entries(LOCALV).map(([k,v])=>[k,v*0.003])); // 질량 변화용(A)
// 반응 속도 표시용 전류: 순서는 유지하고 차이는 줄여서(제곱근) 느린 반응도 눈에 보이게 함. 전류계 값은 실제 계산값 그대로
const IREF=0.066; const Ik=I=>I>0?IREF*Math.sqrt(I/IREF):0;
const RATE=I=>I>2e-5?clamp(0.7*Math.sqrt(I/IREF),0.45,1.5):0;
const BRIDGES = {
  KNO3:{name:'KNO₃ 염다리',r:8,cat:'K',an:'NO3'},
  KCl:{name:'KCl 염다리',r:8,cat:'K',an:'Cl'},
  none:{name:'연결 안 함',r:Infinity}
};
const LOADS = {none:'없음',bulb:'꼬마전구',wire:'도선만'};
const SPEEDS = [0,1,150,300,600];

/* ================= 상태 ================= */
const S = {mode:'daniel',L:{metal:null,sol:null,c:1},R:{metal:null,sol:null,c:1},acid:{type:null,c:1},
  bridge:null,load:null,amm:false,volt:true,nCells:1,speed:1,running:true,study:null};
const DR = {L:{sol:null,c:1},R:{sol:null,c:1},acid:{type:null,c:1}};
let D, O = {};
let tab = 'mis';
const MS = {};
const RECS = [];
const AUTO = {on:false,int:2,rows:[],acc:0,seg:0,lastCond:''};

/* ================= 유틸 ================= */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a*b/gcd(a,b);
const jo=(w,y,n)=>{const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+y;const f=(c-0xAC00)%28;return w+((f===0||(y==='으로'&&f===8))?n:y);};   // 받침에 맞는 조사
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sciT(x,p=2){ if(!isFinite(x))return '∞'; if(x===0)return '0'; const ax=Math.abs(x);
  if(ax>=0.001&&ax<1e4) return String(+x.toPrecision(p+1));
  const e=Math.floor(Math.log10(ax)), m=x/Math.pow(10,e);
  return m.toFixed(1)+'×10'+String(e).split('').map(c=>SUP[c]).join(''); }
function fmtC(c){ return c>=0.1? c.toFixed(2) : c>=0.001? String(+c.toPrecision(2)) : sciT(c,1); }
function fmtT(t){ if(t<60) return t.toFixed(1)+' s'; if(t<3600){const m=Math.floor(t/60);return m+'분 '+Math.floor(t-m*60)+'초';}
  const h=Math.floor(t/3600); return h+'시간 '+Math.floor((t-h*3600)/60)+'분'; }
const cToSl=c=>Math.round(1000*Math.log(c/0.001)/Math.log(2000));
const slToC=v=>+(0.001*Math.pow(2000,v/1000)).toPrecision(2);
const aToSl=c=>Math.round(1000*Math.log(c/0.05)/Math.log(60));
const slToA=v=>+(0.05*Math.pow(60,v/1000)).toPrecision(2);
function solReady(sd){ return S.mode==='volta'? !!S.acid.type : !!S[sd].sol; }
function ready(){ return !!(S.L.metal&&S.R.metal&&solReady('L')&&solReady('R')&&(S.mode==='volta'||S.bridge)&&S.load); }
const BR=()=>BRIDGES[S.bridge]||{};

/* ================= 동역학 상태 ================= */
function resetDyn(){
  D={t:0,theta:0,dep:0,depType:null,usedDep:false,peakTheta:0,ionsL:{},ionsR:{},ionsV:{},H:0,
     dm:{L:0,R:0},coat:{L:0,R:0},depM:{L:null,R:null},hist:[]};
  if(S.L.sol) D.ionsL[S.L.sol]=S.L.c;
  if(S.R.sol) D.ionsR[S.R.sol]=S.R.c;
  if(S.acid.type) D.H=S.acid.c*ACIDS[S.acid.type].h;
  O=compute(); D.vmax=O.notReady?0:Math.abs(O.E||0);
  microReset(); macroFx.length=0;
}

/* ================= 전지 계산 ================= */
function compute(){
  if(!ready()) return {warn:[],note:[],notReady:true,emf:0,r:Infinity,E:0,Rint:Infinity,I:0,Vt:0,Vread:null,Iamm:null,bright:0,anodeSide:null};
  const o={warn:[],note:[]};
  if(S.mode==='volta') cellVolta(o); else cellDaniel(o);
  solve(o); return o;
}
function cellVolta(o){
  const mL=S.L.metal,mR=S.R.metal,H=Math.max(D.H,1e-7); o.H=H;
  o.r=0.6/(H+0.05)+1+4*D.theta;
  if(mL===mR){o.emf=0;o.anodeSide=null;o.warn.push('두 금속판이 같은 금속이면 전위차가 생기지 않아요 (0 V).');return;}
  const aS=METALS[mL].E<METALS[mR].E?'L':'R', an=aS==='L'?mL:mR, ca=aS==='L'?mR:mL;
  Object.assign(o,{anodeSide:aS,anM:an,caM:ca});
  o.cA=(D.ionsV[an]||0)+1e-4;
  o.Ean=METALS[an].E+K59/METALS[an].n*Math.log10(o.cA);
  o.pH2=1e-6+0.999*D.theta;
  o.EcN=K59/2*Math.log10(H*H/o.pH2); o.eta=ETA_H[ca]; o.pol=0.30*D.theta;
  o.Ecath=o.EcN-o.eta-o.pol;
  if(METALS[an].E>=0){o.noRxn=true;o.emf=0;o.anodeSide=null;
    o.warn.push(`${jo(METALS[an].name,'과','와')} ${jo(METALS[ca].name,'은','는')} 모두 수소보다 이온화 경향이 작아서 H⁺와 반응하지 않아요. 전지 반응이 일어나지 않습니다.`);return;}
  o.emf=Math.max(0,o.Ecath-o.Ean);
  if(an==='Al') o.note.push('알루미늄은 표면 산화막(Al₂O₃) 때문에 실제 실험에서는 이론값보다 낮은 전압이 측정되는 경우가 많아요.');
  if(an==='Mg') o.note.push('마그네슘은 산과 직접 격렬하게 반응해서 금속판 자체에서도 기포가 많이 생겨요(국부 반응). 금속이 빨리 소모돼요.');
}
function half(sd){
  // red: 용액에 실제로 있는 양이온 중 가장 환원되기 쉬운 것 / ox: 금속판(표면) 금속의 산화
  const s=S[sd],ions=D['ions'+sd],m=s.metal,so=s.sol;
  const kind= m===so?'match':(METALS[so].E>METALS[m].E?'direct':'inert');
  let red=null;
  for(const k in ions){ const c=ions[k]||0; if(c<=2e-6) continue; const E=METALS[k].E+K59/METALS[k].n*Math.log10(c); if(!red||E>red.E) red={couple:k,c,E,kind}; }
  const om=m;                                           // 직접 반응(판 표면이 용액 금속으로 덮임)은 경고로만 알리고, 산화 반쪽 반응은 판의 금속으로 나타냄
  const oc=Math.max(ions[om]||0,1e-6);
  return {red,ox:{couple:om,c:oc,E:METALS[om].E+K59/METALS[om].n*Math.log10(oc),kind},kind};
}
function totC(ions){let t=0;for(const k in ions)t+=ions[k]*METALS[k].n/2;return t;}
function zeroReason(L,R){
  const same=S.L.metal===S.R.metal&&S.L.sol===S.R.sol&&Math.abs(S.L.c-S.R.c)<1e-9;
  if(same) return '두 반쪽 전지의 금속판과 용액이 완전히 같아서 전위차가 없어요 (0 V).';
  const P=L.ox.E<=R.ox.E?'L':'R', Q=P==='L'?'R':'L', pm=S[P].metal;   // P: 더 잘 녹는 쪽 금속판
  const ions=Object.keys(D['ions'+Q]).filter(k=>(D['ions'+Q][k]||0)>2e-6);
  const nm=Q==='L'?'왼쪽':'오른쪽', so=S[Q].sol, left=D['ions'+Q][so]||0;
  if(D.t>0&&left<S[Q].c*0.01) return `전지가 다 닳았어요 (0 V). ${nm} 비커의 ${METALS[so].ion}이 거의 모두 ${jo(METALS[so].name,'으로','로')} 석출되어(${sciT(Math.max(left,1e-7),1)} M 남음), 전자를 받아 줄 이온이 없어요. 반응이 멈추니 염다리 이온도 더 이상 이동하지 않아요.`;
  const il=ions.map(k=>METALS[k].ion).join(', ')||'금속 이온';
  const ml=ions.map(k=>METALS[k].name).join(', ')||'그 금속';
  return `전압이 0 V예요. ${nm==='왼쪽'?'오른쪽':'왼쪽'} ${METALS[pm].name}판이 전자를 내놓더라도, ${nm} 비커 용액에는 ${il}만 있어요. 이 이온이 전자를 받아 금속이 되려면 그 금속(${ml})이 ${METALS[pm].name}보다 이온화 경향이 작아야 하는데, 크거나 같아요. 전자를 받아 줄 이온이 없으니 반응이 일어나지 않아요. (실제 실험에서는 물이나 H⁺가 전자를 받아 수소 기체가 생기면서 작은 전압이 측정될 수 있어요.)`;
}
function cellDaniel(o){
  const L=half('L'),R=half('R');
  const eA=L.red?L.red.E-R.ox.E:-9, eB=R.red?R.red.E-L.ox.E:-9;   // eA: 왼쪽이 (+)극, eB: 오른쪽이 (+)극
  if(Math.max(eA,eB)<=1e-6){ o.emf=0; o.anodeSide=null; o.hL=L.ox; o.hR=R.ox; o.warn.push(zeroReason(L,R)); }
  else if(eA>=eB){ o.anodeSide='R'; o.hL=L.red; o.hR=R.ox; o.emf=eA; }
  else { o.anodeSide='L'; o.hL=L.ox; o.hR=R.red; o.emf=eB; }
  o.halves={L,R};
  if(o.anodeSide){ const cs=other(o.anodeSide), c0=S[cs].c, cn=D['ions'+cs][S[cs].sol]||0;
    if(D.t>0&&cn<c0*0.1) o.note.push(`(+)극 쪽 ${METALS[S[cs].sol].ion}이 처음의 ${Math.max(1,Math.round(cn/c0*100))}%만 남았어요. 이온이 줄어들수록 전압이 낮아지고, 다 쓰이면 전지가 멈춰요.`); }
  if(o.anodeSide){ const cs=(o.anodeSide==='L'?o.hR:o.hL).couple; if(cs==='Mg'||cs==='Al') o.note.push(`이온화 경향에 따라 ${METALS[cs].ion}이 ${jo(METALS[cs].name,'으로','로')} 석출되는 것으로 나타냈어요. 실제 수용액에서는 ${METALS[cs].ion} 대신 물이 환원되어 수소 기체가 생겨요.`); }
  if(o.anodeSide){ o.Ean=(o.anodeSide==='L'?o.hL:o.hR).E; o.Ecath=(o.anodeSide==='L'?o.hR:o.hL).E; }
  let rb=BR().r;
  const ag=(S.L.sol==='Ag'||S.R.sol==='Ag'||(D.ionsL.Ag||0)>1e-4||(D.ionsR.Ag||0)>1e-4);
  if(S.bridge==='KCl'&&ag){rb*=4;o.agcl=true;
    o.warn.push('KCl 염다리의 Cl⁻이 Ag⁺와 만나 흰색 AgCl 앙금이 생겼어요. 염다리 끝이 막혀 저항이 커집니다 → 은 전극에는 KNO₃ 염다리를 쓰세요.');}
  o.r=rb+0.6/(totC(D.ionsL)+0.01)+0.6/(totC(D.ionsR)+0.01);
  [['L',L],['R',R]].forEach(([sd,h])=>{ const s=S[sd],side=sd==='L'?'왼쪽 비커':'오른쪽 비커', isCat=o.anodeSide&&o.anodeSide!==sd;
    if(h.kind==='direct') o.warn.push(`${side}: ${METALS[s.metal].name}판을 ${SALTS[s.sol].f} 용액에 넣어서 금속판 표면에서 직접 반응이 일어나요(${METALS[s.sol].name} 석출). 전자가 도선을 거치지 않으니 전지로서 효율이 떨어져요.`);
    if(h.kind==='inert'&&isCat) o.note.push(`${side}: ${METALS[s.metal].name}판은 반응하지 않고, 용액 속 ${METALS[o['h'+sd].couple].ion}이 판 위에 ${jo(METALS[o['h'+sd].couple].name,'으로','로')} 석출돼요.`);
    if(h.kind==='inert'&&o.anodeSide===sd) o.note.push(`${side}: ${METALS[s.metal].name}판이 녹아 ${METALS[s.metal].ion}이 새로 생겨요(용액에는 원래 없던 이온).`);
  });
  if(S.L.metal===S.R.metal&&L.kind==='match'&&R.kind==='match'&&o.anodeSide)
    o.note.push('같은 금속, 다른 농도 → 농도차 전지예요. 묽은 쪽이 (−)극이 됩니다.');
  if(S.L.metal==='Al'||S.R.metal==='Al') o.note.push('알루미늄은 산화막 때문에 실제로는 이론값보다 낮은 전압이 나오는 경우가 많아요.');
}
function solve(o){
  const n=S.nCells,E=o.emf*n,r=o.r*n; o.E=E;o.Rint=r;
  let I=0,Vt=E,Rs=0; o.open=false;o.short=false;
  if(!isFinite(r)){o.open=true;I=0;Vt=0;
    o.warn.push('두 용액이 연결되지 않아 회로가 끊겼어요. 이온이 이동할 통로(염다리)가 필요해요.');}
  else{
    const L=S.load;
    if(L==='none'){I=0;o.loopOpen=true;}
    else{
      Rs={wire:0.05,bulb:8}[L]+(S.amm?0.1:0);
      I = E/(r+Rs);
      Vt=E-I*r;
      if(L==='wire'&&I>2e-5){o.short=true;o.warn.push('⚠ 저항 없이 도선만 연결하면 단락이 되어 큰 전류가 흐르고 전지가 빨리 소모돼요.');}
    }
  }
  o.I=I;o.Vt=Vt;
  o.Vread = S.volt ? (o.open?0:E) : null;
  o.Iamm = S.amm ? I : null;
  o.bright=(S.load==='bulb'&&I>0.002)?0.8:0;
  if(S.mode==='volta'&&o.anodeSide&&D.theta>0.45&&I>0.002)
    o.note.push('(+)극 표면이 H₂ 기포로 덮이고 있어요 → 분극 현상! 전압이 떨어지는 것을 그래프로 확인해 보세요.');
}

/* ================= 시뮬레이션 단계 ================= */
function step(dt){
  if(!ready()) return;
  const o=compute(); D.t+=dt; const I=o.I||0;   // 패러데이 법칙: 전류계가 보여 주는 전류 그대로
  if(S.mode==='volta'){
    if(o.anodeSide){
      const an=o.anM,nA=METALS[an].n,V=0.05;
      const Iloc=LOCAL[an]*Math.min(D.H,6)/2, It=I+Iloc;
      D.ionsV[an]=(D.ionsV[an]||0)+It/(nA*F*V)*dt;
      D.H=Math.max(1e-7,D.H-It/(F*V)*dt);
      D.dm[o.anodeSide]-=It/(nA*F)*METALS[an].M*dt;
      const k=D.dep>0?(D.depType==='H2O2'?0.6:0.15):0;
      D.theta+=(0.9*I*(1-D.theta)-0.004*D.theta-k*D.theta)*dt;
      D.theta=clamp(D.theta,0,0.97);
      if(D.dep>0){D.dep-=dt*(D.depType==='H2O2'?0.004:0.0004);if(D.dep<=0){D.dep=0;D.depType=null;}}
      D.peakTheta=Math.max(D.peakTheta,D.theta);
    }
  } else {
    if(o.anodeSide&&I>0){
      const a=o.anodeSide,c=a==='L'?'R':'L',ha=a==='L'?o.hL:o.hR,hc=a==='L'?o.hR:o.hL,V=0.025;
      const ia=D['ions'+a],ic=D['ions'+c];
      ia[ha.couple]=(ia[ha.couple]||0)+I/(METALS[ha.couple].n*F*V)*dt;
      ic[hc.couple]=Math.max(1e-7,(ic[hc.couple]||0)-I/(METALS[hc.couple].n*F*V)*dt);
      D.dm[a]-=I/(METALS[ha.couple].n*F)*METALS[ha.couple].M*dt;
      D.dm[c]+=I/(METALS[hc.couple].n*F)*METALS[hc.couple].M*dt; D.depM[c]=hc.couple;
    }
    ['L','R'].forEach(sd=>{ const s=S[sd];
      if(s.metal!==s.sol&&METALS[s.sol].E>METALS[s.metal].E){
        const ions=D['ions'+sd],cs=ions[s.sol]||0;

const GW=640,GH=250;
function pushHist(){ D.hist.push({t:D.t,v:O.Vread,i:(O.I||0)*1000}); if(D.hist.length>1400) D.hist=D.hist.filter((_,i)=>i%2===0); }
function drawGraph(){
  const c=gg; c.clearRect(0,0,GW,GH); c.fillStyle='#fff';c.fillRect(0,0,GW,GH);
  const pl=54,pr=60,pt=14,pb=30,w=GW-pl-pr,h=GH-pt-pb, H=D.hist;
  c.strokeStyle='#e6eaf0';c.lineWidth=1;
  for(let k=0;k<=4;k++){const y=pt+h*k/4;c.beginPath();c.moveTo(pl,y);c.lineTo(pl+w,y);c.stroke();}
  c.strokeStyle='#9aa4b2';c.strokeRect(pl,pt,w,h);
  if(H.length<2){c.fillStyle='#8a94a6';c.font='600 13px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('전지를 완성하면 그래프가 그려져요',pl+w/2,pt+h/2);return;}
  const t0=H[0].t,t1=Math.max(H[H.length-1].t,t0+1);
  let vmax=0.2,vmin=0,imax=1; H.forEach(p=>{if(p.v!=null){vmax=Math.max(vmax,p.v);vmin=Math.min(vmin,p.v);}imax=Math.max(imax,p.i);});
  vmax*=1.12;imax*=1.15;
  const X=t=>pl+(t-t0)/(t1-t0)*w, YV=v=>pt+h-(v-vmin)/(vmax-vmin)*h, YI=i=>pt+h-i/imax*h;
  c.font='600 14px sans-serif';c.textBaseline='middle';
  for(let k=0;k<=4;k++){ const f=k/4;
    c.fillStyle='#2f6fed';c.textAlign='right';c.fillText((vmin+(vmax-vmin)*(1-f)).toFixed(2),pl-6,pt+h*f);
    c.fillStyle='#e67700';c.textAlign='left';c.fillText((imax*(1-f)).toFixed(imax<10?1:0),pl+w+6,pt+h*f); }
  c.fillStyle='#5b6577';c.textAlign='center';c.textBaseline='alphabetic';
  c.fillText('시간 →',pl+w/2,GH-9);
  c.save();c.translate(14,pt+h/2);c.rotate(-Math.PI/2);c.fillStyle='#2f6fed';c.fillText('전압 (V)',0,0);c.restore();
  c.save();c.translate(GW-12,pt+h/2);c.rotate(Math.PI/2);c.fillStyle='#e67700';c.fillText('전류 (mA)',0,0);c.restore();
  c.lineWidth=1.8;c.strokeStyle='#e67700';c.beginPath();H.forEach((p,i)=>{const x=X(p.t),y=YI(p.i);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
  c.lineWidth=2.4;c.strokeStyle='#2f6fed';c.beginPath();let st=false;H.forEach(p=>{if(p.v==null){st=false;return;}const x=X(p.t),y=YV(p.v);st?c.lineTo(x,y):c.moveTo(x,y);st=true;});c.stroke();
}

  else if(a==='bridge'){ S.bridge=x; UI.ed.br=false; }
  else if(a==='load')S.load=x;
  else if(a==='amm')S.amm=!S.amm;
  else if(a==='volt')S.volt=!S.volt;
  else if(a==='cells'){const k=+x/S.nCells;S.nCells=+x;if(D.vmax)D.vmax*=k;['vShake','vShakeMax','vDep','vDepMax'].forEach(q=>{if(D[q]!=null)D[q]*=k;});}
  else if(a==='speed'){ if(+x===0) S.running=false; else {S.running=true;S.speed=+x;} }

  renderCtrl();
});

function pair(a,ca,b,cb){return (hm(S.L,a,ca)&&hm(S.R,b,cb))||(hm(S.R,a,ca)&&hm(S.L,b,cb));}
function pairV(a,b){return (S.L.metal===a&&S.R.metal===b)||(S.L.metal===b&&S.R.metal===a);}
function ionShift(){ // (−)극 표면 금속 이온 증가, (+)극 표면 금속 이온 감소
  const o=O; if(!o.anodeSide||!M.init) return false;
  const a=o.anodeSide,c=other(a),as=anodeSpecies(o),cs=cathodeSpecies(o);
  return (countSide(a)[as]||0)-(M.init[a][as]||0)>=3 && (M.init[c][cs]||0)-(countSide(c)[cs]||0)>=3;
}

const ion=m=>METALS[m].ion, co=k=>k===1?'':k;
function thHTML(){
  const o=O; let h='<div class="th">';
  h+=`<h4>① 핵심 개념</h4><ul>
   <li><b>(−)극 = 산화 전극</b>: 전자를 내놓고 금속이 이온으로 녹아요(질량 감소, 표면 근처 금속 이온 증가).</li>
   <li><b>(+)극 = 환원 전극</b>: 전자를 받아 이온이 환원돼요(다니엘 전지: 금속 석출, 볼타 전지: H₂ 발생).</li>
   <li><b>전자</b>는 도선으로만, <b>이온</b>은 용액·염다리로만 이동해요.</li>
   <li><b>염다리</b>: 양이온은 (+)극 쪽, 음이온은 (−)극 쪽으로 이동해 두 용액의 전하 균형을 맞춰요.</li>
   <li><b>이동한 전자 수는 보존</b>돼요. Zn 1개가 내놓은 전자 2개로 Cu²⁺ 1개, 또는 Ag⁺ 2개가 석출돼요.</li>
   <li>이 실험실의 <b>전압계</b>는 전지의 <b>기전력</b>(전류가 흐르지 않을 때의 전압)을 보여 줘요. 실제로 꼬마전구를 켠 채 재면 내부 저항 때문에 이보다 작은 값(단자 전압)이 읽혀요.</li>
   <li><b>분극</b>: 볼타 전지의 (+)극이 H₂ 기포로 덮여 전압이 떨어지는 현상. <b>감극제</b>(MnO₂, H₂O₂ 등 산화제)로 막아요.</li>
   <li><b>국부 반응</b>: 볼타 전지의 아연판에서도 H⁺와 직접 반응해 기포가 생겨요. 이때 나온 전자는 도선으로 가지 않아요.</li></ul>`;
  h+='<h4>② 표준 환원 전위 E° (25 ℃)</h4>';
  const list=[...ORDER.map(m=>[`${ion(m)}/${m}`,METALS[m].E]),['2H⁺/H₂',0]].sort((x,y)=>x[1]-y[1]);
  list.forEach(([n,e])=>{ const L=(Math.min(e,0)+2.5)/3.4*100,W=Math.abs(e)/3.4*100;
    h+=`<div class="ebar"><span class="nm">${n}</span><span class="tr"><i style="left:${L}%;width:${W}%;background:${e<0?'#e9a19a':'#9cc2f2'}"></i><i style="left:${2.5/3.4*100}%;width:1px;background:#666"></i></span><span class="vv">${e>0?'+':''}${e.toFixed(2)}</span></div>`; });
  h+=`<p class="small">값이 작을수록(음수) 전자를 잃기 쉬워 (−)극이 되고, 클수록(양수) 환원되기 쉬워 (+)극이 돼요.</p>`;
  h+='<h4>③ 현재 전지의 반응식과 표준 기전력</h4>';
  let adv='';
  if(o.notReady) h+='<p class="small">금속판과 용액을 모두 고르면 이 전지의 반응식이 여기에 나타나요.</p>';
  else if(S.mode==='daniel'){
    if(o.anodeSide){
      const A=(o.anodeSide==='L'?o.hL:o.hR),C=(o.anodeSide==='L'?o.hR:o.hL),a=A.couple,c=C.couple;
      const na=METALS[a].n,nc=METALS[c].n,N=lcm(na,nc),ka=N/na,kc=N/nc,E0=METALS[c].E-METALS[a].E,conc=a===c;
      h+=`<div class="eq">(−)극 산화: ${a} → ${ion(a)} + ${co(na)}e⁻ &nbsp;<span class="small">E° = ${METALS[a].E.toFixed(2)} V</span></div>
      <div class="eq">(+)극 환원: ${ion(c)} + ${co(nc)}e⁻ → ${c} &nbsp;<span class="small">E° = ${METALS[c].E>0?'+':''}${METALS[c].E.toFixed(2)} V</span></div>
      <div class="eq">전체: ${conc?`${ion(c)}(진한 쪽) → ${ion(c)}(묽은 쪽)`:`${co(ka)}${a} + ${co(kc)}${ion(c)} → ${co(ka)}${ion(a)} + ${co(kc)}${c}`} &nbsp;<span class="small">(이동 전자 ${N}개)</span></div>
      <div class="eq">E° = E°(+) − E°(−) = ${METALS[c].E.toFixed(2)} − (${METALS[a].E.toFixed(2)}) = <b>${E0.toFixed(2)} V</b></div>`;
      if(A.kind!=='match'||C.kind!=='match') h+=`<p class="small">※ 금속판과 용액의 금속 이온이 다른 반쪽 전지가 있어서, 실제로 반응하는 금속-이온 쌍으로 나타냈어요.</p>`;
      const pa=S[o.anodeSide].metal, pc=S[o.anodeSide==='L'?'R':'L'].metal;
      adv=`<h4>전지의 선 표시법</h4>
      <div class="eq">${pa}(s) | ${ion(a)}(aq, ${fmtC(A.c)} M) ‖ ${ion(c)}(aq, ${fmtC(C.c)} M) | ${pc}(s)</div>
      <ul><li>왼쪽에 (−)극(산화 전극), 오른쪽에 (+)극(환원 전극)을 써요.</li><li><b>|</b> 는 상(고체·용액·기체)의 경계, <b>‖</b> 는 염다리를 뜻해요.</li><li>용액의 농도를 괄호 안에 함께 적어요.</li></ul>
      <h4>네른스트 식 (25 ℃) — 농도에 따른 전압</h4>
      <div class="eq">E = E° − (0.0592 / n) log Q</div>
      <div class="eq">Q = [${ion(a)}]${ka>1?'<sup>'+ka+'</sup>':''} / [${ion(c)}]${kc>1?'<sup>'+kc+'</sup>':''} = ${sciT(A.c)}${ka>1?'<sup>'+ka+'</sup>':''} / ${sciT(C.c)}${kc>1?'<sup>'+kc+'</sup>':''}</div>
      <div class="eq">E = ${E0.toFixed(3)} − (0.0592/${N}) × log(${sciT(Math.pow(A.c,ka)/Math.pow(C.c,kc))}) = <b>${o.emf.toFixed(3)} V</b></div>
      <h4>깁스 자유 에너지와 평형 상수</h4>
      <div class="eq">ΔG = −nFE = −${N} × 96485 × ${o.emf.toFixed(3)} = <b>${(-N*F*o.emf/1000).toFixed(1)} kJ</b></div>
      <div class="eq">ΔG° = −nFE° = ${(-N*F*E0/1000).toFixed(1)} kJ, &nbsp; K = 10<sup>nE°/0.0592</sup> = 10<sup>${(N*E0/K59).toFixed(1)}</sup></div>
      <p class="small">ΔG &lt; 0 이므로 자발적으로 일어나는 반응이에요. 반응이 진행될수록 Q가 커져 E가 줄고, Q = K가 되면 E = 0 (전지 수명 끝).</p>`;
    } else h+='<p>두 반쪽 전지의 전위가 같아서 전지 반응이 일어나지 않아요.</p>';
  } else {
    if(o.anodeSide){
      const a=o.anM,c=o.caM,na=METALS[a].n;
      h+=`<div class="eq">(−)극 ${METALS[a].name}판: ${a} → ${ion(a)} + ${co(na)}e⁻ &nbsp;<span class="small">E° = ${METALS[a].E.toFixed(2)} V</span></div>
      <div class="eq">(+)극 ${METALS[c].name}판 표면: 2H⁺ + 2e⁻ → H₂↑ &nbsp;<span class="small">E° = 0.00 V</span></div>
      <div class="eq">전체: ${(()=>{const k=lcm(na,2);return `${co(k/na)}${a} + ${k}H⁺ → ${co(k/na)}${ion(a)} + ${co(k/2)}H₂`})()}</div>
      <div class="eq">E° = 0.00 − (${METALS[a].E.toFixed(2)}) = <b>${(-METALS[a].E).toFixed(2)} V</b></div>
      <p class="small">(+)극의 ${jo(METALS[c].name,'은','는')} 반응하지 않아요. 전자를 받아 H⁺에 전달하는 통로예요. 지금 (+)극 표면을 H₂ 기포가 덮은 비율은 약 <b>${(D.theta*100).toFixed(0)}%</b>예요.</p>`;
      adv=`<h4>전지의 선 표시법</h4>
      <div class="eq">${a}(s) | ${ion(a)}(aq), H⁺(aq) | H₂(g) | ${c}(s)</div>
      <ul><li>왼쪽에 (−)극(산화 전극), 오른쪽에 (+)극(환원 전극)을 써요. <b>|</b> 는 상의 경계예요.</li><li>볼타 전지는 두 금속판이 같은 용액에 들어 있어서 염다리 표시(‖)가 없어요. (+)극에서는 H⁺가 환원되어 H₂(g)가 생기고, ${METALS[c].name}판은 전자를 전달하는 전극 역할만 해요.</li></ul>
      <h4>볼타 전지의 전압 계산과 분극</h4>
      <div class="eq">E(+) = 0 + (0.0592/2) log([H⁺]²/P<sub>H₂</sub>) − η<sub>과전압</sub> − η<sub>분극</sub></div>
      <div class="eq">= ${o.EcN.toFixed(3)} − ${o.eta.toFixed(2)} − ${o.pol.toFixed(3)} = <b>${o.Ecath.toFixed(3)} V</b></div>
      <p class="small">[H⁺] = ${sciT(o.H)} M, 판 표면 P<sub>H₂</sub> ≈ ${sciT(o.pH2)} atm, ${METALS[c].name}의 수소 과전압 η ≈ ${o.eta.toFixed(2)} V(시뮬레이션 근삿값)</p>
      <div class="eq">E(−) = ${METALS[a].E.toFixed(2)} + (0.0592/${na}) log[${ion(a)}] = ${o.Ean.toFixed(3)} V</div>
      <div class="eq">전압 = E(+) − E(−) = <b>${o.emf.toFixed(3)} V</b></div>
      <p class="small">처음에는 판 표면에 H₂가 거의 없어서(P<sub>H₂</sub>가 매우 작음) 전압이 표준 기전력보다 크게 측정돼요. 교과서에 따라 볼타 전지의 처음 전압을 약 1.1 V로 소개하기도 하는데, 이 시뮬레이션은 약 0.9 V에서 시작해서 분극이 일어나면 0.5 V 안팎까지 떨어지도록 만들었어요.</p>`;
    } else h+='<p>지금 조합에서는 전지 반응이 일어나지 않아요.</p>';
  }
  if(adv) h+=`<div class="adv">⚠ 여기부터는 대학 전공 과정 내용이에요.</div>${adv}`;
  return h+'</div>';
}
function renderTab(){

  const cc=e.target.closest('[data-concept]'); if(cc){ showConcept(ALLM.find(m=>m.id===cc.dataset.concept),false); return; }
  if(e.target.closest('[data-repredict]')){ maybePredict(); return; }
  if(e.target.closest('[data-observe]')){ checkObservation(); return; }
  const tp=e.target.closest('[data-tip]'); if(tp){ UI.tip[tp.dataset.tip]=!UI.tip[tp.dataset.tip]; renderBanner(); renderTab(); return; }
  if(e.target.closest('[data-csv]')) csv();
  const au=e.target.closest('[data-auto]'); if(au){ const v=au.dataset.auto; if(v==='toggle'){ AUTO.on=!AUTO.on; AUTO.lastCond=''; } else AUTO.int=+v.split(':')[1]; renderTab(); return; }
  if(e.target.closest('[data-autocsv]')) autoCsv();
  if(e.target.closest('[data-autoclr]')){ AUTO.rows=[]; AUTO.lastCond=''; renderTab(); return; }
  if(e.target.closest('[data-clr]')){RECS.length=0;renderTab();}
});

  document.getElementById('infoBox').innerHTML=`<div class="info"><h2>${d.t}</h2>${d.svg}${d.html}</div><button class="btn go" data-infoclose="1">닫기</button>`;
  document.getElementById('infoOv').classList.remove('hide'); });
document.getElementById('infoOv').addEventListener('click',e=>{ if(e.target.closest('[data-infoclose]')||e.target.id==='infoOv') document.getElementById('infoOv').classList.add('hide'); });
const pre={mode:null,study:null};
function syncStart(){ document.querySelectorAll('[data-pickmode]').forEach(b=>b.classList.toggle('sel',b.dataset.pickmode===pre.mode));
  document.querySelectorAll('[data-study]').forEach(b=>b.classList.toggle('sel',b.dataset.study===pre.study));
  document.getElementById('startBtn').disabled=!(pre.mode&&pre.study); }
document.getElementById('studyOv').addEventListener('click',e=>{
  const m=e.target.closest('[data-pickmode]'); if(m){ pre.mode=m.dataset.pickmode; syncStart(); }
  const st=e.target.closest('[data-study]'); if(st){ pre.study=st.dataset.study; syncStart(); }
  if(e.target.closest('#startBtn')&&pre.mode&&pre.study){
    if(pre.mode!==S.mode) switchMode(pre.mode);
    applyStudy(pre.study);
  }
});
document.getElementById('studyBtn').onclick=()=>{ pre.mode=S.mode; pre.study=S.study; syncStart(); document.getElementById('studyOv').classList.remove('hide'); };
resetDyn(); renderCtrl(); renderTab();
let last=performance.now(), slow=0, RUN=false;
function frame(now){
  const rdt=Math.min(0.1,(now-last)/1000); last=now;
  const run=S.running&&!popOpen()&&document.getElementById('studyOv').classList.contains('hide'); RUN=run;
  if(run&&ready()){ const sim=rdt*S.speed, n=Math.min(400,Math.max(1,Math.ceil(sim/0.25))), h=sim/n; for(let k=0;k<n;k++) step(h); }
  O=compute();
  if(ready()&&S.volt&&O.Vread!=null){ const v=Math.abs(O.Vread); D.vmax=Math.max(D.vmax||0,v); if(D.vShake!=null) D.vShakeMax=Math.max(D.vShakeMax,v); if(D.vDep!=null) D.vDepMax=Math.max(D.vDepMax,v); }
  if(run&&ready()){ pushHist(); autoTick(rdt); }
  microUpdate(run?rdt:0);
  drawMacro(); drawMicro(); drawGraph(); updateMeters();
  slow+=rdt; if(slow>0.4){slow=0;checkMissions();if(tab==='th')renderTab();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
