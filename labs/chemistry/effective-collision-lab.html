<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>유효 충돌 실험실 · V-Lab</title>
<style>
/* V-Lab 공용 글꼴·색 토큰만 가져옴 (공용 클래스는 이 파일의 클래스 이름과 겹치므로 lab-theme.css 전체는 쓰지 않음) */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
/* 위·아래첨자(₆ ⁺ ⁻ …)는 한글 글꼴에 ₁₂₃₄ 만 들어 있어 화학식 숫자 크기가 들쭉날쭉해진다. 같은 계열 라틴 글꼴에서 첨자만 가져와 맨 앞에 둔다 */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&text=%E2%81%B0%C2%B9%C2%B2%C2%B3%E2%81%B4%E2%81%B5%E2%81%B6%E2%81%B7%E2%81%B8%E2%81%B9%E2%81%BA%E2%81%BB%E2%82%80%E2%82%81%E2%82%82%E2%82%83%E2%82%84%E2%82%85%E2%82%86%E2%82%87%E2%82%88%E2%82%89%E2%82%8A%E2%82%8B&display=swap');
:root{--font: 'IBM Plex Sans', 'IBM Plex Sans KR', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; --bg: #ffffff; --panel: #ffffff; --panel-2: #F7F8FA; --line: #E6E8EC; --line-2: #F0F1F3; --text: #111111; --text-2: #3F4652; --muted: #6B7280; --accent: #3182F6; --accent-soft: #EAF2FF; --ok: #12A66B; --warn: #F5A623; --err: #E5484D; --radius: 12px; --radius-sm: 8px;}
</style>
<style>
:root{--bg:#0a1120;--panel:#0f1a2d;--panel2:#15223a;--line:#253a5e;--text:#e9effc;--muted:#97a8c8;--accent:#4fd1ff;--accent2:#ffcc4d;--ok:#38d996;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
#app{height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit}
sub{font-size:.7em}
.screen{display:none;height:100%}
.screen.active{display:flex}
/* ---------- home ---------- */
#home{flex-direction:column;overflow-y:auto;background:radial-gradient(1100px 600px at 15% -10%,#1b3462 0,transparent 60%),radial-gradient(900px 520px at 110% 0%,#3b1d60 0,transparent 55%),var(--bg)}
.home-wrap{max-width:1140px;width:100%;margin:auto;padding:18px 22px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.brand h1{font-size:28px;letter-spacing:-.6px}
.brand h1 em{font-style:normal;background:linear-gradient(90deg,#4fd1ff,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;background:#ffffff10;color:var(--accent);border:1px solid #4fd1ff44}
.sub{color:var(--muted);margin-bottom:14px;line-height:1.6;font-size:14.5px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:linear-gradient(180deg,#14213a,#0f192c);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.4px;margin-bottom:9px}
.rx-list{display:flex;flex-direction:column;gap:8px}
.rx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0c1527;text-align:left;transition:.15s}
.rx:hover{border-color:#4fd1ff88}
.rx.sel{border-color:var(--accent);background:#10304a;box-shadow:0 0 0 1px var(--accent) inset}
.rx .num{width:28px;height:28px;border-radius:8px;background:#ffffff12;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rx .eq{font-size:17px;font-weight:700;flex:1}
.rx .lv{font-size:12px;color:var(--accent2);white-space:nowrap}
.preview{height:190px;border-radius:12px;background:#060c17;border:1px solid var(--line);position:relative;overflow:hidden;margin-top:12px}
.preview canvas{width:100%;height:100%;display:block}
.preview .pcap{position:absolute;left:12px;bottom:9px;font-size:12px;color:var(--muted)}
.modes{display:grid;gap:8px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0c1527;transition:.15s}
.mode:hover{border-color:#ffcc4d88}
.mode.sel{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset;background:#262210}
.mode .ic{font-size:24px;line-height:1.1}
.mode b{display:block;font-size:16px;margin-bottom:3px}
.mode span{font-size:13px;color:var(--muted);line-height:1.5}
.start{margin-top:12px;width:100%;padding:14px;border-radius:12px;background:linear-gradient(90deg,#2bb7ff,#7c5cff);font-size:18px;font-weight:800;box-shadow:0 8px 24px #2bb7ff40}
.start:active{transform:scale(.99)}
.row-btns{display:flex;gap:8px;margin-top:9px}
.ghost{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0c1527;font-size:14px}
/* PC: 첫 화면이 화면 전체를 채우도록 */
@media (min-width:901px) and (min-height:600px){
 #home{overflow:hidden}
 .home-wrap{max-width:none;height:100%;margin:0;padding:3.2vh 3.5vw;display:flex;flex-direction:column}
 .brand h1{font-size:clamp(28px,3.4vw,52px)}
 .tag{font-size:clamp(12px,1vw,16px);padding:5px 14px}
 .sub{font-size:clamp(14.5px,1.25vw,20px);margin-bottom:2.4vh}
 .home-grid{flex:1;min-height:0;gap:2vw}
 .card{display:flex;flex-direction:column;padding:2.4vh 1.6vw;min-height:0}
 .step{font-size:clamp(13px,1vw,17px);margin-bottom:1.4vh}
 .rx-list{gap:1.2vh}
 .rx{padding:1.8vh 1.2vw}
 .rx .eq{font-size:clamp(17px,1.6vw,28px)}
 .rx .num{width:clamp(28px,2.2vw,40px);height:clamp(28px,2.2vw,40px);font-size:clamp(13px,1vw,17px)}
 .preview{flex:1;height:auto;min-height:150px;margin-top:1.8vh}
 .preview .pcap{font-size:clamp(12px,.95vw,16px)}
 .modes{flex:1;gap:1.2vh;grid-auto-rows:1fr}
 .mode{padding:1.8vh 1.2vw;align-items:center}
 .mode .ic{font-size:clamp(24px,2.2vw,38px)}
 .mode b{font-size:clamp(16px,1.4vw,24px)}
 .mode span{font-size:clamp(13px,1.05vw,17px)}
 .start{padding:2vh;font-size:clamp(18px,1.6vw,26px);margin-top:1.8vh}
 .ghost{padding:1.4vh;font-size:clamp(14px,1.05vw,17px)}
}
/* ---------- play ---------- */
#play{flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0c1527;border-bottom:1px solid var(--line);flex:none;min-height:56px;flex-wrap:wrap}
.back{padding:8px 12px;border-radius:9px;background:#ffffff10;font-size:14px}
.top-eq{font-weight:800;font-size:17px}
.top-mode{font-size:12px;padding:3px 9px;border-radius:99px;background:#ffffff12;color:var(--accent2);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:7px;align-items:center}
.stats.near{margin-left:10px}
@media (min-width:901px){.top-eq{font-size:clamp(24px,2vw,34px);letter-spacing:-.3px}.top-mode{font-size:14px;padding:5px 12px}}
@media (min-width:901px){
 .stats.near{gap:10px}
 .stats.near .stat{padding:6px 18px;min-width:110px}
 .stats.near .stat small{font-size:13px}
 .stats.near .stat b{font-size:28px}
 .stats.near #statReset{padding:10px 14px!important;font-size:14px!important}
}
.stat{background:#ffffff0c;border:1px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;min-width:64px}
.stat small{display:block;font-size:10.5px;color:var(--muted)}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.play-body{flex:1;display:flex;min-height:0}
.stage{position:relative;flex:1;min-width:0;overflow:hidden;background:#040913;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{width:360px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.panel h4{font-size:14px;margin-bottom:8px}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}
.small b{color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.kpis div{background:#ffffff0a;border-radius:9px;padding:7px 4px}
.kpis b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpis small{font-size:11px;color:var(--muted)}
.tbig{font-size:46px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.tbig.warn{color:var(--bad)}
canvas.diag{width:100%;height:180px;display:block;border-radius:8px;background:#0a1324}
table.log{width:100%;border-collapse:collapse;font-size:12.5px}
table.log th{color:var(--muted);font-weight:600;text-align:center;padding:4px 2px;border-bottom:1px solid var(--line);font-size:11.5px}
table.log td{text-align:center;padding:5px 2px;border-bottom:1px solid #ffffff0d;font-variant-numeric:tabular-nums}
table.log td.ok{color:var(--ok);font-weight:700}
table.log td.no{color:#ffb3b3}
table.log .rp{padding:3px 7px;border-radius:7px;background:#ffffff14;font-size:12px}
.logwrap{max-height:250px;overflow-y:auto}
.hint p{font-size:13px;line-height:1.6;margin-top:4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.demo-btns{display:grid;gap:7px}
.demo-btns button{padding:10px 12px;border-radius:10px;background:#0a1324;border:1px solid var(--line);text-align:left;font-size:14px;font-weight:600}
.demo-btns button:hover{border-color:var(--accent)}
.conc{display:grid;gap:6px}
.conc div{display:flex;align-items:center;gap:8px;background:#0a1324;border-radius:9px;padding:6px 8px}
.conc span{flex:1;font-weight:700}
.conc .btn{padding:4px 12px;font-size:16px}
.conc b{min-width:28px;text-align:center;font-size:17px}
.cond{display:grid;gap:7px}
.cond div{background:#0a1324;border-radius:9px;padding:9px 10px;font-size:13px;line-height:1.55}
.cond b{color:var(--accent2)}
ol.rank{padding-left:22px;font-size:13.5px;line-height:1.9}
ol.rank li span{color:var(--muted);font-size:12px}
/* stage overlays */
.ov{position:absolute;pointer-events:none}
#help{left:50%;top:10px;transform:translateX(-50%);background:#000a;padding:7px 14px;border-radius:99px;font-size:13px;color:#d6e6ff;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#faceAsk{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:#0a1324ee;border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:none;text-align:center;z-index:4;box-shadow:0 10px 30px #0009;width:max-content;max-width:94%}
#faceAsk .t{font-size:15px;font-weight:800;margin-bottom:8px}
#faceAsk .t small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
#faceAsk .chip{font-size:15px;padding:10px 14px}
#faceMini{position:absolute;left:10px;top:48px;background:#0a1324dd;border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:none;z-index:3;max-width:230px}
#faceMini .t{font-size:12px;color:var(--muted);margin-bottom:4px}
#faceMini .chip kbd,#faceAsk .chip kbd,#keys kbd{display:inline-block;min-width:18px;padding:0 4px;border-radius:5px;background:#ffffff22;font:700 11px system-ui;text-align:center;margin-right:4px;color:inherit}
#banner{left:50%;top:50px;transform:translate(-50%,-8px);max-width:92%;padding:10px 18px;border-radius:12px;background:#071326f0;border:1px solid var(--line);font-size:15.5px;font-weight:700;text-align:center;opacity:0;transition:opacity .3s,transform .3s;line-height:1.5;z-index:5}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
#keys{position:absolute;left:10px;bottom:10px;background:#0a1324d8;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;color:#c8d5ee;line-height:1.75;display:none;z-index:2;pointer-events:none}
#keys b{color:var(--accent2);font-size:12.5px;display:block;margin-bottom:2px}
.chip{padding:6px 10px;border-radius:8px;background:#ffffff14;font-size:13px;margin:3px 4px 0 0}
.chip.on{background:var(--accent);color:#04121f;font-weight:800}
.chip.rot{background:#ffffff0c}
#reticle{left:0;top:0;width:48px;height:48px;border:2px solid #ffffff90;border-radius:50%;display:none;transition:border-color .15s;will-change:transform}
#reticle::before,#reticle::after{content:"";position:absolute;background:#ffffffb0}
#reticle::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px}
#reticle::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px}
#reticle.lock{border-color:#7cf3c6}
#reticle.lock::before,#reticle.lock::after{background:#7cf3c6}
#scope{inset:0;background:radial-gradient(circle at 50% 50%,transparent 36%,#000000c8 74%);opacity:0;transition:opacity .15s}
#gauge{position:absolute;right:22px;top:26%;width:24px;height:40%;border-radius:12px;background:#ffffff12;border:1px solid #ffffff38;display:none;pointer-events:none}
#gauge .fill{position:absolute;left:2px;right:2px;bottom:2px;border-radius:10px;background:linear-gradient(0deg,#38d996,#ffcc4d 60%,#ff6b6b)}
#gauge .mark{position:absolute;left:-7px;right:-7px;height:3px;background:#fff;box-shadow:0 0 8px #fff}
#gauge .gl{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
#gauge .ml{position:absolute;right:30px;transform:translateY(-50%);font-size:11px;color:#fff;white-space:nowrap}
#fireBtn{position:absolute;right:16px;bottom:18px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e7a51c);box-shadow:0 6px 18px #000a,0 0 0 6px #ffcc4d33;display:none;place-items:center;touch-action:none;font-size:14px;font-weight:900;color:#3a2800;text-align:center;line-height:1.2;z-index:3;-webkit-user-select:none;user-select:none}
#fireBtn.hold{transform:scale(.92);box-shadow:0 0 0 10px #ff9f6b55,0 0 30px #ffcc4d}
#toast{left:50%;top:24%;transform:translate(-50%,-50%) scale(.9);font-size:26px;font-weight:900;padding:10px 22px;border-radius:14px;background:#000b;opacity:0;transition:.25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cap{left:50%;bottom:76px;transform:translateX(-50%);max-width:88%;background:#071326ee;border:1px solid #4fd1ff55;padding:9px 16px;border-radius:12px;font-size:15px;text-align:center;display:none;line-height:1.5}
.btn{padding:10px 14px;border-radius:10px;background:#ffffff16;font-size:14px;font-weight:700}
.btn.pri{background:var(--accent);color:#04121f}
.btn.on{background:var(--accent2);color:#2a1d00}
.bar{position:absolute;display:none;gap:6px;align-items:center;background:#0a1324e8;border:1px solid var(--line);border-radius:12px;padding:7px 8px;z-index:3}
#rpBar{left:10px;right:10px;bottom:10px}
#rpBar input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
#rpBar .btn,#spdBar .btn{padding:7px 10px;font-size:13px}
#spdBar{left:10px;bottom:10px}
#followBtn{position:absolute;right:12px;top:48px;display:none}
#cd{left:50%;top:45%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;color:#fff;text-shadow:0 0 30px #4fd1ff;display:none}
#rpDiagBox{right:12px;top:48px;width:400px;background:#0a1324ee;border:1px solid #4fd1ff66;border-radius:14px;padding:8px 10px 10px;display:none;z-index:3;box-shadow:0 10px 30px #0008}
#rpDiagBox .t{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:4px}
#rpDiagBox canvas{width:100%;height:220px;display:block}
#rpTitle{left:12px;top:10px;background:#000a;padding:6px 12px;border-radius:10px;font-size:13px;display:none;color:var(--accent2);font-weight:700}
/* 에너지 그래프 팝업 */
#diagPop{position:fixed;left:60px;top:90px;width:560px;height:360px;min-width:320px;min-height:220px;background:#0a1324f4;border:1px solid var(--accent);border-radius:14px;box-shadow:0 20px 60px #000c;z-index:40;display:none;flex-direction:column;resize:both;overflow:hidden}
#diagPop .hd{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:#12304a;cursor:move;user-select:none;-webkit-user-select:none;touch-action:none;font-weight:800;font-size:14px}
#diagPop .hd span{flex:1}
#diagPop .hd small{font-weight:500;color:var(--muted);font-size:11.5px}
#diagPop .hd button{width:30px;height:30px;border-radius:8px;background:#ffffff18;font-size:15px}
#diagPop canvas{flex:1;width:100%;min-height:0;display:block}
/* modal */
#modal{position:fixed;inset:0;background:#020610c0;display:none;place-items:center;z-index:50;padding:16px}
#modal.show{display:grid}
.mbox{background:#0f1a2e;border:1px solid var(--line);border-radius:18px;padding:22px;width:min(560px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px #000c}
.mbox h2{font-size:22px;margin-bottom:10px}
.mbox p{font-size:14.5px;line-height:1.7;color:#c8d5ee;margin-bottom:8px}
.mbox ul{margin:6px 0 10px 20px;font-size:14px;line-height:1.8;color:#c8d5ee}
.mbox .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mbox .btns .btn{flex:1;padding:12px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.big3 div{background:#ffffff0c;border-radius:12px;padding:10px;text-align:center}
.big3 b{display:block;font-size:26px}
.big3 small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 10px;border-radius:8px;background:#ffffff10;font-size:13px}
.tabs button.on{background:var(--accent);color:#04121f;font-weight:800}
table.rk{width:100%;border-collapse:collapse;font-size:14px}
table.rk th,table.rk td{padding:7px 4px;border-bottom:1px solid #ffffff12;text-align:center}
table.rk th{color:var(--muted);font-size:12px}
table.rk tr.me td{color:var(--accent2);font-weight:800}
.namein{display:flex;gap:6px;margin-top:8px}
.namein input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1324;color:var(--text)}
@media (max-width:900px){
 body{overflow:auto}
 #play{height:auto;min-height:100%}
 .play-body{flex-direction:column}
 .stage{flex:none;height:66vh;min-height:340px}
 .side{width:auto;border-left:none;border-top:1px solid var(--line)}
 .home-grid{grid-template-columns:1fr}
 .stats{margin-left:0;width:100%}
 .stat{flex:1;min-width:0}
 .top-eq{font-size:19px}
 #help{font-size:11.5px;top:8px}
 #faceAsk{top:150px}
 #faceAsk .t{font-size:14px}
 #banner{top:44px;font-size:13.5px;padding:8px 12px}
 #banner small{font-size:11.5px}
 #faceMini{top:42px;max-width:190px;padding:7px 8px}
 .chip{font-size:12px;padding:5px 8px}
 #cap{font-size:13px;bottom:118px}
 #rpDiagBox{left:8px;right:8px;width:auto;top:44px;bottom:auto;padding:6px 8px}
 #rpDiagBox canvas{height:130px}
 #toast{font-size:20px}
 #fireBtn{width:84px;height:84px}
 #gauge{right:18px;top:24%;height:34%}
 .brand h1{font-size:23px}
 .preview{height:150px}
}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

/* ================= 수학 ================= */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];

const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const randDir=()=>{let v;do{v=[rand(-1,1),rand(-1,1),rand(-1,1)]}while(len(v)<.1);return norm(v)};
const centroid=ps=>{const c=[0,0,0];ps.forEach(p=>{c[0]+=p[0];c[1]+=p[1];c[2]+=p[2]});return mul(c,1/ps.length)};
const dirYP=(y,p)=>[Math.sin(y)*Math.cos(p),Math.sin(p),Math.cos(y)*Math.cos(p)];
const qMul=(a,b)=>[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qNorm=q=>{const l=Math.hypot(q[0],q[1],q[2],q[3])||1;return [q[0]/l,q[1]/l,q[2]/l,q[3]/l]};
const qAxis=(ax,ang)=>{const n=norm(ax),s=Math.sin(ang/2);return [Math.cos(ang/2),n[0]*s,n[1]*s,n[2]*s]};
const qRand=()=>qNorm([rand(-1,1),rand(-1,1),rand(-1,1),rand(-1,1)]);
function qRot(q,v){const w=q[0],x=q[1],y=q[2],z=q[3];
 const ix=w*v[0]+y*v[2]-z*v[1],iy=w*v[1]+z*v[0]-x*v[2],iz=w*v[2]+x*v[1]-y*v[0],iw=-x*v[0]-y*v[1]-z*v[2];
 return [ix*w+iw*-x+iy*-z-iz*-y,iy*w+iw*-y+iz*-x-ix*-z,iz*w+iw*-z+ix*-y-iy*-x];}
function qFromTo(a,b){a=norm(a);b=norm(b);const d=dot(a,b);
 if(d<-.9999){let ax=cross([1,0,0],a);if(len(ax)<1e-3)ax=cross([0,1,0],a);return qAxis(ax,Math.PI);}
 const c=cross(a,b);return qNorm([1+d,c[0],c[1],c[2]]);}
function qInt(q,w,dt){const a=len(w)*dt;if(a<1e-7)return q;return qNorm(qMul(qAxis(w,a),q));}
function qFromMat(m){const [a,b,c,d,e,f,g,h,i]=m;const tr=a+e+i;let s;
 if(tr>0){s=Math.sqrt(tr+1)*2;return qNorm([.25*s,(h-f)/s,(c-g)/s,(d-b)/s]);}
 if(a>e&&a>i){s=Math.sqrt(1+a-e-i)*2;return qNorm([(h-f)/s,.25*s,(b+d)/s,(c+g)/s]);}
 if(e>i){s=Math.sqrt(1+e-a-i)*2;return qNorm([(c-g)/s,(b+d)/s,.25*s,(f+h)/s]);}
 s=Math.sqrt(1+i-a-e)*2;return qNorm([(d-b)/s,(c+g)/s,(f+h)/s,.25*s]);}
function basis(a,b){const e1=norm(a);let t=sub(b,mul(e1,dot(b,e1)));

 NO:{f:'NO',atoms:[['N',-.58,0,0],['O',.58,0,0]],bonds:[[0,1]],
  faces:[{id:'N',lab:'N 원자',at:0,dir:[-1,0,0]},{id:'O',lab:'O 원자',at:1,dir:[1,0,0]}]},

};

/* ---------- 조준 · 힘 · 발사 ----------

function orientMol(m,face,d,roll,axHint){let q1;if(face.type==='side'){let ax=axHint||cross(d,[0,1,0]);if(len(ax)<1e-3)ax=[1,0,0];q1=qFromTo([1,0,0],norm(ax));}else q1=qFromTo(face.d,d);m.q=qMul(qAxis(d,roll),q1);}
function cursorHit(){const o=G.cam.pos,d=rayDir(G.cam,VW,VH,G.cursor[0],G.cursor[1]);let bt=1e9,hm=null,hi=-1;
 // 옆면(H₂ + I₂)으로 쏠 때는 원자가 아니라 분자 전체를 겨눠요: 분자 중심을 향해 날아감
 if(G.sh&&curFace()&&curFace().type==='side'){for(const m of G.W.mols){if(m===G.sh||m.al<.5||m.st==='fly')continue;const oc=sub(m.pos,o),tc=dot(oc,d);if(tc<1)continue;
   const dd=Math.sqrt(Math.max(0,dot(oc,oc)-tc*tc));if(dd<SP[m.sp].br*.85&&tc<bt){bt=tc;hm=m;}}
  if(hm)return {d:norm(sub(hm.pos,o)),m:hm,i:0,pt:hm.pos.slice()};}
 for(const m of G.W.mols){if(m===G.sh||m.al<.5||m.st==='fly')continue;if(len(sub(m.pos,o))>200)continue;
  const P=molAtoms(m),E=SP[m.sp].E;P.forEach((p,i)=>{const oc=sub(p,o),tc=dot(oc,d);if(tc<1)return;const r=EL[E[i]].r*1.05,d2=dot(oc,oc)-tc*tc;if(d2>r*r)return;const t=tc-Math.sqrt(r*r-d2);if(t<bt){bt=t;hm=m;hi=i;}});}
 return {d,m:hm,i:hi,pt:add(o,mul(d,hm?bt:40))};}
// 옆면으로 쏠 때: 겨눈 분자의 막대 방향을 시선에 수직인 면에 투영해서 그 방향과 나란하게

 const r=cursorHit(),side=curFace().type==='side';G.hov=r.m?{id:r.m.id,i:r.i,all:side}:null;G.aimPt=r.pt;
 if(G.phase==='charge'){G.charge+=dt;const p=(G.charge%1.8)/.9;G.power=p<=1?p:2-p;}
 const d=norm(sub(r.pt,G.home));orientMol(m,curFace(),d,G.roll,side&&r.m?sideAxis(r.m,d):null);m.pos=sub(G.home,mul(d,G.phase==='charge'?G.power*1.1:0));

 if(G.mode==='observe')$('#spdBar').style.display='flex';if(G.follow)$('#followBtn').style.display='block';setHelp();}
function rpFrame(){const r=G.rp,f=r.frames;let lo=0,hi=f.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(f[m].t<=r.t)lo=m;else hi=m-1;}return f[lo];}
function rpStep(dt){const r=G.rp;if(r.playing){r.t+=dt*r.speed;r.yaw+=dt*.1;if(r.t>=r.T){r.t=r.T;r.playing=false;$('#rpPlay').textContent='▶ 재생';}}
 const sl=$('#rpSlider');if(!sl.dragging)sl.value=Math.round(r.t/(r.T||1)*1000);}
function rpToggle(){const r=G.rp;if(!r)return;if(!r.playing&&r.t>=r.T)r.t=0;r.playing=!r.playing;$('#rpPlay').textContent=r.playing?'⏸ 멈춤':'▶ 재생';}
function rpSpeed(v){if(!G.rp)return;G.rp.speed=v;$$('.spd').forEach(x=>x.classList.toggle('on',+x.dataset.s===v));}
$('#rpPlay').onclick=rpToggle;
$('#rpRestart').onclick=()=>{const r=G.rp;if(!r)return;r.t=0;r.playing=true;$('#rpPlay').textContent='⏸ 멈춤';};
$('#rpClose').onclick=()=>closeReplay();
$$('.spd').forEach(b=>b.onclick=()=>rpSpeed(+b.dataset.s));
const sl=$('#rpSlider');sl.oninput=()=>{if(!G.rp)return;sl.dragging=true;G.rp.t=sl.value/1000*G.rp.T;G.rp.playing=false;$('#rpPlay').textContent='▶ 재생';};sl.onchange=()=>{sl.dragging=false;};
$$('.ospd').forEach(b=>b.onclick=()=>{G.speed=+b.dataset.s;G.paused=false;$('#obPause').textContent='⏸ 멈춤';$$('.ospd').forEach(x=>x.classList.toggle('on',x===b));});
function snapWorld(W){if(typeof structuredClone!=='function')return;W.hist=W.hist||[];const last=W.hist[W.hist.length-1];if(last&&W.t-last.t<.04*Math.max(1,G.speed))return;
 W.hist.push({t:W.t,d:structuredClone({mols:W.mols,cx:W.cx,stats:W.stats})});while(W.hist.length&&W.t-W.hist[0].t>30)W.hist.shift();}
function rewind(sec){const W=G.W;if(!W||!W.hist||!W.hist.length)return;const tgt=W.t-sec;let k=-1;for(let i=W.hist.length-1;i>=0;i--){if(W.hist[i].t<=tgt){k=i;break;}}if(k<0)k=0;
 const h=W.hist[k],d=structuredClone(h.d);W.mols=d.mols;W.cx=d.cx;W.stats=d.stats;W.fx=[];W.t=h.t;W.hist=W.hist.slice(0,k+1);
 G.paused=true;$('#obPause').textContent='▶ 재생';banner('⏪ 1초 전으로 돌아갔어요','▶ 재생을 누르거나 느린 배속으로 다시 살펴보세요',1600);}
$('#obBack').onclick=()=>rewind(G.speed);
$('#obPause').onclick=()=>{G.paused=!G.paused;$('#obPause').textContent=G.paused?'▶ 재생':'⏸ 멈춤';};
$('#followBtn').onclick=e=>{e.stopPropagation();stopFollow();};
function stopFollow(){G.follow=null;if(G.W){G.W.follow=null;G.W.focus=null;}G.orbit.dist=G.orbitSave||40;G.orbit.tgt=[0,0,0];$('#followBtn').style.display='none';setHelp();}

/* ---------- 입력 ---------- */
const PTR=new Map();let pinch=null;
const local=e=>{const b=stage.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
const shooting=()=>G.mode!=='observe'&&['face','aim','charge'].includes(G.phase);
function pickObserve(x,y){const pj=makeProj(G.cam,VW,VH);let best=null,bz=1e9;
 for(const m of G.W.mols){if(m.st!=='free'||m.al<.8)continue;molAtoms(m).forEach((p,i)=>{const q=pj(p);if(!q)return;const r=EL[SP[m.sp].E[i]].r*q[3]+6;if(Math.hypot(q[0]-x,q[1]-y)<r&&q[2]<bz){bz=q[2];best=m;}});}
 return best;}
// 버튼을 누른 뒤 포커스가 남아 단축키(특히 Space)가 버튼을 눌러 버리지 않도록
document.addEventListener('pointerup',()=>{const a=document.activeElement;if(a&&(a.tagName==='BUTTON'||(a.tagName==='INPUT'&&(a.type==='checkbox'||a.type==='range'))))a.blur();},true);
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('pointerdown',e=>{if(e.target.closest('#fireBtn,#faceAsk,#faceMini,#rpBar,#spdBar,#followBtn'))return;
 const tu=e.pointerType!=='mouse';if(tu!==G.touchUI){G.touchUI=tu;setHelp();if(G.phase==='aim'||G.phase==='charge')setAimUI(true);}
 try{stage.setPointerCapture(e.pointerId);}catch(_){}const [x,y]=local(e);PTR.set(e.pointerId,{x,y,sx:x,sy:y,moved:false,type:e.pointerType});
 if(PTR.size===2){const a=[...PTR.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};}
 if(shooting()&&e.pointerType==='mouse'){G.cursor=[x,y];if(e.button===0&&G.phase==='aim')startCharge();}});
stage.addEventListener('pointermove',e=>{const [x,y]=local(e);const p=PTR.get(e.pointerId);
 if(shooting()&&e.pointerType==='mouse'){G.cursor=[x,y];if(p){p.x=x;p.y=y;}return;}
 if(!p)return;
 const dx=x-p.x,dy=y-p.y;p.x=x;p.y=y;if(Math.hypot(x-p.sx,y-p.sy)>8)p.moved=true;
 if(shooting()){if(PTR.size===1)G.cursor=[clamp(G.cursor[0]+dx*1.25,4,VW-4),clamp(G.cursor[1]+dy*1.25,4,VH-4)];return;}
 if(PTR.size===2&&pinch){const a=[...PTR.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),k=pinch.d/d;pinch.d=d;
  if(G.phase==='replay')G.rp.dist=clamp(G.rp.dist*k,4,30);else G.orbit.dist=clamp(G.orbit.dist*k,G.follow?5:16,64);return;}
 if(G.phase==='replay'){G.rp.yaw-=dx*.008;G.rp.pitch=clamp(G.rp.pitch+dy*.006,-1.3,1.3);}
 else if(G.mode==='observe'){G.orbit.yaw-=dx*.006;G.orbit.pitch=clamp(G.orbit.pitch+dy*.005,-1.2,1.2);}});
function ptrEnd(e){const p=PTR.get(e.pointerId);PTR.delete(e.pointerId);if(PTR.size<2)pinch=null;if(!p)return;
 if(shooting()){if(p.type==='mouse'){if(G.phase==='charge'&&!G.kbCharge)fire();}else if(!p.moved)G.cursor=[p.sx,p.sy];return;}
 if(p.moved)return;
 if(G.mode==='observe'&&G.phase==='select'&&G.W){const m=pickObserve(p.x,p.y);if(m){G.follow=m.id;G.W.follow=m.id;G.W.focus=new Set([m.id]);G.orbitSave=G.orbitSave||G.orbit.dist;G.orbit.dist=11;$('#followBtn').style.display='block';setHelp();}}}
stage.addEventListener('pointerup',ptrEnd);stage.addEventListener('pointercancel',e=>{PTR.delete(e.pointerId);pinch=null;if(G.phase==='charge')cancelCharge();});
stage.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp(e.deltaY*.001);if(G.phase==='replay')G.rp.dist=clamp(G.rp.dist*k,4,30);else if(G.mode==='observe')G.orbit.dist=clamp(G.orbit.dist*k,G.follow?5:16,64);},{passive:false});
// 발사 버튼 (휴대폰·태블릿)
const fb=$('#fireBtn');
fb.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(G.phase!=='aim')return;try{fb.setPointerCapture(e.pointerId);}catch(_){}startCharge();});
fb.addEventListener('pointerup',e=>{e.stopPropagation();if(G.phase==='charge')fire();});
fb.addEventListener('pointercancel',()=>cancelCharge());
fb.addEventListener('contextmenu',e=>e.preventDefault());
// 단축키 (한글 입력 상태에서도 되도록 e.code 사용)
window.addEventListener('keydown',e=>{if(G.scr!=='play'||(e.target.tagName==='INPUT'&&e.target.type!=='checkbox'))return;if($('#modal').classList.contains('show'))return;
 const c=e.code,num=/^(Digit|Numpad)([1-9])$/.exec(c);
 if(c==='Space'||c.startsWith('Arrow'))e.preventDefault();
 if(G.phase==='replay'){if(c==='Space')rpToggle();else if(c==='Escape')closeReplay();else if(c==='ArrowLeft'){G.rp.t=Math.max(0,G.rp.t-.05);G.rp.playing=false;}else if(c==='ArrowRight'){G.rp.t=Math.min(G.rp.T,G.rp.t+.05);G.rp.playing=false;}
  else if(num){const v=[1,.5,.25,.1][+num[2]-1];if(v)rpSpeed(v);}return;}
 if(G.mode==='observe'){if(c==='ArrowLeft')rewind(G.speed);else if(c==='Space')$('#obPause').click();else if(c==='Escape'&&G.follow)stopFollow();return;}
 if(c==='KeyH'){G.keysHidden=!G.keysHidden;setHelp();}
 if(c==='KeyR'&&G.mode==='practice'&&G.last&&['face','aim'].includes(G.phase)){openGameReplay(G.last);return;}
 if(num&&['face','aim','charge'].includes(G.phase)){chooseFaceN(+num[2]);return;}
 if(G.phase==='aim'||G.phase==='charge'){
  if(c==='Space'&&!e.repeat&&G.phase==='aim'){G.kbCharge=true;startCharge();}
  if(c==='Escape')cancelCharge();
  const st=e.shiftKey?40:14;if(c==='ArrowLeft')G.cursor[0]-=st;if(c==='ArrowRight')G.cursor[0]+=st;if(c==='ArrowUp')G.cursor[1]-=st;if(c==='ArrowDown')G.cursor[1]+=st;
  G.cursor=[clamp(G.cursor[0],4,VW-4),clamp(G.cursor[1],4,VH-4)];}},true);
window.addEventListener('keyup',e=>{if(e.code==='Space'&&G.kbCharge){e.preventDefault();G.kbCharge=false;if(G.phase==='charge')fire();}},true);

/* ---------- 카메라 ---------- */
function camUpdate(dt){let pos,tgt,fov=55,k=6;
 if(G.mode!=='observe'&&(['face','aim','charge','wait','countdown','over'].includes(G.phase)||(G.mode==='time'&&G.phase==='fly'))&&G.station){pos=G.station.pos;tgt=G.station.tgt;k=5;}
 else if(G.phase==='fly'&&G.sh&&G.mode!=='time'){const s=G.sh,d=norm(s.vel);pos=add(sub(s.pos,mul(d,6.5)),[0,1.8,0]);tgt=add(s.pos,mul(d,6));fov=50;k=10;}
 else if(G.phase==='event'&&G.evCam){const e=G.evCam;e.yaw+=dt*.3;e.dist=lerp(e.dist,10,1-Math.exp(-dt*2));pos=sub(e.c,mul(dirYP(e.yaw,e.pitch),e.dist));tgt=e.c;fov=50;k=5;}
 else if(G.phase==='replay'){const r=G.rp;pos=sub(r.c,mul(dirYP(r.yaw,r.pitch),r.dist));tgt=r.c;fov=50;k=10;}
 else{const o=G.orbit;if(G.follow){G.follow=G.W.follow||G.follow;const m=findMol(G.W,G.follow),cx=G.W.cx.find(c=>c.id===G.follow);const fp=m?m.pos:cx?centroid(cx.cur):null;if(fp){o.tgt=lerpV(o.tgt,fp,1-Math.exp(-dt*6));G.followLost=0;}else if(!fp){G.followLost=(G.followLost||0)+dt;if(G.followLost>2.5){G.followLost=0;stopFollow();}}}
  else if(!PTR.size)o.yaw+=dt*.015;pos=sub(o.tgt,mul(dirYP(o.yaw,o.pitch),o.dist));tgt=o.tgt;k=G.follow?8:5;}
 const a=1-Math.exp(-dt*k);G.cam.pos=lerpV(G.cam.pos,pos,a);G.cam.tgt=lerpV(G.cam.tgt,tgt,a);G.cam.fov=lerp(G.cam.fov,fov,a);}
// 발사 화면으로 돌아온 직후에는 카메라가 제자리에 오도록 바로 맞춤
function snapStation(){if(G.station&&['face','aim'].includes(G.phase)){G.cam.pos=lerpV(G.cam.pos,G.station.pos,.25);G.cam.tgt=lerpV(G.cam.tgt,G.station.tgt,.25);}}

/* ---------- 매 프레임 ---------- */
const sdt0=ts=>ts>0;
const TS={face:.3,aim:.22,charge:.1,fly:.4,over:.2,wait:.4,countdown:.6};
function frame(dt){const W=G.W;if(!W)return;
 if(G.phase==='replay')rpStep(dt);
 else if(!$('#modal').classList.contains('show')||G.phase==='over'||G.phase==='wait'){let ts=1;
  if(G.mode==='observe')ts=G.paused?0:G.speed;else if(G.phase==='event')ts=G.mode==='time'?.8:.55;else if(TS[G.phase]!=null)ts=TS[G.phase];
  if(G.mode==='observe'&&sdt0(ts))snapWorld(W);const sdt=dt*ts;W.avoid=G.station?G.station.pos:G.cam.pos;const n=Math.ceil(sdt/(1/60));for(let i=0;i<n;i++)stepWorld(W,sdt/n);
  if(['face','aim','charge'].includes(G.phase))aimUpdate(dt);}
 if(G.mode==='time'){if(G.phase==='countdown'){G.cd-=dt;const cdv=$('#cd');cdv.textContent=G.cd>.2?Math.ceil(G.cd-.2):'시작!';
   if(G.cd<=-.4){cdv.style.display='none';G.running=true;newShooter();}}
  else if(G.running){G.timeLeft-=dt;if(G.timeLeft<=0){G.timeLeft=0;if(G.phase!=='fly')timeOver();}}}
 camUpdate(dt);snapStation();draw();placeReticle();
 G.hudT+=dt;if(G.hudT>.08){G.hudT=0;hud();}}
function draw(){const W=G.W;let fr;
 if(G.phase==='replay')fr=rpFrame();
 else{const aiming=['face','aim','charge'].includes(G.phase);
  fr=buildFrame(W,{focus:G.mode==='observe'&&W.follow?W.focus:null,sites:G.showSites,sh:aiming?G.sh:null,face:aiming&&G.sh&&(G.phase!=='face'||G.faceHover)?curFace():null});
  if(aiming&&G.hov){const mm=fr.mols.find(x=>x.id===G.hov.id);if(mm){if(G.hov.all)mm.ring=4;else mm.ringAt=G.hov.i;}}}
 render(ctx,VW,VH,G.cam,fr,{box:W.box,labels:true,elText:true});
 const cap=$('#cap');let ds=null,ct='';
 if(G.phase==='replay'){ds=fr.diag;if(ds)ct=ds.cap;}
 else if((G.phase==='fly'||G.phase==='event')&&W.diag){ds=W.diag;ct=ds.cap;}
 if(ct){cap.style.display='block';if(cap.textContent!==ct)cap.textContent=ct;}else cap.style.display='none';
 const dc=$('#diag');if(dc)drawDiag(dc,G.R,ds&&ds.kind?ds:null);
 if(G.phase==='replay'&&!G.diagPop)drawDiag($('#rpDiag'),G.R,ds&&ds.kind?ds:null,true);
 if(G.diagPop)drawDiag($('#diagPopCv'),G.R,ds&&ds.kind?ds:null,true);}

function loop(ts){const dt=Math.min(.05,(ts-(G.lt||ts))/1000);G.lt=ts;
 try{if(G.scr==='home')drawPreview(dt);else if(G.scr==='play')frame(dt);}catch(err){console.error(err);}
 requestAnimationFrame(loop);}
sprites();buildHome();resize();requestAnimationFrame(loop);
window.__ECL={G,RX,SP,startPlay,runDemo,fire,startCharge,chooseFace,newShooter,cursorHit};
})();
</script>
