<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몰농도 실험실 · V-Lab</title>
<style>
/* V-Lab 공용 글꼴·색 토큰만 가져옴 (공용 클래스는 이 파일의 클래스 이름과 겹치므로 lab-theme.css 전체는 쓰지 않음) */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
/* 위·아래첨자(₆ ⁺ ⁻ …)는 한글 글꼴에 ₁₂₃₄ 만 들어 있어 화학식 숫자 크기가 들쭉날쭉해진다. 같은 계열 라틴 글꼴에서 첨자만 가져와 맨 앞에 둔다 */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&text=%E2%81%B0%C2%B9%C2%B2%C2%B3%E2%81%B4%E2%81%B5%E2%81%B6%E2%81%B7%E2%81%B8%E2%81%B9%E2%81%BA%E2%81%BB%E2%82%80%E2%82%81%E2%82%82%E2%82%83%E2%82%84%E2%82%85%E2%82%86%E2%82%87%E2%82%88%E2%82%89%E2%82%8A%E2%82%8B&display=swap');
:root{--font: 'IBM Plex Sans', 'IBM Plex Sans KR', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; --bg: #ffffff; --panel: #ffffff; --panel-2: #F7F8FA; --line: #E6E8EC; --line-2: #F0F1F3; --text: #111111; --text-2: #3F4652; --muted: #6B7280; --accent: #3182F6; --accent-soft: #EAF2FF; --ok: #12A66B; --warn: #F5A623; --err: #E5484D; --radius: 12px; --radius-sm: 8px;}
</style>
<style>
:root{--ink:#1d2433;--sub:#5b6577;--line:#d9dee7;--bg:#f2f5f9;--card:#fff;--navy:#1f3a5f;--accent:#2b7de9;--ok:#1f9d55;--warn:#d98200;--bad:#d64545;--soft:#eaf2fc}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hwrap{max-width:1180px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo small{font-weight:600;opacity:.6;margin-left:6px;font-size:11px;letter-spacing:1.5px}
nav{display:flex;gap:3px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cad7e8;font-weight:700;padding:7px 12px;border-radius:8px}
nav button.on{background:#fff;color:var(--navy)}
.modebadge{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px}
main{max-width:1180px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
h2{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
h3{font-size:16.5px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--sub)}.tiny{font-size:12.5px;color:var(--sub);margin:6px 0}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.primary:disabled{background:#a9b6c7;cursor:not-allowed}
.ghost{background:#fff;color:var(--navy);border:1px solid #c5cfdc;border-radius:10px;padding:8px 13px;font-weight:600}
.ghost:disabled{opacity:.55;cursor:default}
.sm{padding:6px 10px;font-size:13px}
.full{width:100%}
.big{padding:13px 22px;font-size:17px}
.chip{display:inline-block;font-size:12.5px;background:var(--soft);color:var(--navy);border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;font-weight:600}
.chip.warn{background:#fff1d6;color:#8a5200;cursor:pointer}
.chip.ok{background:#dcf5e6;color:#11673a}

/* start overlay */
.overlay{position:fixed;inset:0;background:linear-gradient(160deg,#1f3a5f,#28507f 60%,#3a6aa0);z-index:50;display:none;overflow:auto;padding:20px}
.overlay.show{display:block}
.startbox{max-width:760px;margin:20px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.startbox h1{margin:0;font-size:26px;letter-spacing:-.5px}
.startbox .en{color:var(--accent);font-weight:800;letter-spacing:2px;font-size:12px}
.gear{display:flex;gap:20px;align-items:center;margin:16px 0;flex-wrap:wrap;justify-content:center}
#avatar{width:170px;height:200px;background:var(--soft);border-radius:16px;display:flex;align-items:center;justify-content:center}
.gearbtns{display:flex;flex-direction:column;gap:10px;min-width:220px}
.gearbtn{background:#fff;border:2px solid var(--accent);color:var(--accent);border-radius:12px;padding:12px 16px;font-weight:800;font-size:16px;transition:.25s}
.gearbtn:hover{background:var(--soft)}
.gearbtn.gone{opacity:0;transform:scale(.6);pointer-events:none;height:0;padding:0;margin:-5px 0;border-width:0}
.geardone{color:var(--ok);font-weight:800;text-align:center;display:none}
.modesel{background:#f6f8fb;border-radius:12px;padding:14px;margin:12px 0}
.modesel h4{margin:0 0 8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-top:8px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.chk small{display:block;color:var(--sub);font-size:12.5px}
.startfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* mission picker */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mcard .f{font-size:20px;font-weight:800}
.mcard .goal{background:#f4f7fb;border-radius:9px;padding:8px 10px;font-weight:600}
.mcard .row{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.sectitle{margin:18px 0 8px;font-size:17px}

/* workspace */
.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.kicker{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px}
.stages{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.stages span{font-size:12px;padding:3px 9px;border-radius:99px;background:#e6ebf2;color:#7a8597;font-weight:700}
.stages span.on{background:var(--navy);color:#fff}
.stages span.did{background:#dcf5e6;color:#11673a}
.calcgrid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.given{background:#f4f7fb;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14.5px}
.cstep{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.cstep.ok{border-color:#9fdbb7;background:#f3fbf6}
.cstep .q{font-weight:700;margin-bottom:8px}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;align-items:center;justify-content:center;margin-right:6px}
.ansrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ansrow input,.lbl input{font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid #c5cfdc;border-radius:9px;width:150px}
.ansrow input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.good{color:var(--ok);font-weight:800}
.hint{background:#fff8e6;border-left:4px solid #f0b400;padding:7px 10px;border-radius:6px;margin-top:8px;font-size:14px}
.hint.f{background:#eef6ff;border-color:var(--accent);font-family:ui-monospace,Menlo,monospace}
.cmsg{color:var(--bad);font-size:13.5px;margin-top:5px;min-height:0}
.summary{background:#e9f7ef;border-radius:12px;padding:12px;margin-top:6px}
.calcbox .cdisp{background:#18232f;color:#e9f1ff;font-family:ui-monospace,Menlo,monospace;font-size:19px;padding:10px;border-radius:10px;text-align:right;min-height:46px;word-break:break-all}
.calcbox .cres{text-align:right;color:var(--sub);font-family:ui-monospace,Menlo,monospace;min-height:22px;font-size:14px;margin:4px 2px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.key{border:1px solid var(--line);background:#f7f9fc;border-radius:9px;padding:11px 0;font-size:17px;font-weight:700}
.key.op{background:#e7effa;color:var(--navy)}
.key:active{transform:scale(.96)}
.flasks{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.flaskbtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:100px}
.flaskbtn:hover{border-color:var(--accent);background:var(--soft)}

.labgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.scenebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#scene{touch-action:none;user-select:none;-webkit-user-select:none}
#scene svg{display:block;width:100%;height:auto}
.dishg{cursor:grab}.rodg{cursor:ew-resize}
.zbtn,.jar{cursor:pointer}.zbtn:hover rect{filter:brightness(1.12)}.zbtn:active{transform:translateY(1px)}.jar:hover{filter:brightness(1.05)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-top:1px solid var(--line);background:#f7f9fc}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;width:76px;padding:7px 2px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:12.5px;font-weight:700;color:var(--navy)}
.tool svg{width:30px;height:30px}
.tool:hover{border-color:var(--accent);background:var(--soft)}
.tool:active{transform:scale(.95)}
.side .card{margin-bottom:12px}
.lcd{background:#17301f;color:#6dff9a;font-family:ui-monospace,Menlo,monospace;font-size:34px;text-align:right;padding:8px 14px;border-radius:10px;letter-spacing:1px}
.lcd small{font-size:16px;color:#9fe8b7}
.row2{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed var(--line)}
.holds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hold{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;border:0;border-radius:12px;padding:14px 6px;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .05s}
.hold.add{background:#2b7de9}.hold.sub{background:#7a5af0}.hold.wash{background:#1aa3b8;width:100%;margin-top:8px}.hold.mix{background:#e07b24;width:100%}.hold.stir{background:#1f9d55;width:100%}
.hold.pressing{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);filter:brightness(1.08)}
.msg{font-size:13.5px;margin:8px 0;min-height:18px;color:var(--warn);font-weight:600}
.bar{height:12px;background:#e6ebf2;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#33c27a,#1f9d55);width:0}
.log{list-style:none;padding:0;margin:0;font-size:13.5px}
.log li{padding:4px 0;border-bottom:1px dashed var(--line)}
.log .sk{color:var(--warn)}
.zoomwrap{display:flex;gap:8px;align-items:stretch}
#zoom{flex:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);position:relative}
#zoom svg{display:block;width:100%;height:auto}
#eyeFig{width:92px;flex:none}
.slider{display:block;margin-top:10px;font-weight:700;font-size:14px}
.slider input{width:100%}
.slabels{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.drop{position:absolute;left:50%;top:0;width:9px;height:12px;margin-left:-4px;background:#7cc7ee;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fall .35s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(120px);opacity:.2}}
.pipsizes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pipsizes button{border:1.5px solid #c5cfdc;background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px}
.pipsizes button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lbl{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px}
.lbl input{width:100%}

.resgrid{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.stars{font-size:30px;color:#f4b400;letter-spacing:3px}
.stars .off{color:#d7dce4}
.restable{width:100%;border-collapse:collapse;margin:8px 0}
.restable td{padding:7px 4px;border-bottom:1px solid var(--line)}
.restable td:last-child{text-align:right;font-weight:800}
.reasons{margin:8px 0;padding-left:18px}
.reasons li{margin:3px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bottlecard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.bottlecard .info{font-size:13px;color:var(--sub);text-align:left;margin:6px 0}

/* concept */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.concept h3{color:var(--navy);font-size:18px}
.formula{background:#f4f7fb;border-radius:10px;padding:12px;text-align:center;font-size:19px;font-weight:800;margin:10px 0}
.formula small{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:4px}
.mis{background:#fff1f1;border-left:4px solid var(--bad);padding:9px 12px;border-radius:6px;margin:10px 0;font-size:14.5px}
.ex{background:#eef6ff;border-radius:10px;padding:10px 12px;font-size:14.5px;margin:8px 0}
.concept ul{padding-left:20px;margin:6px 0}
.concept li{margin:3px 0}
details{background:#f7f9fc;border-radius:10px;padding:10px 12px;margin-top:8px}
summary{font-weight:700;cursor:pointer}

/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(15,25,40,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.micon{font-size:34px;line-height:1}
.mbox h3{margin:8px 0}
.mbody{font-size:15px}
.mbody ul{padding-left:20px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
 .calcgrid,.labgrid{grid-template-columns:1fr}
 .resgrid{grid-template-columns:1fr}
 .resgrid>div:first-child{max-width:220px;margin:0 auto}
}
@media (max-width:520px){
 main{padding:10px}
 .tool{width:calc(20% - 5px);font-size:11px;padding:6px 0}
 .tool svg{width:24px;height:24px}
 .logo small{display:none}
 nav button{padding:6px 9px;font-size:14px}
 .modebadge{margin-left:0}
}

.chip.warn{cursor:pointer}
.ystar{color:#f4b400}.nstar{color:#d7dce4}
.stars.sm{font-size:15px;letter-spacing:1px}
.rescard,.bottlecard{position:relative}
.stamp{position:absolute;right:14px;top:10px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.stamp.sm{right:8px;top:8px}
main,.hwrap{max-width:1720px!important}
.labgrid{grid-template-columns:minmax(0,1fr) 380px!important;gap:16px!important}
@media (max-width:1100px){.labgrid{grid-template-columns:1fr!important}}
.shelfgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))!important}
.bottlecard{padding-top:16px}
.notice{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.notice .nicon{font-size:46px}
.notice h3{font-size:20px;margin:8px 0}
.ordiv{color:var(--sub);font-size:13px;margin:16px 0 8px}
.picklist{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.dtgt .row2{font-size:14.5px}
.dinrow{display:flex;gap:8px;align-items:center}
.dinrow input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:800;padding:9px 12px;border:2px solid #c5d3e3;border-radius:10px;text-align:right}
.dinrow input:focus{outline:none;border-color:var(--accent)}
.dinrow input::placeholder{font-size:15px;font-weight:500;color:#9aa8b8}
.dinrow .dunit{font-size:20px;font-weight:900;color:var(--navy)}
.dinrow button{white-space:nowrap}
#dRand.spin{animation:dspin .45s ease-out}
@keyframes dspin{0%{transform:rotate(0)}60%{transform:rotate(-14deg) scale(1.08)}100%{transform:rotate(0)}}
.pickrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pickrow svg{flex:none}
.pinfo{flex:1;font-size:14px}
.mbox{max-width:520px}
.pop{position:absolute;z-index:10;background:#fff;border:1px solid #c5cfdc;border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.poptitle{font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:4px}
.toolbar{position:relative}
.glowbtn{position:relative;border-color:#f0b400!important;color:#8a5a00!important;background:linear-gradient(110deg,#fff8e1 30%,#ffe9a8 45%,#fff8e1 60%)!important;background-size:250% 100%!important;animation:glowpulse 1.4s ease-in-out infinite,shimmer 1.8s linear infinite}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(240,180,0,.55)}50%{box-shadow:0 0 0 7px rgba(240,180,0,0),0 0 14px 3px rgba(255,200,40,.6)}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.key{border:1px solid #cdd6e2!important;background:linear-gradient(#ffffff,#eef2f7)!important;box-shadow:0 3px 0 #c3ccd8;transition:background .18s,transform .08s,box-shadow .08s,color .18s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.key:hover{background:linear-gradient(#ffffff,#e3ecf8)!important;border-color:#9fb6d6!important}
.key.op{background:linear-gradient(#eef4fd,#dce8f8)!important;color:var(--navy)}
.key:active,.key.hit{transition:none!important;transform:translateY(3px) scale(.97)!important;box-shadow:0 0 0 #c3ccd8!important;background:linear-gradient(#2b7de9,#1f63c4)!important;color:#fff!important;border-color:#1f63c4!important}
.key.hit.op,.key.op:active{background:linear-gradient(#1f3a5f,#162b47)!important}
.cdisp.bump{animation:bump .18s ease}
@keyframes bump{50%{transform:scale(1.015);box-shadow:0 0 0 3px rgba(43,125,233,.35)}}
.strict-note{background:#fff6e5;border-left:4px solid #f0b400;border-radius:8px;padding:8px 11px;font-size:13.5px;margin:10px 0 4px}

/* ---- 휴대폰 ---- */
.mobonly{display:none}
.scenebox{position:relative}
.fsbtn{position:absolute;right:8px;top:8px;z-index:3;background:rgba(31,58,95,.92);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}
.fsbtn:hover{background:#2b7de9}
/* 가로 전체 화면 */
#fsRoot{display:none;position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:80;background:#eef3f9;overflow:hidden}
#fsRoot.on{display:block;overflow:clip}
#fsRoot.rot{left:var(--W);top:0;width:var(--H);height:var(--W);transform:rotate(90deg);transform-origin:0 0}
#fsRoot:fullscreen{width:100%;height:100%}
#fsScene{position:absolute;left:0;top:0;right:0;bottom:0;transition:right .2s}
#fsRoot.sheet #fsScene{right:min(44%,400px)}

const SUBS={
 NaCl:{name:'염화 나트륨',f:'NaCl',M:58.44,powder:'#f4f4f4'},
 glucose:{name:'포도당',f:'C₆H₁₂O₆',M:180.16,powder:'#f8f6ee'},
 NaOH:{name:'수산화 나트륨',f:'NaOH',M:40.00,powder:'#f1f1f1',caution:{title:'수산화 나트륨(NaOH) 주의',items:['강한 염기라서 피부와 눈을 부식시켜요. 장갑과 보안경을 꼭 착용해요.','공기 중의 수분을 흡수해 스스로 녹는 성질(조해성)이 있어요. 빠르게 달고, 시약병 뚜껑은 바로 닫아요.','물에 녹을 때 열이 많이 나요(발열). 실온까지 식힌 다음 부피 플라스크로 옮겨요.']}},

function normConc(t){return String(t||'').replace(/[ㅡᅳ]/g,'M').normalize('NFKC').replace(/[ㅡᅳ]/g,'M').replace(/[−–]/g,'-').replace(/,/g,'.').trim();}

function parseConc(t){

 const m=s.match(/(\d*\.?\d+)(?:\s*(?:[x×*·]\s*10\s*\^?\s*([-+]?\d+)|[eE]([-+]?\d+)))?/);
 let val=NaN,rest='';
 if(m){val=parseFloat(m[1]);const ex=m[2]??m[3];if(ex!=null)val*=Math.pow(10,+ex);rest=s.slice(m.index+m[0].length).trim();}
 const u=rest.replace(/\s+/g,'');
 const unit=!u?'none':(u==='M'||/^(mol\/l|moll-1|mol·l-1|몰\/l)$/i.test(u)||/^M\(mol\/l\)$/i.test(u))?'M':'bad';
 return {val,unit,rest};
}

ircle cx="214" cy="80" r="4" fill="#1f4fa8" stroke="#fff" stroke-width="1.2"/><circle cx="253" cy="90" r="4" fill="#1f4fa8" stroke="#fff" stroke-width="1.2"/><circle cx="193" cy="108" r="4" fill="#1f4fa8" stroke="#fff" stroke-width="1.2"/><circle cx="276" cy="113" r="4" fill="#1f4fa8" stroke="#fff" stroke-width="1.2"/><circle cx="232" cy="120" r="4" fill="#1f4fa8" stroke="#fff" stroke-width="1.2"/><line x1="276" y1="110" x2="287" y2="110" stroke="#8fa7bf" stroke-width="1"/><line x1="276" y1="88" x2="287" y2="88" stroke="#8fa7bf" stroke-width="1"/><line x1="276" y1="66" x2="287" y2="66" stroke="#8fa7bf" stroke-width="1"/><line x1="276" y1="44" x2="287" y2="44" stroke="#8fa7bf" stroke-width="1"/><text x="235" y="14" text-anchor="middle" font-size="12" font-weight="800">희석 후</text><text x="235" y="150" text-anchor="middle" font-size="11">M₂, V₂ (용질 입자 수는 같아요)</text></svg>
    <h4>희석 공식이 나오는 이유</h4>
    <div class="derive">
     <div>희석 전 용질의 몰수 = <b>M₁ × V₁</b></div>

     <div class="eq">몰수가 같으므로 <b>M₁V₁ = M₂V₂</b></div>
     <div class="formula">V₁ = ${frac('M₂ × V₂','M₁')}</div>
    </div>
    <p class="tiny">💡 V₁과 V₂의 단위만 같으면 돼요. 둘 다 mL로 써도 계산 결과는 같아요.</p>
   </div>
   <div>
    <h4>예제: 0.100 M NaCl로 0.0100 M 용액 100 mL 만들기</h4>
    <ol class="steps">
     <li>필요한 몰수: n = 0.0100 mol/L × 0.100 L = 1.00×10⁻³ mol</li>
     <li>원액 부피: V₁ = ${frac('0.0100 M × 100 mL','0.100 M')} = <b>10.0 mL</b></li>
     <li>원액을 비커에 조금 덜고 <b>원액병 뚜껑은 바로 닫기</b></li>
     <li>피펫을 원액으로 <b>공세척</b>한 뒤 10.0 mL를 정확히 뽑기</li>
     <li>100 mL 부피 플라스크에 넣고 증류수로 <b>표선까지</b> 채우기</li>
     <li>마개를 닫고 뒤집어 섞기 → 시약병에 옮겨 라벨 붙이기</li>
    </ol>
    <h4>희석 배수</h4>
    <div class="formula sm">희석 배수 = ${frac('M₁','M₂')} = ${frac('V₂','V₁')}</div>
    <p>10배 희석은 <b>원액 1 : 전체 10</b>이에요. 원액 10 mL에 물 100 mL를 더하는 게 아니라, <b>전체가 100 mL</b>가 되게 하는 거예요.</p>
    <div class="mis">❌ <b>흔한 실수</b>: “원액 10.0 mL + 물 100 mL” → 전체가 약 110 mL가 되어 농도가 더 묽어져요.<br>➜ 부피 플라스크의 <b>표선까지</b> 채워 전체 부피를 정확히 V₂로 맞춰요.</div>
   </div>
   <div>
    <h4>🚿 공세척이란?</h4>
    <p>옮길 용액을 조금 넣어 기구 안쪽을 헹군 뒤 버리는 거예요.</p>
    <ul class="clist">
     <li><b>왜?</b> 씻은 피펫 안에 남은 물방울이 원액과 섞이면 원액이 묽어져요. 그러면 같은 부피를 뽑아도 용질이 덜 들어가서 만든 용액의 농도가 낮아져요.</li>
     <li><b>공세척하는 기구</b>: 피펫(용액을 담아 옮기는 기구)</li>
     <li><b>공세척하면 안 되는 기구</b>: 부피 플라스크. 원액으로 헹구면 용질이 더 들어가 농도가 높아져요. 증류수로 헹군 상태 그대로 써요.</li>
    </ul>
    <h4>⚠️ 안전하게 희석하기</h4>
    <ul class="clist">
     <li>피펫은 입으로 빨지 않고 <b>피펫 필러</b>를 써요.</li>

     <li>진한 산을 묽힐 때는 <b>물에 산을 조금씩</b> 넣어요. 반대로 하면 열 때문에 튈 수 있어요.</li>
    </ul>

function swatch(k){const s=SUBS[k];return `<span class="swatch" style="background:${s.color?liquidColor(k,s.ref):'#e9f2fb'}"></span>`;}
function renderPrep(){
 const v=$('#v-prep');
 if(S.job&&S.job.kind==='prep'){renderWorkspace(v);return;}
 const known=S.prepMissions.filter(m=>!['X','Y','Z'].includes(m.sub));
 const unk=S.prepMissions.filter(m=>['X','Y','Z'].includes(m.sub));
 const card=m=>{const s=SUBS[m.sub];const i=S.prepMissions.indexOf(m);return `<div class="mcard">
  <div class="f">${swatch(m.sub)}${s.f}</div><div class="muted">${s.name} · 몰질량 <b>${s.M.toFixed(2)}</b> g/mol</div>
  <div class="goal">🎯 ${sig(m.M)} M 용액 ${m.V} mL</div>${bestChip(m.id)}
  <div class="row"><button class="primary" onclick="startPrep(${i})">실험 시작</button><button class="ghost sm" onclick="rerollPrep(${i})">🎲 다른 농도</button></div></div>`;};
 v.innerHTML=`<h2>용액 만들기</h2><p class="muted">고체 시약을 정확히 달아 원하는 몰농도의 용액을 만들어요. 계산 → 부피 플라스크 고르기 → 실험 → 시약병에 옮겨 라벨 붙이기 순서로 진행해요.</p>
 <h3 class="sectitle">🧂 이름을 아는 물질</h3><div class="mgrid">${known.map(card).join('')}</div>
 <h3 class="sectitle">❓ 미지의 물질 X · Y · Z</h3><p class="tiny">이름은 모르지만 몰질량은 알려진 물질이에요. 정해진 몰농도로 정확히 만들어 보세요.</p><div class="mgrid">${unk.map(card).join('')}</div>`;
}
function startPrep(i){
 const go=()=>{const m=Object.assign({},S.prepMissions[i]);cautionPopup(m.sub,()=>{S.job=newJob('prep',m);render();window.scrollTo(0,0);});};
 if(S.job)return confirmQuit(go);go();
}

const DIL_MINV1=0.5,DIL_MAXV1=25;/* 옮길 원액: 0.5 mL 이상, 가장 큰 피펫(25 mL) 이하 */
const usableShelf=()=>S.shelf.filter(it=>(it.remain||0)>=DIL_MINV1+5);
function renderDil(){
 const v=$('#v-dil');
 if(S.job&&S.job.kind==='dil'){renderWorkspace(v);return;}
 const us=usableShelf();
 if(us.length){
  const cards=S.shelf.map(it=>{const pc=parseConc(it.labelConc),okc=pc.val>0;
   const low=it.remain<DIL_MINV1+5;

  v.innerHTML=`<h2>희석하기</h2><p class="muted">시약장에 보관한 <b>내가 만든 용액</b>을 원액으로 골라, 만들 용액의 <b>몰농도를 직접 정하거나 🎲 랜덤</b>으로 정해요. 만들 용액은 ${DIL_V2} mL예요. 원액에 생긴 오차는 희석한 용액에도 그대로 이어져요!</p>

/* 만들 용액의 목표 몰농도 정하기 (직접 입력 또는 랜덤) */
function dilSrc(src){
 if(src.shelf){const it=S.shelf.find(x=>x.id===src.shelf);if(!it)return null;return {it,sub:it.sub,M1:parseConc(it.labelConc).val,V2:DIL_V2,remain:it.remain||0,name:it.labelName,conc:it.labelConc};}
 const p=S.dilMissions[src.preset];return {sub:p.sub,M1:p.M1,V2:p.V2,remain:Infinity,name:`${SUBS[p.sub].f} 원액`,conc:sig(p.M1)+' M',preset:p};
}
function dilRange(d){const maxV1=Math.min(DIL_MAXV1,d.remain-5);return {lo:d.M1*DIL_MINV1/d.V2,hi:Math.min(d.M1*maxV1/d.V2,d.M1*0.999),maxV1};}
function fmtM(x){return sig(x)+' M';}
function openDilTarget(src){
 const d=dilSrc(src);if(!d)return;
 if(!(d.M1>0)){modal({icon:'🏷️',title:'라벨 농도를 읽을 수 없어요',html:'라벨의 몰농도를 먼저 고쳐 주세요.'});return;}
 const r=dilRange(d);
 if(r.maxV1<DIL_MINV1){modal({icon:'🧪',title:'남은 양이 부족해요',html:`남은 양(${Math.round(d.remain)} mL)으로는 희석 실험을 할 수 없어요.`});return;}
 const s=SUBS[d.sub],def=d.preset?sig(d.preset.M2):'';
 modal({icon:'🎯',title:'만들 용액의 몰농도 정하기',html:`<div class="dtgt">
  <div class="row2"><span>원액</span><b>${swatch(d.sub)}${esc(d.name)} · ${esc(d.conc)}</b></div>
  <div class="row2"><span>만들 부피</span><b>${d.V2} mL</b></div>
  <label class="tiny" for="dTgt" style="display:block;margin:10px 0 4px">만들 용액의 몰농도 (원액보다 낮게)</label>
  <div class="dinrow"><input id="dTgt" type="text" inputmode="decimal" autocomplete="off" placeholder="예: ${sig(r.lo*4>r.hi?r.hi:r.lo*4)}" value="${def}"><span class="dunit">M</span><button class="ghost" id="dRand" onclick="randDilTarget()">🎲 랜덤</button></div>
  <p class="tiny" style="margin:6px 0 0">정할 수 있는 범위: <b>${fmtM(r.lo)}</b> ~ <b>${fmtM(r.hi)}</b><br><span class="muted">(옮길 원액이 너무 적으면 정확히 옮기기 어렵고, 너무 많으면 가장 큰 피펫(25 mL)으로 한 번에 옮길 수 없어요${isFinite(d.remain)?' · 남은 원액도 생각해요':''})</span></p>
  <div class="msg" id="dErr" style="min-height:0;margin-top:6px"></div>
  <div class="btnrow" style="margin-top:10px"><button class="ghost" onclick="$('#modal').classList.remove('show')">취소</button><button class="primary" style="flex:1" onclick="startDilTarget()">이 농도로 희석하기</button></div></div>`,buttons:[]});
 S._dsrc=src;
 const inp=$('#dTgt');inp.addEventListener('keydown',e=>{if(e.key==='Enter')startDilTarget();});inp.addEventListener('input',()=>{$('#dErr').innerHTML='';});
}
function randDilTarget(){
 const d=dilSrc(S._dsrc),r=dilRange(d);
 const cand=[1,1.5,2,2.5,3,4,5,6,7.5,8,10,12,12.5,15,16,20,25].filter(v=>v>=DIL_MINV1&&v<=r.maxV1)
  .map(v=>Number(sig(d.M1*v/d.V2))).filter(m=>m>=r.lo*0.999&&m<=r.hi*1.001);
 const cur=parseFloat($('#dTgt').value);let pool=cand.filter(m=>m!==cur);if(!pool.length)pool=cand;
 const m=pool[Math.floor(Math.random()*pool.length)];
 if(m==null){$('#dErr').innerHTML='남은 원액이 적어 고를 수 있는 농도가 거의 없어요. 범위 안에서 직접 입력해요.';return;}
 $('#dTgt').value=sig(m);$('#dErr').innerHTML='';
 const b=$('#dRand');if(b){b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');}
}
function startDilTarget(){
 const d=dilSrc(S._dsrc),r=dilRange(d);
 const raw=($('#dTgt').value||'').replace(/,/g,'.').replace(/\s*(M|mol\/L)\s*$/i,'').trim();
 const v=Number(raw),err=t=>{$('#dErr').innerHTML=`<span style="color:#c0392b">${t}</span>`;};
 if(!raw||!isFinite(v)||v<=0)return err('몰농도를 숫자로 입력해요. (예: 0.0250)');
 const M2=Number(sig(v));
 if(M2>=d.M1)return err(`희석하면 농도가 <b>낮아져요</b>. 원액(${fmtM(d.M1)})보다 낮은 농도를 입력해요.`);
 if(M2>r.hi*1.001)return err(`원액을 너무 많이 옮겨야 해요. <b>${fmtM(r.hi)} 이하</b>로 정해요.`);
 if(M2<r.lo*0.999)return err(`너무 묽어요. 옮길 원액이 너무 적어서 정확하게 만들기 어려워요. <b>${fmtM(r.lo)} 이상</b>으로 정해요.`);
 $('#modal').classList.remove('show');
 if(d.preset){const m=Object.assign({},d.preset,{M2});const go=()=>cautionPopup(m.sub,()=>{S.job=newJob('dil',m);S.tab='dil';render();window.scrollTo(0,0);});if(S.job&&S.job.stage!=='result')return confirmQuit(go);go();return;}
 pickStock(d.it.id,M2);
}

 const m={id:'d-'+it.sub,sub:it.sub,M1,M1act:it.actual,M2,V2:DIL_V2,fromShelf:it.id,stockLabel:it.labelConc};
 const go=()=>cautionPopup(m.sub,()=>{S.job=newJob('dil',m);S.tab='dil';render();window.scrollTo(0,0);});

 modal({icon:'🧪',title:'이미 준비된 시약으로 실험하기',html:`<p class="tiny" style="margin-top:0">원액을 고른 다음, 만들 용액의 몰농도를 정해요.</p><div class="picklist">${rows}</div>`,buttons:[{t:'닫기',cls:'ghost'}]});

function confirmQuit(then){if(S.job&&S.job.stage==='result'){S.job=null;then&&then();render();return;}modal({icon:'🚪',title:'진행 중인 미션이 있어요',html:'지금 하던 미션을 그만두고 새로 시작할까요?',buttons:[{t:'계속하기',cls:'ghost'},{t:'그만두기',fn:()=>{S.job=null;then&&then();render();}}]});}

function newJob(kind,m){
 const j={kind,m,stage:'calc',calc:{step:0,hint:[0,0,0],ok:[]},flask:null,steps:kind==='prep'?PREP_STEPS:DIL_STEPS};
 if(kind==='prep'){const s=SUBS[m.sub];j.targetCg=j.trueCg=Math.round(m.M*m.V/1000*s.M*100);}
 else{j.V1=m.M2*m.V2/m.M1;j.V1u=j.trueV1u=j.V1>1.0001?Math.round(j.V1*10)*10:Math.round(j.V1*100);}
 j.hintsUsed=0;resetPhys(j);S.calcExpr='';S.calcRes=null;/* 새 실험은 미니 계산기도 처음부터 */
 return j;
}

 Object.assign(j,{cur:0,log:[],eff:[],panel:null,

  bAnchor:false,pourB:0,pouring:false,poured:false,rinses:0,
  fVol:0,level:null,eye:(Math.random()<.5?-1:1)*(9+rand(12)),eyeAtMark:0,overflow:false,
  stopper:false,mixP:0,mixAng:0,mixY:0,shaken:false,fEmpty:false,bottleVol:0,bottleSpill:false,nfLoss:0,nfNotified:false,
  pipSize:null,pip:0,pipT:0,pipRinsed:false,pipNoRinse:false,bStock:0,lidOpen:false,transferred:false,
  pourLeft:0,xOn:false,xs:0,resume:false,posOv:null,funnelDirty:false,funnelRinsed:false,fillDone:false,lateAnchor:false,wasAnchored:false,lazyDone:false,mixTaps:[],
  drag:null,anim:null});
 j.placed.waste=false;

const gross=j=>(j.dishOn&&!(j.drag&&j.drag.k==='dish')&&!(j.anim&&j.anim.k==='dish'))?j.dishMass+dishAmt(j):0;

/* 계산하기: 오차 반영 모드에서는 정답 여부·힌트 없이 내 답으로 진행 */
function calcStageHTML(j){return S.mode==='free'?freeCalcHTML(j):calcStageStrictHTML(j);}
function freeCalcHTML(j){
 const st=calcSteps(j),s=SUBS[j.m.sub],v=j.calc.free||[];
 const given=j.kind==='prep'?`주어진 값: 몰질량 <b>${s.M.toFixed(2)} g/mol</b> · 목표 몰농도 <b>${sig(j.m.M)} M</b> · 용액 부피 <b>${j.m.V} mL</b><br><span class="tiny">※ 이 실험실에서는 위에 주어진 몰질량(소수 둘째 자리)을 그대로 써요.</span>`:`주어진 값: 원액 <b>${sig(j.m.M1)} M</b> · 목표 몰농도 <b>${sig(j.m.M2)} M</b> · 만들 부피 <b>${j.m.V2} mL</b>`;
 let h=`<div class="calcgrid"><div class="card"><h3>① 계산하기</h3><div class="given">${given}</div>
 <div class="strict-note">⚖️ <b>오차 반영 모드</b>에서는 계산이 맞는지 알려주지 않고, 힌트도 없어요. 내가 계산한 값으로 실험하니 <b>계산 실수도 결과의 오차</b>가 돼요. 신중하게!</div>`;
 st.forEach((q,i)=>{h+=`<div class="cstep"><div class="q"><span class="num">${i+1}</span>${q.q}</div><div class="ansrow"><input id="ca${i}" inputmode="decimal" autocomplete="off" value="${v[i]??''}" onfocus="S.lastInput='ca${i}'" oninput="(S.job.calc.free=S.job.calc.free||[])[${i}]=this.value"><span>${q.unit}</span></div></div>`;});
 h+=`<div class="cmsg" id="cmf"></div><div class="btnrow"><button class="primary" onclick="freeCalcDone()">계산 완료 → ② 부피 플라스크 고르기</button></div></div>${calcHTML()}</div>`;
 return h;
}
function freeCalcDone(){
 const j=S.job,st=calcSteps(j);
 const vals=st.map((q,i)=>parseFloat(String($('#ca'+i).value).replace(/,/g,'.').trim()));
 if(vals.some(x=>!(x>0))){$('#cmf').textContent='모든 칸에 0보다 큰 숫자를 써 주세요.';return;}
 j.calc.free=st.map((q,i)=>$('#ca'+i).value.trim());j.calc.freeMode=true;j.calc.vals=vals;
 const last=vals[vals.length-1];
 if(j.kind==='prep'){
  const cg=Math.round(last*100);
  if(cg<1){$('#cmf').textContent='저울은 0.01 g부터 잴 수 있어요. 마지막 칸의 질량을 다시 확인해 보세요.';return;}
  j.targetCg=cg;
 }else{
  if(last>=j.m.V2){$('#cmf').textContent=`원액 부피가 만들 용액 부피(${j.m.V2} mL)보다 클 수는 없어요. 다시 확인해 보세요.`;return;}
  if(last>25){$('#cmf').textContent='25 mL보다 많은 원액은 피펫으로 한 번에 옮길 수 없어요. 계산을 다시 확인해 보세요.';return;}
  const u=last<1?Math.round(last*100):Math.round(last*10)*10;
  if(u<1){$('#cmf').textContent='피펫으로 옮길 수 있는 양보다 너무 적어요. 다시 확인해 보세요.';return;}
  j.V1u=u;
 }
 j.stage='flask';render();
}
function missionTitle(j){const s=SUBS[j.m.sub];return j.kind==='prep'?`${sig(j.m.M)} M ${s.f} 용액 ${j.m.V} mL 만들기`:`${sig(j.m.M1)} M ${s.f} 원액으로 ${sig(j.m.M2)} M 용액 ${j.m.V2} mL 만들기`;}

 <div class="btnrow" style="margin-top:0">${S.mode==='free'&&(j.stage==='calc'||j.stage==='flask')?'<button class="ghost sm" onclick="resetStage(\'calc\')">🔄 계산 다시 하기</button>':''}${(j.stage==='lab'||j.stage==='label')?'<button class="ghost sm" onclick="resetStage(\'lab\')">🔄 실험 다시 하기</button>':''}<button class="ghost sm" onclick="quitJob()">미션 나가기</button></div></div>`;
 if(j.stage==='calc')h+=calcStageHTML(j);

}

 funnelOut:{label:'깔때기를 뺐어요',req:true,why:'표선을 맞추기 전에 <b>깔때기를 끌어서 빼요</b>(깔때기 받침으로). 깔때기가 꽂혀 있으면 표선을 정확히 볼 수 없고, 깔때기에 남은 물이 나중에 흘러 들어가요.'},
 mark:{label:'세척병으로 표선을 맞췄어요',req:true,why:'<b>세척병을 끌어서 부피 플라스크 입구</b>에 가져가고, 세척병을 <b>꾹 눌러</b> 조금씩 넣으며 메니스커스 아랫면을 표선에 맞춰요.'},
 mix:{label:'마개를 닫고 뒤집어 섞었어요',req:false,why:'툴바의 <b>마개</b>를 눌러 닫고, 부피 플라스크를 <b>좌우로 끌어 뒤집거나 위아래로 흔들어</b> 섞어요. 눌렀다 떼면 90°씩 돌아가요.',
  skip(j){if(j.mixP<1){const amp=(1-j.mixP)*0.04;const f=1+(Math.random()<.5?-1:1)*amp*(0.5+0.5*Math.random());addEff('충분히 섞지 않아 위치마다 농도가 다름',f);}}},
 bottleFunnel:{label:'시약병에 깔때기를 꽂았어요',req:false,skip(){},why:'⚠️ <b>안전을 위해 깔때기는 꼭 써야 해요.</b> 시약병 입구도 좁아서 그냥 부으면 용액이 흘러넘쳐요. 툴바의 <b>시약병</b>을 실험대에 올리고, <b>깔때기를 끌어서 시약병 입구</b>에 꽂아요.'},
 toBottle:{label:'용액을 시약병으로 옮겼어요',req:true,why:'부피 플라스크는 보관용이 아니에요. <b>부피 플라스크를 끌어서 시약병</b>에 가져가 옮겨 담아요. (툴바의 <b>시약병</b>을 먼저 실험대에 올려요)'},
 label:{label:'라벨을 붙였어요',req:true,why:'툴바의 <b>라벨</b>을 눌러 시약병에 라벨(물질, 농도와 단위, 날짜, 이름)을 붙여요.'},
 stock:{label:'원액을 비커에 조금 덜었어요',req:true,why:'<b>원액병을 눌러 뚜껑을 열고</b>, 원액병을 <b>끌어서 비커 위</b>에 놓아 쓸 만큼만 덜어요. 피펫을 원액병에 바로 넣으면 원액 전체가 오염될 수 있어요.'},
 stockClose:{label:'원액병 뚜껑을 닫았어요',req:false,why:'다 덜었으면 <b>원액병을 눌러 뚜껑을 닫아요</b>. 뚜껑을 열어 두면 먼지가 들어가 오염되고, 물이 증발해 농도가 변할 수 있어요.',
  skip(){addEff('원액병 뚜껑을 열어 둔 채 진행함 → 원액이 오염되거나 증발해 농도가 변할 수 있어요',1);
   setTimeout(()=>modal({icon:'🧴',title:'원액병 뚜껑을 닫지 않았어요!',html:'뚜껑을 열어 두면 먼지나 이물질이 들어가 <b>원액이 오염</b>되고, 물이 증발해 <b>농도가 변할 수</b> 있어요.<br><br>원액을 덜고 나면 <b>바로 뚜껑을 닫아야</b> 오염이 없어요.'}),80);}},
 pipette:{label:'피펫으로 원액을 정확히 옮겼어요',req:true,why:'툴바의 <b>피펫</b>을 눌러 알맞은 용량을 고르고, <b>공세척</b>한 뒤 계산한 부피만큼 정확히 뽑아 부피 플라스크에 넣어요.'}
};
const SKIPNAME={rinseFunnel:'깔때기 헹구기',tare:'영점 맞추기',stir:'유리 막대로 저어 녹이기',funnel:'부피 플라스크에 깔때기 꽂기',rodMove:'유리 막대 걸치기',rinse:'세척병으로 헹궈 넣기',mix:'마개 닫고 섞기',bottleFunnel:'시약병에 깔때기 꽂기',stockClose:'원액병 뚜껑 닫기'};
const curId=()=>S.job.steps[S.job.cur];
/* 단계를 할 수 있는지 확인 (자유 모드에서는 건너뛸 수 있는 단계를 건너뜀) */
function gate(id){
 const j=S.job;autoAdvance();const idx=j.steps.findIndex((s,i)=>i>=j.cur&&s===id);
 if(idx<0){toast(`이미 한 단계예요: ${STEP[id].label}`+(S.mode==='strict'?` · 지금 할 일: ${STEP[curId()].label}`:''));return false;}
 if(idx===j.cur)return true;
 if(S.mode==='strict'){modal({icon:'✋',title:'잠깐! 순서를 확인해요',html:'지금은 이 작업을 할 차례가 아니에요.<br><br>💡 '+STEP[curId()].why});return false;}
 for(let i=j.cur;i<idx;i++){const d=STEP[j.steps[i]];if(d.req&&!(j.steps[i]==='openStopper'&&!j.stopper)){modal({icon:'⛔',title:'이 단계는 건너뛸 수 없어요',html:d.why});return false;}}
 for(let i=j.cur;i<idx;i++){const id2=j.steps[i];STEP[id2].skip&&STEP[id2].skip(j);onLeave(id2);}
 j.cur=idx;j.panel=null;autoAdvance();
 if(curId()!==id)return false;
 return true;
}
/* 이어 붓기를 끝내지 않고 다음으로 넘어갈 때: 지금까지 부은 만큼만 정산 */
function settleResume(j){if(!j||!j.resume)return;const l2=1-j.pourB;j.pourLeft*=l2;j.bWater*=l2;j.pourB=0;j.poured=true;j.resume=false;j.pouring=false;j.bAnchor=false;}
function onLeave(id){
 const j=S.job;
 if(id==='stir'){j.stirring=false;}
 if(id==='rinse'){settleResume(j);j.bAnchor=false;j.lateAnchor=false;j.pourB=0;if(!(j.pourLeft>0.002))j.bWater=0;if(j.rodAt)j.rodAt='away';if(j.washDock==='rinse')j.washDock=null;}
 if(id==='mark'||id==='rinseFunnel'){j.washDock=null;j.squeezing=false;}
 if(id==='mix'){j.mixAng=0;j.mixY=0;}
}
function done(){
 const j=S.job,id=curId();j.log.push({t:STEP[id].label,k:'ok'});onLeave(id);j.cur++;autoAdvance();j.panel=null;renderLab();
 if(id==='stir'&&j.m.sub==='NaOH')modal({icon:'🔥',title:'비커가 뜨거워졌어요!',html:'NaOH가 물에 녹을 때 열이 나요(<b>발열</b>). 뜨거운 용액은 부피가 커져 있어서, 그대로 표선을 맞추면 식은 뒤 부피가 줄어 목표보다 진해져요.<br><br>실제 실험에서는 <b>실온까지 식힌 다음</b> 부피 플라스크로 옮겨요. (이 실험실에서는 식혔다고 가정할게요)',buttons:[{t:'식힌 뒤 진행할게요'}]});
}
function autoAdvance(){
 const j=S.job;
 for(let g=0;g<5;g++){const id=curId();
  if(id==='rinseFunnel'&&j.funnelAt!=='flask'){j.cur++;continue;}
  if(id==='openStopper'&&!j.stopper){j.cur++;continue;}
  if(id==='funnelOut'&&j.funnelAt!=='flask'){j.cur++;continue;}
  break;}
}
const HINT_MAX=2;
function nextHint(){
 const j=S.job;
 if(S.mode!=='free'){modal({icon:'💡',title:'다음에 할 일',html:STEP[curId()].why});return;}
 const cid=curId();j.hintSeen=j.hintSeen||[];
 if(j.hintSeen.includes(cid)){modal({icon:'💡',title:'다음에 할 일 (이미 본 힌트)',html:STEP[cid].why+'<br><br><span class="tiny">이미 본 힌트를 다시 보는 건 횟수에 들어가지 않아요.</span>'});return;}
 const left=HINT_MAX-(j.hintsUsed||0);
 if(left<=0){modal({icon:'💡',title:'힌트를 모두 썼어요',html:`오차 반영 모드에서는 힌트를 ${HINT_MAX}번까지만 쓸 수 있어요. 지금까지 한 실험을 떠올리며 스스로 다음 단계를 찾아봐요!`});return;}
 modal({icon:'💡',title:'힌트를 쓸까요?',html:`힌트는 별점을 깎지 않지만, 결과와 시약장에 <b>💡 힌트 사용 표시</b>가 남아요.<br>남은 힌트: <b>${left}번</b>`,buttons:[{t:'안 쓸래요',cls:'ghost'},{t:'힌트 보기',fn:()=>{
  j.hintsUsed=(j.hintsUsed||0)+1;j.hintSeen.push(cid);renderPanel();
  setTimeout(()=>modal({icon:'💡',title:`다음에 할 일 (남은 힌트 ${HINT_MAX-j.hintsUsed}번)`,html:STEP[curId()].why}),30);}}]});
}

/* 툴바 */
function useTool(tool){
 const j=S.job;if(!j||j.stage!=='lab'||modalOpen()||j.anim)return;
 closePop();
 if(tool==='scale'){pressZero();return;}
 if(['water','wash','funnel','bottle'].includes(tool)){
  if(j.placed[tool]){toast(`${josa(TOOLS[tool].name,'은','는')} 이미 실험대에 있어요. 끌어서 사용하세요.`);return;}
  j.placed[tool]=true;if(tool==='funnel')j.funnelAt='rest';
  renderScene();toast(`${josa(TOOLS[tool].name,'을','를')} 실험대에 올렸어요. 끌어서 사용하세요!`);return;
 }
 if((tool==='dish'||tool==='spoon')&&j.kind==='prep'&&j.moved){startExtra();return;}
 if(tool==='dish'){if(gate('dish')){j.dishOn=true;done();}return;}
 if(tool==='spoon'){openWeigh();return;}
 if(tool==='rod'&&j.kind==='prep'&&j.steps.indexOf('stir')<j.cur){if(j.rodAt==='flask'&&!j.poured){toast('유리 막대는 이미 부피 플라스크 입구에 걸쳐 있어요. 비커를 끌어서 막대 끝에 대요');return;}if(j.moved&&!j.poured&&!j.bAnchor&&j.bWater>0){j.rodAt='beaker';j.rodX=L().beaker.x+L().beaker.w/2;j.panel=j.dissolve<1?'stir':null;renderLab();toast(j.dissolve<1?'비커 안을 끌어서 저어요':'유리 막대를 비커에 넣었어요');}else toast('유리 막대는 실험대 위에 있어요. 끌어서 옮길 수 있어요');return;}
 if(tool==='rod'){if(gate('stir')){j.rodAt='beaker';j.rodX=L().beaker.x+L().beaker.w/2;j.panel='stir';renderLab();}return;}
 if(tool==='stopper'&&j.steps.indexOf('mix')<j.cur&&!j.anim){if(j.stopper){if(curId()==='openStopper'){openStopper();return;}j.stopper=false;renderScene();toast('마개를 열었어요');}else{j.stopper=true;renderScene();toast('마개를 닫았어요');}return;}
 if(tool==='stopper'){if(j.stopper){if(curId()==='mix'){if(j.panel!=='mix'){j.panel='mix';renderLab();}toast('마개는 닫혀 있어요. 부피 플라스크를 끌어서 섞은 다음에 열어요!');return;}openStopper();return;}if(gate('mix')){j.stopper=true;j.panel='mix';renderLab();toast('마개를 닫았어요. 부피 플라스크를 끌어서 섞어요!');}return;}
 if(tool==='label'){if(gate('label')){if(j.funnelAt==='bottle'){j.funnelAt='rest';j.log.push({t:'시약병에서 깔때기를 빼고 뚜껑을 닫았어요',k:'ok'});toast('시약병에서 깔때기를 빼고 뚜껑을 닫았어요');}j.stage='label';j.panel=null;render();}return;}
 if(tool==='pipette'){togglePop();return;}
 if(tool==='waste'){
  if(j.placed.waste){toast('폐시약통은 이미 실험대에 있어요. 버릴 기구를 끌어다 대요');return;}
  if(j.kind==='prep'&&!j.moved){modal({icon:'🗑️',title:'아직 버릴 용액이 없어요',html:'계량접시의 시료가 너무 많으면 <b>약숟가락으로 덜어내요.</b><br>폐시약통은 비커나 부피 플라스크에 넣은 용액을 버릴 때 써요.'});return;}
  j.placed.waste=true;renderScene();toast(`폐시약통을 실험대에 올렸어요. ${j.kind==='prep'?'비커나 ':''}부피 플라스크를 끌어다 대면 버릴 수 있어요`);return;}
}
/* 폐시약통: 잘못 만든 용액을 버리고 실험을 처음부터 다시 해요 */
function discardTo(what){
 const j=S.job,name=what==='beaker'?'비커':'부피 플라스크';
 modal({icon:'🗑️',title:`${name}의 용액을 폐시약통에 버릴까요?`,
  html:`용액을 버리면 <b>실험을 처음부터 다시</b> 해요. 계산한 값은 그대로 남아요.${j.kind==='dil'&&j.bStock>0?'<br>비커에 덜어 둔 원액도 함께 버려요.':''}<br><br>💡 용액을 하수구에 그냥 버리면 안 돼요. 실험실에서는 꼭 폐시약통에 모아요.`,
  buttons:[{t:'취소',cls:'ghost'},{t:'버리기',fn:()=>{
   P=null;closePop();const n=(j.wasteN||0)+1;resetPhys(j);j.wasteN=n;j.stage='lab';
   j.log.push({t:`잘못 만든 용액을 폐시약통에 버리고 다시 시작했어요${n>1?` (${n}번째)`:''}`,k:'ok'});
   render();toast('폐시약통에 버렸어요. 처음부터 다시 해요');}}]});
}
function openStopper(){
 const j=S.job,mi=j.steps.indexOf('mix'),oi=j.steps.indexOf('openStopper');
 if(j.cur>mi&&j.cur<oi){j.stopper=false;j.log.push({t:'부피 플라스크의 마개를 열었어요',k:'ok'});toast('부피 플라스크의 마개를 열었어요');renderLab();return;}
 if(gate('openStopper')){j.stopper=false;toast('부피 플라스크의 마개를 열었어요');done();}
}
/* 가루 시약 추가 계량: 비커의 용액을 붓기 전까지 */
function josa(w,a,b){const ch=w.charCodeAt(w.length-1);if(ch<0xAC00||ch>0xD7A3)return w+a+'('+b+')';return w+((ch-0xAC00)%28?a:b);}
function startExtra(){
 const j=S.job;
 if(j.poured||j.bAnchor||j.pourB>0){j.xOn=false;j.xs=0;toast('비커의 용액을 이미 붓기 시작해서 시료를 더 넣을 수 없어요');return;}
 if(j.xOn){j.panel='weigh';renderLab();return;}
 if(S.mode==='strict'){toast('목표 질량을 정확히 달아 이미 비커에 넣었어요. 더 넣으면 농도가 달라져요');return;}
 j.xOn=true;j.xs=0;j.dishOn=true;j.panel='weigh';renderLab();toast('빈 계량접시를 저울에 올렸어요. 더 넣을 시료를 달아서 비커로 옮겨요');
}
function openWeigh(){const j=S.job;if(j.kind!=='prep')return;if(j.moved){startExtra();return;}if(curId()==='weigh'&&j.panel==='weigh')return;if(gate('weigh')){j.panel='weigh';renderLab();}}
function pressZero(){
 const j=S.job;if(!j||j.stage!=='lab'||modalOpen()||j.anim||j.kind!=='prep')return;
 const id=curId();
 if(id==='dish'){j.tare=gross(j);toast(S.mode==='strict'?'빈 저울의 영점을 맞췄어요. 이제 계량접시를 올려요':'영점! 저울이 0.00 g을 가리켜요');renderScene();return;}
 if(id==='weigh'){
  if(j.sample>0&&S.mode==='strict'){modal({icon:'✋',title:'지금 영점을 누르면 안 돼요',html:'계량접시 위에 이미 시료가 있어요. 지금 영점을 누르면 올려 둔 시료의 질량이 0으로 지워져서, 실제보다 많이 담게 돼요.'});return;}
  j.tare=gross(j);toast(j.sample>0&&S.mode==='strict'?'⚠️ 시료가 있는 상태에서 영점을 눌렀어요':'영점! 저울이 0.00 g을 가리켜요');updateWeigh();renderScene();return;
 }
 if(j.xOn||j.cur>j.steps.indexOf('tare')){j.tare=gross(j);toast('영점! 저울이 0.00 g을 가리켜요');updateWeigh();renderScene();return;}
 if(gate('tare')){j.tare=gross(j);toast('영점! 저울이 0.00 g을 가리켜요');done();}
}

/* ---------- 실험 화면 ---------- */
function labHTML(j){
 const tools=j.kind==='prep'?PREP_TOOLS:DIL_TOOLS;
 return `<div class="labgrid"><div><div class="scenebox"><button class="fsbtn" onclick="fsEnter()">⛶ 전체 화면</button><div id="scene"></div>
 <div class="toolbar" id="toolbar">${tools.map(t=>`<button class="tool" data-tool="${t}" onclick="useTool('${t}')" title="${TOOLS[t].name}">${toolIcon(t)}${TOOLS[t].name}</button>`).join('')}</div></div></div>
 <div class="side"><div class="card" id="panel"></div><div class="card"><h3>📋 실험 기록</h3><ul class="log" id="log"></ul></div></div></div>`;
}
function renderLab(){if(!S.job)return;if(S.job.stage!=='lab'&&S.job.stage!=='label'){render();return;}renderScene();renderPanel();renderLog();}
function renderLog(){const j=S.job,el=$('#log');if(!el)return;el.innerHTML=j.log.length?j.log.map(l=>`<li class="${l.k==='skip'?'sk':''}">${l.k==='skip'?'⚠️':'✅'} ${l.t}</li>`).join(''):'<li class="muted">아직 기록이 없어요. 실험 도구를 눌러 시작하세요.</li>';}
function renderPanel(){
 const j=S.job,p=$('#panel');if(!p)return;
 if(j.stage==='label'){p.innerHTML=labelPanelHTML(j);return;}
 if(j.panel==='weigh'){p.innerHTML=weighHTML(j);updateWeigh();return;}
 if(j.panel==='stir'){p.innerHTML=stirHTML(j);updateStir();return;}
 if(j.panel==='mix'){p.innerHTML=mixHTML(j);updateMix();return;}
 if(j.panel==='mark'){p.innerHTML=markHTML(j);bindMark();updateMark();return;}
 if(j.panel==='pipette'){p.innerHTML=pipHTML(j);bindPip();updatePip();return;}
 const tgt=j.kind==='prep'?`${j.calc.freeMode?'내가 계산한 질량':'목표 질량'} <b>${g2(j.targetCg)} g</b> · ${j.flask} mL 부피 플라스크`:`옮길 원액 <b>${pipFmt(j.V1u,j.V1u%10?1:5)} mL</b> · ${j.flask} mL 부피 플라스크`;
 const extra=curId()==='rinse'&&j.rinses>0?(S.mode==='strict'?`<div class="msg">헹굼 ${j.rinses}/2 – 한 번 더 헹궈요!</div>`:''):curId()==='pour'&&j.bAnchor&&j.pourB>0?`<div class="msg">붓는 중 ${Math.round(j.pourB*100)}% – 비커를 꾹 누르고 있으면 계속 부어져요.</div>`:'';
 /* 남은 단계 수 (V-Lab 추가): 섞기까지 끝내면 다 된 것처럼 보여서 '왜 안 끝나지?' 하고 멈추는 일이 있었다 — 얼마나 남았는지, 끝은 시약병·라벨이라는 것을 늘 보여 준다 */
 const rem=j.steps.slice(j.cur).filter(id=>!(id==='openStopper'&&!j.stopper)).length,afterMix=j.cur>j.steps.indexOf('mix');
 const remHTML=`<div class="given" style="margin-bottom:8px">남은 단계 <b>${rem}개</b>${afterMix?' · 용액을 <b>시약병에 옮겨 담고 라벨</b>을 붙여야 끝나요':''}</div>`;
 p.innerHTML=`<h3>🔬 실험 진행</h3><div class="given" style="margin-bottom:8px">${tgt}</div>${remHTML}${extra}
 <ul class="howto"><li>🧰 툴바의 도구를 누르면 사용하거나 실험대에 올라가요.</li><li>✋ 실험대 위 기구는 <b>끌어서(드래그)</b> 옮겨요.</li><li>👆 세척병·비커 등은 <b>꾹 눌러</b> 사용해요.</li></ul>
 <p class="tiny">진행 방식: <b>${S.mode==='strict'?'잘못된 순서면 멈추고 안내':'멈추지 않고 진행 (실수는 오차로 반영)'}</b></p>
 <div class="btnrow" style="margin-top:0">${j.kind==='prep'&&!j.moved?'<button class="ghost" onclick="pressZero()">⚖️ 저울 영점 누르기</button>':''}<button class="ghost" onclick="nextHint()">💡 다음에 할 일은?${S.mode==='free'?` (${Math.max(0,HINT_MAX-(j.hintsUsed||0))}번 남음)`:''}</button></div>`;
}

/* 무게 달기 */
function weighHTML(j){
 if(j.xOn)return `<h3>⚖️ 시료 더 달기</h3><div class="lcd"><span id="wRead">0.00</span> <small>g</small></div>
 <div class="row2"><span>비커에 이미 넣은 시료</span><b>${g2(j.sample)} g</b></div>
 <div class="row2"><span id="wSpoonL">약숟가락</span><b id="wSpoon">0.00 g</b></div>
 <div class="spguide"><div>🥄 <b>큰 쪽</b>을 꾹 → 시약 담기</div><div>🥄 <b>작은 쪽</b>을 꾹 → 덜어내기</div></div>
 <div class="msg" id="wMsg"></div>
 <div class="btnrow" style="margin-top:0"><button class="ghost" onclick="pressZero()">⚖️ 영점</button></div><p class="tiny" style="margin-top:8px">👉 더 넣을 만큼 달았으면 <b>계량접시를 끌어서 비커</b>에 옮겨요.</p>`;
 return `<h3>⚖️ 시료 달기</h3><div class="lcd"><span id="wRead">0.00</span> <small>g</small></div>
 <div class="row2"><span>${S.mode==='free'&&j.calc.freeMode?'내가 계산한 질량':'목표 질량'}</span><b>${g2(j.targetCg)} g</b></div>
 <div class="row2"><span id="wSpoonL">약숟가락</span><b id="wSpoon">0.00 g</b></div>
 <div class="spguide"><div>🥄 <b>큰 쪽</b>을 꾹 → 시약 담기</div><div>🥄 <b>작은 쪽</b>을 꾹 → 덜어내기</div><div class="tiny" style="margin:2px 0 0">톡 누르면 0.01 g, 오래 누를수록 많이 (최대 2.00 g). 손을 떼면 계량접시에 떨어져요.</div></div>
 <div class="msg" id="wMsg"></div>
 <div class="btnrow" style="margin-top:0"><button class="ghost" onclick="pressZero()">⚖️ 영점</button></div>${S.mode==='strict'?'<p class="tiny" style="margin-top:8px">🎯 목표 질량에 정확히 맞추면 자동으로 다음 단계로 넘어가요.</p>':''}${S.mode==='free'?'<p class="tiny" style="margin-top:8px">👉 다 달았으면 <b>계량접시를 끌어서 비커</b>에 옮겨요. 목표 질량과 다르면 그만큼 결과에 오차로 나타나요.</p>':''}<div style="display:none"></div>`;
}
function updateWeigh(){
 const j=S.job;if(!j||!$('#wRead'))return;
 const r=reading(j);$('#wRead').textContent=(r/100).toFixed(2);
 $('#wSpoonL').textContent=j.spoonMode==='sub'?'작은 쪽으로 덜어내는 양':'큰 쪽에 담긴 양';
 $('#wSpoon').textContent=g2(j.spoon)+' g';
 const ok=r===j.targetCg&&!j.drag;
 let m='';
 if(j.xOn){$('#wMsg').innerHTML=j.drag&&j.drag.k==='dish'?'계량접시를 들어 올렸어요. 저울에서 접시 무게가 빠졌어요!':'';return;}
 if(j.drag&&j.drag.k==='dish')m='계량접시를 들어 올렸어요. 저울에서 접시 무게가 빠졌어요!';
 else if(ok)m=S.mode==='strict'?'<span style="color:#1f9d55">🎯 정확해요!</span>':'<span style="color:#1f9d55">🎯 정확해요! 계량접시를 끌어서 비커로 옮겨요.</span>';
 else if(r>j.targetCg&&j.sample===0)m='저울 값이 벌써 목표보다 커요! 계량접시 무게가 포함된 건 아닐까요? (저울의 영점 버튼)';
 else if(r>j.targetCg)m=`${g2(r-j.targetCg)} g 많아요. 작은 쪽으로 조금 덜어내세요.`;
 else if(j.sample>0)m=`${g2(j.targetCg-r)} g 더 필요해요.`;
 $('#wMsg').innerHTML=m;
}
function weighDone(){const j=S.job;if(reading(j)!==j.targetCg)return;j.readAtWeigh=reading(j);done();toast('이제 계량접시를 끌어서 비커로 옮겨요');}
/* 멈추고 안내 모드: 값을 정확히 맞추면 축하하고 자동으로 다음 단계로 */
function celebrate(title,sub){
 const old=$('#celeb');if(old)old.remove();
 const d=document.createElement('div');d.id='celeb';d.innerHTML=`<div class="cbig">🎉 ${title}</div>${sub?`<div class="csub">${sub}</div>`:''}`;
 (S.fs?$('#fsRoot'):document.body).appendChild(d);setTimeout(()=>d.classList.add('out'),1700);setTimeout(()=>d.remove(),2200);
}
function autoWeigh(){
 const j=S.job;if(!j||S.mode!=='strict'||j.stage!=='lab'||curId()!=='weigh'||j.panel!=='weigh')return;
 if(reading(j)!==j.targetCg||j.drag||j.spoonMode||P)return;
 setTimeout(()=>{if(S.job!==j||curId()!=='weigh'||reading(j)!==j.targetCg||j.drag||j.spoonMode||P||modalOpen())return;
  celebrate(`${g2(j.targetCg)} g 정확히 달았어요!`,'이제 계량접시를 끌어서 비커로 옮겨요');j.readAtWeigh=reading(j);done();if(typeof ev==='function')ev('시료를 정확히 달았어요. 이제 계량접시를 끌어서 비커로 옮겨요');},450);
}

/* 젓기 */
const STIR_MAX=6;
function stirHTML(j){return `<h3>🥢 유리 막대로 젓기</h3>
 <p class="tiny" style="margin-top:0">그림 속 <b>비커 안을 누른 채 좌우로 끌어서</b> 유리 막대로 저어요. 고체가 다 녹을 때까지! 너무 빨리 저으면 경고가 떠요.</p>
 <div class="row2"><span>녹은 정도</span><b id="ptxt">0%</b></div><div class="bar"><i id="pbar"></i></div>
 <div class="row2"><span>젓는 속도</span><b id="spTxt">멈춤</b></div><div class="bar"><i id="spBar" style="background:#33c27a"></i></div>`;}
function updateStir(){
 const j=S.job;if(!j||!$('#spBar'))return;
 $('#pbar').style.width=Math.round(j.dissolve*100)+'%';$('#ptxt').textContent=Math.round(j.dissolve*100)+'%';
 const r=Math.min(1,j.stirSpeed/STIR_MAX);const b=$('#spBar');b.style.width=Math.round(r*100)+'%';
 b.style.background=r<0.6?'#33c27a':r<0.85?'#f0b400':'#d64545';
 $('#spTxt').textContent=!j.stirring?'멈춤':r<0.6?'알맞아요':r<0.85?'조금 빨라요!':'너무 빨라요!';
}
/* 섞기 */
function mixHTML(j){return `<h3>🔄 뒤집어 섞기</h3>
 <ul class="howto"><li>↔️ 부피 플라스크를 누른 채 <b>좌우로 끌면</b> 뒤집혀요.</li><li>↕️ <b>위아래로 끌면</b> 흔들려요.</li><li>👆 <b>눌렀다 떼면</b> 90°씩 돌아가요.</li></ul>
 <div class="row2"><span>섞인 정도</span><b id="mtxt">0%</b></div><div class="bar"><i id="mbar"></i></div>
 <p class="tiny">마개를 손가락으로 꼭 누른 채 천천히! 너무 세게 흔들면 멈춰요.</p>${S.mode==='free'?'<button class="ghost sm" onclick="S.job.panel=null;renderLab()">섞기를 멈추고 다른 작업하기</button>':''}`;}
function updateMix(){const j=S.job;if(!j||!$('#mbar'))return;$('#mbar').style.width=Math.round(j.mixP*100)+'%';$('#mtxt').textContent=Math.round(j.mixP*100)+'%';}

/* 표선 맞추기 */
function markHTML(j){
 return `<h3>🔍 표선 맞추기 (확대)</h3><div class="zoomwrap"><div id="zoom"></div><div id="eyeFig"></div></div>
 <label class="slider">👁 눈높이 조절<input type="range" min="-25" max="25" step="1" value="${j.eye}" id="eyeR"></label>
 <div class="slabels"><span>▲ 아래에서 올려다보기</span><span>위에서 내려다보기 ▼</span></div>
 <button class="hold wash" id="hWash">💧 세척병 꾹 누르기</button>
 <p class="tiny">그림 속 세척병을 꾹 눌러도 돼요. 톡: 한 방울 · 꾹: 점점 빠르게. 메니스커스의 <b>아랫면</b>이 표선에 닿게 맞추세요. ${S.mode==='strict'?'표선을 넘기려 하면 멈춰요.':'표선을 넘기면 그만큼 부피가 늘어 오차가 생겨요!'}</p>
 ${S.mode==='strict'?'<div class="msg" id="mMsg"></div>':''}
 <div class="btnrow" style="margin-top:6px"><button class="ghost sm" ${S.mode==='strict'?'style="flex:1" ':''}onclick="markTip()">❓ 눈높이 맞추는 법</button>${S.mode==='strict'?'':'<button class="primary" style="flex:1" onclick="confirmMark()">표선을 맞췄어요</button>'}</div>`;
}
function markDrop(){
 const j=S.job;if(j.overflow)return false;
 if(S.mode==='strict'&&j.level+1>0){j.overflow=true;stopSqueeze();modal({icon:'✋',title:'표선을 넘게 돼요!',html:'지금 한 방울이라도 더 넣으면 액면이 <b>표선을 넘어요</b>.<br><br>부피 플라스크에서는 넘친 용액을 덜어낼 수 없어서(용질도 함께 빠져나가요) 처음부터 다시 만들어야 해요. 눈높이를 표선과 수평으로 맞추고, 메니스커스 아랫면이 표선에 닿았는지 확인해 보세요.',buttons:[{t:'확인할게요'}]});return false;}
 if(j.level>=40){j.overflow=true;stopSqueeze();modal({icon:'💦',title:'입구까지 가득 찼어요!',html:'더 넣으면 부피 플라스크 밖으로 넘쳐요. 표선을 한참 넘겼어요.'});return false;}
 j.level++;spawnDrop();return true;
}
/* 세척병 누르기(표선) – 패널 버튼과 그림 속 세척병이 같이 사용 */
const SQ={nextAt:0,start(){const j=S.job;j.overflow=false;if(!markDrop())return false;j.squeezing=true;SQ.nextAt=380;updateMark();renderScene();return true;},
 tick(ms){const j=S.job;let c=0;while(ms>=SQ.nextAt&&c<4&&!j.overflow){if(!markDrop())break;SQ.nextAt+=Math.max(45,230-(SQ.nextAt-380)*0.09);c++;}updateMark();renderScene();},
 end(){const j=S.job;if(j){j.squeezing=false;renderScene();autoMark();}}};
function stopSqueeze(){const j=S.job;j.squeezing=false;if(P&&P.mode==='squeeze')P=null;}
function bindMark(){
 const j=S.job;
 $('#eyeR').addEventListener('input',e=>{j.eye=+e.target.value;updateMark();});
 bindHold($('#hWash'),{start:SQ.start,tick:SQ.tick,end:SQ.end});
}
function updateMark(){
 const j=S.job;if(!j||!$('#zoom'))return;
 $('#zoom').querySelectorAll('svg').forEach(s=>s.remove());
 $('#zoom').insertAdjacentHTML('afterbegin',zoomSVG(j));
 $('#eyeFig').innerHTML=eyeFigSVG(j.eye);
 autoMark();
}
function autoMark(){
 const j=S.job;if(!j||S.mode!=='strict'||curId()!=='mark'||j.panel!=='mark')return;
 const m=$('#mMsg');

 if(j.V1u%10&&s!==1){modal({icon:'🧪',title:'눈금이 너무 굵어요',html:`${s} mL 피펫은 0.1 mL 단위로만 잴 수 있어요. ${(j.V1u/100).toFixed(2)} mL처럼 0.01 mL까지 맞추려면 <b>1 mL 피펫</b>을 골라요.`});return;}

function rinsePip(){
 const j=S.job;
 if(j.pip>0){j.bStock=Math.max(0,j.bStock-j.pip/100);j.pip=0;}/* 빨아들인 원액은 공세척에 쓰고 버려요 */
 if(j.pipNoRinse&&!j.transferred){j.pipNoRinse=false;j.eff=j.eff.filter(e=>!e.text.startsWith('피펫을 공세척하지 않아'));}
 j.pipRinsed=true;renderPanel();renderScene();updatePip();
 modal({icon:'🚿',title:'공세척 완료! 왜 공세척을 할까요?',html:`원액을 조금 빨아들여 피펫 안쪽을 헹구고 버렸어요.<ul><li>깨끗이 씻은 피펫 안에는 <b>물방울</b>이 남아 있어요.</li><li>그대로 원액을 뽑으면 물방울과 섞여 <b>원액이 묽어지고</b>, 같은 부피를 옮겨도 <b>용질이 덜 들어가요</b>.</li><li>그러면 만든 용액의 농도가 목표보다 <b>낮아져요</b>.</li></ul>💡 피펫은 공세척하지만, <b>부피 플라스크는 공세척하지 않아요.</b> 원액으로 헹구면 용질이 더 들어가 농도가 높아지거든요.`,buttons:[{t:'알겠어요'}]});
}
function bindPip(){
 const j=S.job;if(!j.pipSize)return;
 const inc=j.pipSize===1?1:10,capP=j.pipSize*100,max=Math.max(inc,Math.round(capP*0.5/inc)*inc);
 let base=0,full=false;
 bindHold($('#hDraw'),{start(){
   if(!j.pipRinsed&&j.pip===0){
    if(S.mode==='strict'){modal({icon:'🚿',title:'공세척을 먼저 해요',html:'피펫 안에 남은 물방울이 원액을 묽게 만들 수 있어요. 옮길 원액으로 피펫 안쪽을 한두 번 헹군 다음(<b>공세척</b>) 사용해요.'});return false;}
    if(!j.pipNoRinse){j.pipNoRinse=true;addEff('피펫을 공세척하지 않아 남아 있던 물이 원액을 묽힘 (−1.5%)',0.985);}
   }
   const cap=Math.min(capP,Math.floor(j.bStock*100/inc)*inc);if(j.pip>=cap){toast(cap<capP?'비커에 덜어 둔 원액이 더 없어요':'피펫이 가득 찼어요');return false;}base=j.pip;full=false;j.pip=Math.min(cap,base+inc);updatePip();renderScene();
  },tick(ms){const cap=Math.min(capP,Math.floor(j.bStock*100/inc)*inc);let v=base+holdAmount(ms,inc,max);if(v>=cap){v=cap;if(!full){full=true;toast(cap<capP?'비커에 덜어 둔 원액을 다 빨아들였어요':'피펫 끝까지 찼어요! 필러로 빨려 들어가지 않게 조심!');}}j.pip=v;updatePip();renderScene();},
  end(){}});
 bindHold($('#hOut'),{start(){if(j.pip<=0)return false;base=j.pip;j.pip=Math.max(0,base-inc);updatePip();renderScene();},tick(ms){j.pip=Math.max(0,base-holdAmount(ms,inc,max));updatePip();renderScene();}});
}
function updatePip(){
 const j=S.job;if(!j||!$('#pRead'))return;
 $('#pRead').textContent=pipFmt(j.pip,j.pipSize);
 const ok=j.pip===j.V1u;
 const d=j.pip-j.V1u;
 $('#pMsg').innerHTML=ok?'<span style="color:#1f9d55">🎯 정확해요! 피펫을 끌어서 부피 플라스크에 넣어요.</span>':j.pip===0?'':d>0?`${pipFmt(d,j.pipSize)} mL 많아요. 조금 내보내세요.`:`${pipFmt(-d,j.pipSize)} mL 더 빨아들여요.`;
}
function pipDone(){
 const j=S.job;if(!(j.pip>0))return;
 if(j.transferred){const add=j.pip;j.pipT+=add;j.bStock=Math.max(0,j.bStock-add/100);j.pip=0;j.fVol=j.fVol;j.panel=null;
  j.log.push({t:`피펫으로 원액 ${pipFmt(add,j.pipSize)} mL를 더 넣었어요 (모두 ${pipFmt(j.pipT,5)} mL)`,k:'ok'});renderLab();toast(`원액을 ${pipFmt(add,j.pipSize)} mL 더 넣었어요`);return;}
 if(S.mode==='strict'&&j.pip!==j.V1u)return;
 j.pipT=j.pip;j.bStock=Math.max(0,j.bStock-j.pip/100);j.pip=0;j.fVol=j.pipT/100;j.transferred=true;
 done();if(S.mode==='free'){const L0=j.log.filter(l=>l.k==='ok').pop();if(L0)L0.t=`피펫으로 원액 ${pipFmt(j.pipT,j.pipSize)} mL를 부피 플라스크에 옮겼어요`;renderPanel();}toast('원액을 부피 플라스크에 넣었어요. 피펫은 비었어요.');
}

 if(j.level!==null)return -170-j.level*0.9;

  if(!k)return;

 if(P.mode==='spoon'){j.spoon=P.k==='spBig'?holdAmount(ms,1,200):Math.min(holdAmount(ms,1,200),j.xOn?j.xs:j.sample);updateWeigh();renderScene();}

function lateRinseOK(j){return j.kind==='prep'&&j.poured&&!(j.pourLeft>0.002&&j.bWater>0.05)&&(j.rinses||0)<2&&!j.fillDone&&(curId()!=='rinse'||!j.bAnchor);}
function lateFunnelOK(j){return j.kind==='prep'&&j.funnelDirty&&!j.funnelRinsed&&!j.fillDone;}
function canDrag(k){
 const j=S.job;
 if(k==='dish'){if(j.xOn){if(!(j.xs>0)){toast('계량접시에 아직 시료가 없어요');return false;}return true;}if(!j.dishOn||j.moved)return false;if(!(j.sample>0)){toast('계량접시에 아직 시료가 없어요');return false;}return true;}
 if(['water','wash','funnel'].includes(k))return !!j.placed[k];
 if(k==='rod')return (j.rodAt==='beaker'||j.rodAt==='flask'||j.rodAt==='away')&&j.panel!=='stir';
 if(k==='beaker')return j.kind==='prep'&&j.moved&&(!j.poured||j.bAnchor||lateRinseOK(j)||(j.pourLeft>0.002&&j.bWater>0.05&&!j.fillDone));
 if(k==='flask')return j.panel!=='mix'&&!j.fEmpty&&j.fVol>0;
 if(k==='stock')return j.kind==='dil';
 if(k==='pip'){if(j.panel!=='pipette')return false;if(!(j.pip>0)){toast('먼저 피펫으로 원액을 빨아들여요');return false;}return true;}
 return false;
}

 else if(k==='beaker'){j.wasAnchored=j.bAnchor;if(j.bAnchor){j.bAnchor=false;j.pouring=false;ref=[pt.x-b.w*0.5,pt.y-20];}else ref=[b.x,BENCH-b.H];}

function beakerDragCheck(){

 const d=Math.hypot(lip[0]-tgt[0],lip[1]-tgt[1]);

  if(d<48&&j.kind==='prep'&&j.pourLeft>0.002&&j.bWater>0.05&&!j.fillDone){ /* 남은 용액 마저 붓기 */
   j.poured=false;j.resume=true;j.pourB=0;j.bAnchor=true;j.drag=null;P.mode='pourHold';j.pouring=true;P.hx=null;renderLab();return;}
  if(d<48&&lateRinseOK(j)){j.bAnchor=true;j.pourB=1;j.pouring=false;j.bWater=0;j.drag=null;P.mode='none';j.lateAnchor=true;renderLab();toast('세척병을 끌어와 비커와 유리 막대를 헹궈요');}

 if(j.resume){if(d<48){j.bAnchor=true;j.drag=null;P.mode='pourHold';j.pouring=true;P.hx=null;renderLab();}return;}

/* 라벨 농도 검사: 만든 용액과 다르면 붙일 수 없어요 */
function checkLabelConc(c,target,after){
 const pc=parseConc(c);
 let why='';
 if(!(pc.val>0))why='라벨에 몰농도가 적혀 있지 않아요.';
 else if(pc.unit==='none')why=`농도의 <b>단위</b>가 없어요. “${esc(c)}”만으로는 무슨 농도인지 알 수 없어요.`;
 else if(pc.unit==='bad'&&pc.rest.replace(/\s+/g,'')==='m')why='소문자 <b>m</b>은 몰랄 농도의 기호예요. 몰농도는 <b>대문자 M</b>(또는 mol/L)으로 써요.';
 else if(pc.unit==='bad'&&/^(M|mol\/L)\s+\S/i.test(pc.rest))why=`농도 칸에는 <b>숫자와 단위만</b> 써요. “${esc(pc.rest.replace(/^(M|mol\/L)\s+/i,''))}” 같은 물질 이름은 ‘물질’ 칸에 적어요.`;
 else if(pc.unit==='bad')why=/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(pc.rest)?`단위 자리에 한글 “${esc(pc.rest)}”가 들어갔어요. <b>한/영 키</b>를 눌러 영어로 바꾼 다음 <b>M</b>을 써요.`:`“${esc(pc.rest)}”는 몰농도의 단위가 아니에요. (M 또는 mol/L)`;
 else if(Math.abs(pc.val-target)/target>0.005)why=`라벨에 쓴 <b>${esc(c)}</b>는 이 용액의 몰농도가 아니에요. 어떤 농도로 만들었는지 다시 확인해 보세요.`;
 if(!why)return true;
 modal({icon:'🏷️',title:'용액의 정보를 정확히 써 주세요',html:`${why}<br><br>라벨이 틀리면 다른 사람이 이 용액을 잘못 쓰게 돼요. 시약병의 라벨에는 <b>물질 이름, 몰농도(숫자와 단위), 날짜, 만든 사람</b>을 정확히 적어야 해요.`,buttons:[{t:'다시 쓸게요',fn:after}]});
 return false;
}
function stars(ae){return ae<=0.5?3:ae<=2?2:ae<=5?1:0;}
/* 오차 반영 모드는 더 엄격하게: 기준 오차가 작고, 실수 개수만큼 별 상한이 내려가요 */
function calcNotes(j){
 const out=[];if(!j.calc||!j.calc.freeMode)return out;
 const st=calcSteps(j),names=j.kind==='prep'?['부피 변환','몰수','질량']:['몰수','원액 부피'];
 st.forEach((q,i)=>{const v=j.calc.vals[i];const ok=q.tol.rel!=null?Math.abs(v-q.ans)<=Math.abs(q.ans)*q.tol.rel:Math.abs(v-q.ans)<=q.tol.abs+1e-12;
  if(!ok)out.push(`🧮 계산 ${i+1}번(${names[i]}) 오답: 내 답 ${j.calc.free[i]} ${q.unit} → 정답 ${+q.ans.toPrecision(4)} ${q.unit}`);});
 if(j.kind==='prep'&&j.targetCg!==j.trueCg)out.push(`🧮 계산한 질량 ${g2(j.targetCg)} g으로 실험했어요 (정확한 값 ${g2(j.trueCg)} g) → 계산 실수가 농도 오차로 이어졌어요`);
 if(j.kind==='dil'&&j.V1u!==j.trueV1u)out.push(`🧮 계산한 원액 부피 ${pipFmt(j.V1u,5)} mL로 실험했어요 (정확한 값 ${pipFmt(j.trueV1u,5)} mL) → 계산 실수가 농도 오차로 이어졌어요`);
 if(j.kind==='dil'&&j.pipT&&j.pipT!==j.V1u)out.push(`피펫으로 ${pipFmt(j.pipT,j.pipSize||5)} mL를 옮겼어요 (계산한 양 ${pipFmt(j.V1u,j.pipSize||5)} mL)`);

function countMistakes(j){let n=j.eff.length+calcNotes(j).length;if(j.kind==='prep'&&j.readAtWeigh!=null&&j.readAtWeigh!==j.sample)n++;if(j.kind==='prep'&&j.sample!==j.targetCg)n++;if(j.level>0)n++;if(Math.abs(j.eyeAtMark)>2)n++;if(j.flask!==(j.kind==='prep'?j.m.V:j.m.V2))n++;return n;}
function judgeStars(j,errProc,mode){
 const ae=Math.abs(errProc),need0=j.kind==='prep'?j.m.V:j.m.V2,vb0=j.flask!==need0;
 if(mode!=='free'){const st=stars(ae);return {st:vb0?Math.min(st,1):st,mistakes:0,cap:vb0?1:3,volBad:vb0};}
 let st=ae<=0.2?3:ae<=5?2:ae<=10?1:0;
 let mk=countMistakes(j),cap=mk===0?3:mk<=2?2:mk<=4?1:0,h=j.hintsUsed||0;
 /* 요구한 부피와 다른 부피 플라스크로 만들면: 농도가 맞아도 미션 조건을 못 지킨 것 → 별 최대 1개 */

 if(amt>0)ev(`약숟가락으로 ${g2(amt)} g을 ${mode==='add'?'넣었어요':'덜어냈어요'}. 저울: ${g2(reading(j))} g`);};}
function statLine(j){
 if(!j)return '';
 if(j.stage==='label')return '🏷️ 시약병에 붙일 라벨을 써요';
 if(j.panel==='weigh')return `⚖️ 저울 ${g2(reading(j))} g · 목표 ${g2(j.targetCg)} g`;
 if(j.panel==='stir'){const r=Math.min(1,(j.stirSpeed||0)/STIR_MAX);return `🥢 녹은 정도 ${Math.round(j.dissolve*100)}% · 젓는 속도: ${!j.stirring?'멈춤':r<0.6?'알맞아요':r<0.85?'조금 빨라요!':'너무 빨라요!'}`;}
 if(j.bAnchor&&curId()==='pour')return `🫗 붓는 중 ${Math.round(j.pourB*100)}%`;
 if(j.panel==='mark')return '💧 확대 창을 보며 세척병으로 표선을 맞춰요';
 if(j.panel==='mix')return `🔄 섞인 정도 ${Math.round(j.mixP*100)}%`;
 if(j.panel==='pipette')return `🧪 피펫 ${pipFmt(j.pip,j.pipSize||5)} mL · 옮길 부피 ${pipFmt(j.V1u,j.pipSize||5)} mL`;
 const l=j.log[j.log.length-1];return l?'✅ '+l.t:'🧰 실험 도구를 눌러 시작해요';
}
function updStat(){
 const j=S.job,on=!!(j&&(j.stage==='lab'||j.stage==='label'));
 const msg=S.evMsg||'',line=on?statLine(j):'';
 const a=$('#msMsg'),b=$('#msLine');if(a){a.textContent=msg;b.textContent=line;}
 const c=$('#fsChip');if(c)c.innerHTML=(msg?`<b>${esc(msg)}</b><br>`:'')+esc(line);
}
{const r0=renderScene;renderScene=function(){r0();updStat();};}
{const p0=renderPanel;renderPanel=function(){p0();updStat();fsAuto();};}
{const r1=render;render=function(){r1();const j=S.job,inLab=!!(j&&(j.stage==='lab'||j.stage==='label')&&S.tab===(j.kind==='prep'?'prep':'dil'));
 document.body.classList.toggle('inlab',inLab);if(!inLab)S.evMsg='';
 if(S.fs){if(inLab)fsAttach();else fsExit();}updStat();};}
function scrollToPanel(){const p=$('#panel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'});}

/* 가로 전체 화면 */
function fsSize(){const r=$('#fsRoot');r.style.setProperty('--W',window.innerWidth+'px');r.style.setProperty('--H',window.innerHeight+'px');
 r.classList.toggle('rot',S.fs&&window.innerHeight>window.innerWidth);}
async function fsEnter(){
 const j=S.job;if(!j||(j.stage!=='lab'&&j.stage!=='label'))return;
 const r=$('#fsRoot');S.fs=true;S.fsTools=false;S.fsSheet=false;S.fsLastKey='';
 r.classList.add('on');document.body.classList.add('fsmode');
 r.appendChild($('#modal'));r.appendChild($('#toast'));
 const de=document.documentElement;try{if(de.requestFullscreen&&!document.fullscreenElement)await de.requestFullscreen({navigationUI:'hide'});}catch(e){}
 try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
 fsSize();setTimeout(fsSize,350);fsAttach();
}
function fsAttach(){
 const v=document.querySelector('.view.on');if(!v)return;
 const sc=v.querySelector('#scene'),tb=v.querySelector('#toolbar'),pn=v.querySelector('#panel'),lg=v.querySelector('#log');
 if(sc)$('#fsScene').replaceChildren(sc);
 if(tb)$('#fsTools').replaceChildren(tb);
 if(pn){const body=$('#fsSheetBody');body.replaceChildren(pn);if(lg)body.appendChild(lg.closest('.card'));body.appendChild(fsHead());}
 S.fsLastKey='';fsApply();renderScene();fsAuto();
}
function fsHead(){
 const j=S.job,s=SUBS[j.m.sub],d=document.createElement('div');d.className='card fshead';
 d.innerHTML=`<div class="kicker">${j.kind==='prep'?'용액 만들기':'희석하기'} 미션${j.m.fromShelf?' · 내가 만든 원액':''}</div><b class="fstitle">${missionTitle(j)}</b>
 <div class="fschips"><span class="chip">${s.name}</span>${j.kind==='prep'?`<span class="chip">몰질량 ${s.M.toFixed(2)} g/mol</span>`:''}${s.caution?`<button type="button" class="chip warn" onclick="cautionPopup('${j.m.sub}')">⚠️ 주의사항</button>`:''}</div>
 <div class="btnrow">${'<button class="ghost sm" onclick="resetStage(\'lab\')">🔄 실험 다시 하기</button>'}<button class="ghost sm" onclick="quitJob()">미션 나가기</button></div>`;
 return d;
}
function fsApply(){const r=$('#fsRoot');r.classList.toggle('sheet',S.fsSheet);r.classList.toggle('tools',S.fsTools);$('#fsSheetBtn').classList.toggle('on',S.fsSheet);}
function fsToggleSheet(){S.fsSheet=!S.fsSheet;fsApply();}
function fsToggleTools(){S.fsTools=!S.fsTools;fsApply();}
function fsAuto(){
 if(!S.fs||!S.job)return;const j=S.job;
 const key=j.stage==='label'?'label':(['weigh','mark','pipette'].includes(j.panel)?j.panel:'');
 if(key&&key!==S.fsLastKey){S.fsSheet=true;S.fsTools=false;fsApply();const sh=$('#fsSheet');if(sh)sh.scrollTop=0;}
 else if(!key&&S.fsLastKey){S.fsSheet=false;fsApply();}
 S.fsLastKey=key;
}
function fsExit(){
 if(!S.fs)return;S.fs=false;
 const r=$('#fsRoot');r.classList.remove('on','rot','sheet','tools');document.body.classList.remove('fsmode');
 document.body.appendChild($('#modal'));document.body.appendChild($('#toast'));
 try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
 try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
 $('#fsScene').replaceChildren();$('#fsTools').replaceChildren();$('#fsSheetBody').replaceChildren();
 render();
}
{const r=$('#fsRoot');r.addEventListener('scroll',()=>{if(r.scrollLeft||r.scrollTop){r.scrollLeft=0;r.scrollTop=0;}});}
/* 세로 폰을 돌려 쓰는 중에 글자를 입력하면 키보드 방향이 어긋나서, 잠깐 전체 화면을 나가 입력해요 */
document.addEventListener('focusin',e=>{
 const t=e.target;if(!S.fs||!$('#fsRoot').classList.contains('rot')||!t.matches||!t.matches('#fsRoot input:not([type=range]):not([type=checkbox]),#fsRoot textarea'))return;
 const id=t.id;fsExit();toast('글자를 입력할 수 있게 전체 화면을 잠시 나왔어요');
 setTimeout(()=>{const n=id&&document.getElementById(id);if(n){n.scrollIntoView({block:'center'});n.focus();}},60);
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S.fs)fsExit();});
window.addEventListener('resize',()=>{if(S.fs){fsSize();renderScene();}});
/* 툴바 도구를 누르면 서랍은 접어요 */


drawAvatar();
render();
