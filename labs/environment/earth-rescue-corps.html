<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구구조단 · V-Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Color+Emoji&display=swap">
<style>
/* (원본 머리에 있던 기본값) */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}
/* Layout: one soft "sticker book" column (max 980px); screens swap inside it. Home is an illustrated office whose objects are the menu. Cute pastel look, single theme by choice. */
:root{
  --ink:#4a3f6b; --muted:#857aa3; --bg:#eef7f3; --dot:#dcefe6; --card:#fffdf8; --soft:#f6f1ff;
  --mint:#c8f0dc; --mint-d:#5cc08f; --pink:#ffd3e0; --butter:#fff0b8; --sky:#d3ecff; --lav:#e6defe; --peach:#ffe0cc; --coral:#ff9aa8;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{word-break:keep-all;overflow-wrap:break-word;line-break:strict;background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.2px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:1.85rem} h2{font-size:1.45rem} h3{font-size:1.12rem}
b{font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
.emo{font-family:var(--emoji);display:inline-block;line-height:1;vertical-align:middle;font-style:normal}
span.i1{font-size:1.15em}span.i2{font-size:1.8em}span.i3{font-size:2.5em}span.i4{font-size:3.4em}
img.i2{width:2.2em;height:auto}img.i3{width:3em;height:auto}img.i4{width:4.6em;height:auto}
.bub{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,var(--b,var(--lav)) 75%);border:2.5px solid var(--ink);flex:none}
span.i3.bub{width:1.55em;height:1.55em;font-size:2.4em}
span.i4.bub{width:1.6em;height:1.6em;font-size:3.2em}
.bub>.in{font-size:.8em;line-height:1}
.px{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 rgba(74,63,107,.13);padding:16px}
.btn{background:var(--card);color:var(--ink);padding:9px 16px;font-family:var(--display);font-size:1.02rem;line-height:1.3;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--mint)}.btn.primary:hover{background:#b6ead0}
.btn.warn{background:var(--butter)}
.btn.pink{background:var(--pink)}
.btn.small{font-size:.9rem;padding:5px 11px;border-radius:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.label{font-size:.8rem;letter-spacing:.05em;font-weight:700;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 9px;background:var(--soft);border:2px solid var(--ink);border-radius:99px;margin:2px}
.tag.p{background:var(--butter)}.tag.s{background:var(--mint)}.tag.g{background:var(--sky)}
.stars{letter-spacing:2px;color:#f5b82e}
.stars .off{color:#ddd5ea}
.stack{display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px}
.top .who{display:flex;align-items:center;gap:8px;min-width:0}
.top .nm{font-family:var(--display);font-size:1.1rem;line-height:1.15}
.top .rk{font-size:.8rem;color:var(--muted)}
.gauge{flex:1;min-width:150px}
.gauge .bar{height:14px;background:#f1eaf7;border:2px solid var(--ink);border-radius:99px;overflow:hidden;display:flex}
.gauge .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd27a,#8fe0b4);border-radius:99px;transition:width .6s}
.gauge .lbl{font-size:.8rem;display:flex;justify-content:space-between;color:var(--muted)}

/* create */
.create{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.create>*{min-width:0}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.av{display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.av img{width:100%;max-width:90px;height:auto}
.av[aria-pressed="true"]{background:var(--mint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:4px 13px;background:var(--card);border:2px solid var(--ink);border-radius:99px;margin:2px;font-size:.92rem}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--butter)}
input[type=text],textarea{font:inherit;width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:9px 12px;background:#fff;color:var(--ink)}
.idcard{padding:0;overflow:hidden}
.idcard .hd{background:var(--lav);padding:8px 16px;font-family:var(--display);display:flex;justify-content:space-between;border-bottom:2.5px solid var(--ink)}
.idcard .bd{display:flex;gap:14px;padding:16px}
.idcard .ph{width:96px;height:110px;flex:none;background:var(--sky);border:2.5px solid var(--ink);border-radius:16px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.idcard .ph img{width:90%}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.92rem}
.idcard dt{color:var(--muted)} .idcard dd{margin:0;font-weight:700}

/* office */
.room{position:relative;width:100%;border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 rgba(74,63,107,.13);container-type:inline-size;overflow:hidden}
.room canvas{display:block;width:100%;height:auto}
.hot .bd{position:absolute;top:-8px;right:-8px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:.72rem;padding:0 6px;font-weight:700;animation:bob 1s ease-in-out infinite}
.hot.new{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{background:rgba(255,240,184,.5)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.pet{position:absolute;bottom:3%;animation:walk var(--d,14s) ease-in-out infinite alternate;font-size:4.6cqw}
.pet .emo{animation:hop .6s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(0)}48%{transform:translateX(var(--x,12cqw))}52%{transform:translateX(var(--x,12cqw)) scaleX(-1)}100%{transform:translateX(0) scaleX(-1)}}
@keyframes hop{50%{transform:translateY(-12%)}}
.speech{display:flex;gap:10px;align-items:center;padding:10px 14px}
.ladder{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ladder span{font-size:.8rem;padding:1px 9px;background:var(--soft);border:2px solid var(--ink);border-radius:99px;margin:2px}
.ladder span.on{background:var(--mint)} .ladder span.now{background:var(--butter)}
.hintline{font-size:.86rem;color:var(--muted);text-align:center}

/* letter */
.letter{background:#fffdf6;padding:26px 22px 22px;position:relative;line-height:30px;max-width:680px;margin:0 auto;width:100%;border:2.5px solid var(--ink);border-radius:18px;
  background-image:repeating-linear-gradient(transparent 0 29px,#efe6d0 29px 30px);background-position:0 20px;box-shadow:6px 7px 0 rgba(74,63,107,.12)}
.letter .stamp{position:relative;float:right;margin:0 0 8px 12px;width:74px;height:86px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;transform:rotate(4deg);border:2.5px dashed var(--coral);border-radius:10px}
.letter .stamp small{font-size:.62rem;color:#d45b6e;font-weight:700;text-align:center}
.letter .to{font-family:var(--display);font-size:1.12rem;padding-right:86px}
.letter .body{white-space:pre-line}
.letter .sign{text-align:right;font-family:var(--display)}

/* map */
.mapbox{position:relative;border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 rgba(74,63,107,.13);container-type:inline-size;overflow:hidden}
.mapbox canvas{display:block;width:100%;height:auto}
.isl{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;border-radius:50%}
.isl{-webkit-tap-highlight-color:transparent;outline:none}.isl:hover,.isl:focus-visible{outline:none;background:radial-gradient(circle,rgba(255,255,255,.55) 0 48%,rgba(255,255,255,0) 66%)}.isl:focus{outline:none}
.isl .lb{background:var(--card);border:2px solid var(--ink);border-radius:99px;font-family:var(--display);font-size:clamp(.62rem,1.9cqw,1rem);padding:0 8px;transform:translateY(75%);white-space:nowrap}
.heli{position:absolute;transform:translate(-50%,-80%);transition:left 1.1s ease-in-out,top 1.1s ease-in-out;pointer-events:none;font-size:6cqw}
.heli .emo{animation:hop .3s ease-in-out infinite}

/* island */
.ihero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ihero>div{min-width:0;flex:1}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mcard{text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard:hover{background:#fff}
.mcard.done{background:#f0fbf5}
.mcard .t{font-family:var(--display);font-size:1.12rem;line-height:1.35}
.kind{display:inline-block;font-size:.76rem;padding:0 8px;background:var(--lav);border:2px solid var(--ink);border-radius:99px;margin:2px}

/* brief */
.gear{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gear>div{padding:12px;background:var(--soft);border:2px solid var(--ink);border-radius:16px;min-width:0;display:flex;flex-direction:column;gap:4px}
.gear b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.gear p{font-size:.88rem;color:var(--muted);line-height:1.55}
.fact{background:var(--soft);padding:10px 14px;border:2px solid var(--ink);border-left:8px solid #b8a8f0;border-radius:14px}

/* play common */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gamehead{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:space-between;font-size:.93rem;margin-bottom:10px;align-items:center}
.gamehead b{font-family:var(--display);font-weight:400;font-size:1.2rem;font-variant-numeric:tabular-nums}
.hint{font-size:.88rem;color:var(--muted);margin-top:10px}
.fb{margin-top:12px;padding:10px 14px;border:2px solid var(--ink);border-radius:14px}
.fb.ok{background:#e1f7ea}.fb.no{background:#ffe4e6}
.hud{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;font-size:.9rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.hud>span{background:var(--soft);border:2px solid var(--ink);border-radius:99px;padding:1px 10px}
.plot .soil{display:block;width:3.2rem;height:2.9rem;background:radial-gradient(ellipse at 50% 30%,#a9806a 0 38%,transparent 40%),linear-gradient(transparent 30%,#f4b6a4 30%);clip-path:polygon(4% 30%,96% 30%,82% 100%,18% 100%);border-radius:0 0 10px 10px}
.toast{min-height:1.6em;text-align:center;font-weight:700;margin-top:8px}
.cover{position:absolute;inset:0;background:rgba(74,63,107,.78);color:#fff;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:18px;border-radius:inherit}

/* field */
.fieldwrap{position:relative;max-width:760px;margin:0 auto;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.fieldwrap canvas{display:block;width:100%;height:auto}
.radar{max-width:760px;margin:0 auto 10px;display:flex;align-items:center;gap:8px;font-size:.88rem}
.radar .rb{flex:1;height:14px;background:#f1eaf7;border:2px solid var(--ink);border-radius:99px;overflow:hidden;display:flex}
.radar .rb i{display:block;height:100%;background:linear-gradient(90deg,#ffc2d1,#ff8aa3);transition:width .2s}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:760px;margin:12px auto 0}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad .btn{padding:0;font-size:1.2rem;touch-action:none;border-radius:14px}
.actbtn{min-width:150px;min-height:64px;font-size:1.05rem;background:var(--butter);touch-action:none}
.quiz .opts,.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;padding:9px 12px;background:#fff;border:2px solid var(--ink);border-radius:12px}
.opt:hover{background:var(--soft)}
.opt.right{background:#c9f0d9}.opt.wrong{background:#ffd3d8}.opt.gone{opacity:.25}
.npchead{display:flex;gap:12px;align-items:center}

/* scan */
.scangrid{display:grid;gap:5px;padding:9px;max-width:600px;margin:0 auto;border:2.5px solid var(--ink);border-radius:18px}
.scangrid.city{background:#d9d5e6}.scangrid.ice{background:#dcf0fb}
.cell{aspect-ratio:1;background:rgba(255,255,255,.65);border:2px solid rgba(74,63,107,.3);border-radius:10px;font-family:var(--display);font-size:clamp(.9rem,2.8vw,1.3rem);display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.cell:hover:not(:disabled){background:#fff}
.cell.h1{background:#ffa3a3}.cell.h2{background:#ffc9a3}.cell.h3{background:#ffeaa3}.cell.h4{background:#d8f3c6}.cell.h5{background:#d3ecff}
.cell.hit{background:#fff}
/* balance */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bal>*{min-width:0}
.meters,.levers{display:flex;flex-direction:column;gap:12px}
.meter .mh,.lever label{display:flex;justify-content:space-between;font-size:.93rem;gap:8px}
.meter .mh b,.lever label b{font-variant-numeric:tabular-nums}
.meter .track{position:relative;height:16px;background:#ffe4e6;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:#c9f0d9}
.meter .needle{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px;transition:left .25s}
.meter.ok .mh b{color:#2f8f60}.meter.bad .mh b{color:#d14f63}
input[type=range]{width:100%;accent-color:#5cc08f;height:28px}
/* sort */
.sortitem{padding:16px;text-align:center;background:#fff;border:2.5px solid var(--ink);border-radius:18px;font-family:var(--display);font-size:1.2rem}
.bins{display:grid;gap:10px;margin-top:12px}
.bin{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.98rem;padding:10px 6px}
.belt{position:relative;height:118px;background:repeating-linear-gradient(90deg,#e3def0 0 20px,#d8d2e8 20px 22px);border:2.5px solid var(--ink);border-radius:18px;overflow:hidden}
.belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#b1a6d1 0 10px,#cfc6ea 10px 20px)}
.belt .it{position:absolute;top:10px;width:150px;margin-left:-75px;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 6px;font-size:.86rem;font-weight:700;line-height:1.3}
.belt .robot{position:absolute;right:12px;top:6px;font-size:2rem}
.belt .end{position:absolute;right:0;top:0;bottom:12px;width:8px;background:repeating-linear-gradient(var(--coral) 0 8px,#fff 8px 16px)}
/* catch / chase */
.catchwrap{position:relative;max-width:420px;margin:0 auto;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none}
.catchwrap canvas{display:block;width:100%;height:auto}
.ctrl2{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:10px}
.ctrl2 .btn{font-size:1.2rem;padding:8px 24px;touch-action:none}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:4/3;background:var(--lav);font-size:.86rem;line-height:1.35;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.card.up{background:#fff}.card.up.a{background:var(--butter);font-weight:700}.card.match{background:var(--mint)}
.card .q{font-family:var(--display);font-size:1.6rem}
/* heat */
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:9px;max-width:560px;margin:0 auto;background:#a9a3bf;border:2.5px solid var(--ink);border-radius:18px}
.hc{aspect-ratio:1;border:2px solid rgba(74,63,107,.35);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1;gap:2px}
.hc .emo{font-size:clamp(1rem,3.4vw,1.5rem)}
.hc .tp{font-size:clamp(.62rem,2vw,.8rem);font-weight:700;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{padding:6px 11px;background:#fff;border:2px solid var(--ink);border-radius:14px;text-align:left;font-size:.86rem;line-height:1.4}
.tool[aria-pressed="true"]{background:var(--butter)}
/* farm */
.farm{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:0 auto}
.plot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:linear-gradient(#fffdf8 0 55%,#f3d9bf 55%);border:2.5px solid var(--ink);border-radius:18px;position:relative;min-width:0}
.plot .emo{font-size:2.6rem}
.plot.pest{box-shadow:0 0 0 4px var(--coral)}
.plot.ready{box-shadow:0 0 0 4px #ffd27a}
.plot .bug{position:absolute;top:6px;right:8px;font-size:1.5rem;animation:hop .5s infinite}
.plot .st{font-size:.8rem;font-weight:700;text-align:center;min-height:1.3em}
.mbar{width:100%;height:10px;border:2px solid var(--ink);border-radius:99px;background:#ffe4e6;position:relative;overflow:hidden}
.mbar .z{position:absolute;left:30%;width:55%;top:0;bottom:0;background:#c9f0d9}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:#8cc8ff;opacity:.85}
.gbar{width:100%;height:6px;border-radius:99px;background:#eee;overflow:hidden}
.gbar i{display:block;height:100%;background:#8fe0b4}
/* dig */
.digwrap{display:grid;grid-template-columns:auto 1fr;gap:6px;max-width:640px;margin:0 auto;align-items:stretch}
.layers{display:grid;gap:4px}
.layers span{display:flex;align-items:center;justify-content:flex-end;font-size:.76rem;font-weight:700;padding-right:4px;white-space:nowrap}
.dig{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.dc{aspect-ratio:1;border:2px solid rgba(74,63,107,.35);border-radius:9px;padding:0;display:flex;align-items:center;justify-content:center;font-size:clamp(.9rem,3vw,1.4rem);position:relative}
.dc.open{background:#fffaf0!important;border-style:dashed}
.dc.near::after{content:"";position:absolute;inset:3px;border-radius:7px;box-shadow:0 0 0 2px #ffd27a inset}
.dc.lock{opacity:.85}
/* battle */
.arena{position:relative;height:300px;border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;background:linear-gradient(#e2f2ff 0 52%,#dcf5e3 52%)}
.arena::before,.arena::after{content:"";position:absolute;border-radius:50%;background:#c4ebcf;border:2px solid rgba(74,63,107,.2)}
.arena::before{right:5%;top:40%;width:34%;height:14%}
.arena::after{left:4%;bottom:6%;width:36%;height:14%}
.foe{position:absolute;right:9%;top:6%;width:28%;max-width:150px;z-index:1;transition:opacity .6s}
.foe svg{width:100%;height:auto;display:block;animation:hop 1.4s ease-in-out infinite}
.me{position:absolute;left:8%;bottom:9%;display:flex;align-items:flex-end;gap:4px;z-index:1}
.me img{width:86px;height:auto}
.binfo{position:absolute;z-index:2;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px;min-width:44%;max-width:56%}

function modal(html,actions=[{t:'확인',c:'primary'}],opt={}){

function heroLife(pets){
  const h=$('#hero'),th=$('#think');if(!h)return;
  const acts=[
    {x:58,y:60,e:'📖',t:'공부 중'},
    {x:118,y:62,e:'🔬',t:'연구 중'},
    {x:14,y:60,e:'🔭',t:'하늘 관찰'},
    {x:78,y:66,e:'💻',t:'자료 분석'},
    {x:30,y:62,e:'☕',t:'잠깐 휴식'}];
  if(pets.length)acts.push({x:70,y:72,e:'🍪',t:'펫 돌보기',pet:1},{x:96,y:72,e:'🧸',t:'펫과 놀기',pet:1});
  if(S.promoted>=3)acts.push({x:100,y:62,e:'📝',t:'보고서 작성'});
  let cur={x:34,y:62},k=-1,tm=0;
  const place=p=>{h.style.left=p.x/192*100+'%';h.style.top=p.y/120*100+'%'};
  place(cur);
  function hearts(){$$('.pet').forEach(p=>{const s=document.createElement('span');s.className='heart';s.textContent='💕';p.appendChild(s);setTimeout(()=>{if(s.parentNode)s.parentNode.removeChild(s)},1600)})}
  function next(){
    if(!document.body.contains(h))return;
    let n;do{n=Math.random()*acts.length|0}while(n===k&&acts.length>1);k=n;const a=acts[n];
    th.classList.remove('on');h.classList.toggle('flip',a.x<cur.x);
    const d=Math.hypot(a.x-cur.x,a.y-cur.y);const ms=Math.max(700,d*45);
    h.style.transitionDuration=ms+'ms';h.classList.add('walking');place(a);cur=a;
    tm=setTimeout(()=>{h.classList.remove('walking');th.innerHTML=`<span class="emo">${a.e}</span>${a.t}`;th.classList.add('on');
      if(a.pet)hearts();
      tm=setTimeout(next,3200+Math.random()*1800)},ms);
  }
  tm=setTimeout(next,1200);
  cleanups.push(()=>clearTimeout(tm));
}

function drawMap(cv){
  const W=200,H=125,R=cvScale(cv,W);cv.width=W*R;cv.height=H*R;const g=cv.getContext('2d');g.setTransform(R,0,0,R,0,0);
  const L='#4a3f6b';
  const ell=(x,y,rx,ry,c,line,lw=1)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fillStyle=c;g.fill();if(line){g.lineWidth=lw;g.strokeStyle=line;g.stroke()}};
  const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#c8ecfd');grd.addColorStop(1,'#a9dcf5');g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=.8;g.lineCap='round';
  for(let k=0;k<26;k++){const x=(k*53)%W,y=(k*37)%H;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+3,y-2,x+6,y);g.quadraticCurveTo(x+9,y+2,x+12,y);g.stroke()}
  const pts=[[20,64],...ISLANDS.map(is=>is.pos)];
  g.fillStyle='#fff';for(let k=0;k<pts.length-1;k++){const [a,b]=[pts[k],pts[k+1]];const n=Math.hypot(b[0]-a[0],b[1]-a[1])/5|0;for(let t=1;t<n;t++){g.beginPath();g.arc(a[0]+(b[0]-a[0])*t/n,a[1]+(b[1]-a[1])*t/n,.9,0,7);g.fill()}}
  // HQ
  g.beginPath();g.roundRect?g.roundRect(8,55,24,17,4):g.rect(8,55,24,17);g.fillStyle='#e6defe';g.fill();g.strokeStyle=L;g.lineWidth=1;g.stroke();
  E2('🏢',12,55.5,16);
  function E2(e,x,y,n){g.drawImage(emo(e,n),x,y,n,n)}
  ISLANDS.forEach((is,i)=>{const lock=i>S.promoted,[x,y]=is.pos,rad=i===5?13:11;
    ell(x,y+1,rad+4,rad*.8+3,'#fbeac0');ell(x,y,rad+1,rad*.78,lock?'#ddd7e8':is.color,L,1);ell(x-rad*.35,y-rad*.3,rad*.35,rad*.18,'rgba(255,255,255,.6)');
    E2(lock?'🔒':is.icon,x-9,y-11,18)});
  const tag=(t,cx,cy,bg)=>{g.font=`7px ${FONT_D}`;const w=g.measureText(t).width+7;g.beginPath();g.roundRect?g.roundRect(cx-w/2,cy-5.2,w,10.4,5.2):g.rect(cx-w/2,cy-5.2,w,10.4);g.fillStyle=bg;g.fill();g.lineWidth=.8;g.strokeStyle=L;g.stroke();g.fillStyle=L;g.textAlign='center';g.textBaseline='middle';g.fillText(t,cx,cy+.5)};
  tag('본부',20,77,'#fffdf8');
  ISLANDS.forEach((is,i)=>{const [x,y]=is.pos,rad=i===5?13:11;tag(is.name+(islandDone(i)?' ✔':''),x,y+rad*.78+6.5,i>S.promoted?'#eeeaf5':'#fffdf8')});
  if(!drawMap.fontReq&&document.fonts&&document.fonts.load){drawMap.fontReq=1;document.fonts.load(`10px ${FONT_D}`).then(()=>{if(document.body.contains(cv))drawMap(cv)}).catch(()=>{})}
}

/* ================= 미니게임 엔진 ================= */
const ENG={};

/* ---------- 탐사(필드): 캐릭터가 장비를 들고 돌아다니는 미니맵 ---------- */
ENG.field=(el,cfg,done)=>{
  const TS=16,rows=cfg.map.length,cols=cfg.map[0].length,W=cols*TS,H=rows*TS;
  const M=cfg.map.map(r=>[...r]);
  const FLOOR='.';
  let spawn={x:W/2,y:H/2},npcs=[],targets=[],station=null,ni=0;
  M.forEach((row,y)=>row.forEach((ch,x)=>{
    const c={x:x*TS+8,y:y*TS+8};
    if(ch==='p'){spawn=c;M[y][x]=FLOOR}
    else if(ch==='n'){const d=cfg.npcs[ni++];if(d)npcs.push({...d,...c,got:false,tx:x,ty:y});M[y][x]=FLOOR}
    else if(ch==='b'&&cfg.station){station={...cfg.station,...c};M[y][x]=FLOOR}
    else if(cfg.targetChar&&ch===cfg.targetChar){targets.push({...c,tx:x,ty:y,done:false,seen:!cfg.targets.hidden});M[y][x]=cfg.targetFloor||FLOOR}
  }));
  if(cfg.targets.rand){
    const cand=[];M.forEach((row,y)=>row.forEach((ch,x)=>{if(cfg.targets.on.includes(ch)&&(!cfg.targets.cols||(x>=cfg.targets.cols[0]&&x<=cfg.targets.cols[1]))&&Math.abs(x*TS+8-spawn.x)+Math.abs(y*TS+8-spawn.y)>=TS*3&&!npcs.some(n=>n.tx===x&&n.ty===y)&&!(station&&Math.abs(station.x-(x*TS+8))<TS*2&&Math.abs(station.y-(y*TS+8))<TS*2))cand.push([x,y])}));
    let tries=0;
    while(targets.length<cfg.targets.rand&&tries++<3000){const [x,y]=cand[Math.random()*cand.length|0];const gap=cfg.targets.on==='R'?3:2;
      if(targets.every(t=>Math.abs(t.tx-x)>=gap||(cfg.targets.on!=='R'&&Math.abs(t.ty-y)>=gap)))targets.push({x:x*TS+8,y:y*TS+8,tx:x,ty:y,done:false,seen:!cfg.targets.hidden})}
  }
  const res={};Object.entries(cfg.res).forEach(([k,v])=>res[k]=v.start||0);
  const T=cfg.targets,needN=T.needN||1,RN=cfg.res[T.need];
  // hazards
  let hz=[];(cfg.hazards||[]).forEach(h=>{for(let k=0;k<h.count;k++){if(h.t==='lane')hz.push({t:'lane',x:(W/h.count)*k+Math.random()*30,y:h.row*TS+8,dir:h.dir,speed:h.speed,e:h.icons[k%h.icons.length]});
    else{const a=Math.random()*Math.PI*2;let x,y;do{x=24+Math.random()*(W-48);y=24+Math.random()*(H-48)}while(Math.hypot(x-spawn.x,y-spawn.y)<56);hz.push({t:'drift',x,y,vx:Math.cos(a)*h.speed,vy:Math.sin(a)*h.speed,e:h.icons[k%h.icons.length]})}}});
  const wallCh=cfg.flying?'':'T#WHFt';
  const solid=(px,py)=>{const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=cols||ty>=rows)return true;return wallCh.includes(M[ty][tx])};
  const P={x:spawn.x,y:spawn.y,face:1,walk:0,inv:0};
  const speed=(cfg.flying?70:62)*(has('p_gorani')?1.2:1);
  let keys={u:0,d:0,l:0,r:0},tap=null,tapEnt=null,paused=true,started=false,elapsed=0,mistakes=0,hits=0,lost=0,last=0,raf=0,floodLevel=0,toastT=0,beepT=0,fx=[],over=false;
  const fifty={left:has('p_peng')?1:0};
  const resLine=()=>Object.entries(cfg.res).map(([k,v])=>`<span>${ic(v.i,'i1')} ${v.n} <b>${res[k]}${v.max?'/'+v.max:''}</b></span>`).join('');
  el.innerHTML=`<div class="hud" id="hud"></div>

        if(!solid(P.x-hb,ny-hb)&&!solid(P.x+hb,ny-hb)&&!solid(P.x-hb,ny+hb)&&!solid(P.x+hb,ny+hb))P.y=ny;

  $('#act',el).addEventListener('click',act);
  cv.addEventListener('pointerdown',e=>{if(paused)return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;tap={x,y};

    if(!tapEnt){const t=targets.find(o=>!o.done&&(o.seen||T.kind==='tile')&&cfg.mode!=='radar'&&Math.hypot(o.x-x,o.y-y)<12);if(t)tapEnt=t}});

  el._dbg={P,npcs,targets,res,act,talk};

/* ---------- 분류 (+컨베이어 벨트) ---------- */
ENG.sort=(el,cfg,done)=>{

  const cols=cfg.bins.length;const log=[];
  const binsHTML=()=>`<div class="bins" style="grid-template-columns:repeat(${cols},1fr)">${cfg.bins.map(b=>`<button class="bin btn" data-b="${b.id}">${ic(b.i,'i2')}${b.n}</button>`).join('')}</div>`;
  if(cfg.conveyor){
    let pos=0,raf=0,last=0,judging=false,started=false;
    el.innerHTML=`<div class="gamehead"><span>쓰레기 <b id="cn">1</b> / ${items.length}</span><span>실수 <b id="cm">0</b>${shield?` · ${ic('🐦','i1')} 보호 1회`:''}</span></div>

  let px=W/2,pw=has('p_turtle')?50:36,items=[],score=0,t0=0,last=0,acc=0,raf=0,keys={l:0,r:0},target=null,msgT=0,running=false;
  const hudf=(now)=>{const left=running?Math.max(0,Math.ceil((DUR-(now-t0))/1000)):30;$('#chud',el).innerHTML=`<span>⏱ <b>${left}</b>초</span><span>${ic('🥤','i1')} 수거 <b>${score}</b> / 목표 ${cfg.goal}</span>${now-msgT<1000?`<span style="background:var(--pink)">${cfg.badMsg}</span>`:''}`};
  function spawn(now){const good=Math.random()<.68;const a=good?cfg.good:cfg.bad;const prog=(now-t0)/DUR;items.push({x:10+Math.random()*(W-20),y:-10,v:(46+Math.random()*40)*(1+prog*.7),e:a[Math.random()*a.length|0],good,w:Math.random()*6})}
  function draw(now){

    ctx.fillStyle='#d9f1ff';for(let r=0;r<8;r++){for(let x=((now/40+r*13)%24)-24;x<W;x+=24)ctx.fillRect(Math.round(x),40+r*25,8,1)}
    items.forEach(it=>ctx.drawImage(emo(it.e,16),it.x-8+Math.sin(now/300+it.w)*2,it.y-8,16,16));
    const y=H-28;ctx.fillStyle='#3b3355';ctx.fillRect(Math.round(px-pw/2)-1,y-1,pw+2,14);ctx.fillStyle='#ffcf6b';ctx.fillRect(Math.round(px-pw/2),y,pw,12);ctx.fillStyle='#fff6d6';ctx.fillRect(Math.round(px-pw/2)+2,y+2,pw-4,2);
    ctx.fillStyle='#fff';for(let x=Math.round(px-pw/2)+2;x<px+pw/2-2;x+=4){ctx.fillRect(x,y-6,1,6)}ctx.fillRect(Math.round(px-pw/2),y-7,pw,1);
    ctx.drawImage(emo('🤖',12),px-6,y,12,12);
  }
  function frame(now){
    const dt=Math.min(50,now-last)/1000;last=now;
    if(keys.l)px-=160*dt;if(keys.r)px+=160*dt;if(target!=null)px+=(target-px)*Math.min(1,dt*14);px=Math.max(pw/2,Math.min(W-pw/2,px));

      shots.forEach(s=>{s.y-=230*dt;if(!s.done&&s.y<=thief.y+6){s.done=true;if(Math.abs(s.x-thief.x)<17){win()}else{toast('그물이 빗나갔어요!',false);sfx.bad()}}});
      shots=shots.filter(s=>!s.done&&s.y>-10);
      if(!over&&dist>=100){over=true;running=false;toast('밀렵 트럭이 너무 멀리 달아났어요...',false);const tt=setTimeout(()=>done(0),1300);cleanups.push(()=>clearTimeout(tt))}
      if(!over&&nets<=0&&!shots.length){over=true;running=false;toast('그물이 모두 떨어졌어요...',false);const tt=setTimeout(()=>done(0),1300);cleanups.push(()=>clearTimeout(tt))}
      if(Math.floor(t*5)!==Math.floor((t-dt)*5))hud()}
    draw(now);raf=requestAnimationFrame(frame)}
  function fire(){if(!running||nets<=0||dist>32)return;nets--;shots.push({x:px,y:H-48});sfx.tick();hud()}
  function win(){if(over)return;over=true;running=false;sfx.win();toast('명중! 밀렵 트럭이 멈췄어요. 반순이를 구했어요!',true);
    const c=$('#cover',el);c.hidden=false;c.innerHTML=`${ic('🐻','i4')}<p style="font-size:1.15rem">구출 성공! 걸린 시간 ${Math.floor(t)}초</p>`;
    const tt=setTimeout(()=>done(t<=35?3:t<=55?2:1),1500);cleanups.push(()=>clearTimeout(tt))}
  const toX=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W};
  cv.addEventListener('pointerdown',e=>{target=toX(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType!=='mouse')target=toX(e)});
  const hold=(id,dir)=>{const b=$(id,el);b.addEventListener('pointerdown',e=>{e.preventDefault();target=null;keys[dir]=1});['pointerup','pointerleave','pointercancel'].forEach(tp=>b.addEventListener(tp,()=>keys[dir]=0))};
  hold('#cl','l');hold('#cr','r');$('#net',el).onclick=fire;
  const kd=e=>{if(e.key==='ArrowLeft'){keys.l=1;target=null;e.preventDefault()}else if(e.key==='ArrowRight'){keys.r=1;target=null;e.preventDefault()}else if(e.key===' '&&running){e.preventDefault();fire()}};
  const ku=e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0};
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
  cleanups.push(()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku)});
  hud();last=performance.now();raf=requestAnimationFrame(frame);
  el._dbg={get dist(){return dist},set dist(v){dist=v},fire,thief,get px(){return px},set px(v){px=v}};
  $('#cgo',el).onclick=()=>{$('#cover',el).hidden=true;running=true;last=performance.now();toast('반순이의 GPS 신호를 따라가요!',true)};
};

/* ---------- 스마트팜 기르기 ---------- */
ENG.farm=(el,cfg,done)=>{
  const N=6,P=Array.from({length:N},()=>({st:'empty',g:0,m:50,pest:0,pt:0,wilt:0}));
  const TOOLS=[{id:'plant',i:'🌱',n:'씨앗 심기'},{id:'water',i:'💧',n:'물 주기'},{id:'bug',i:'🧤',n:'해충 잡기'},{id:'cut',i:'✂️',n:'수확하기'}];
  let tool='plant',seeds=0,t=0,iv=0,over=false,running=false,msg='씨앗 심기 도구로 빈 화분을 눌러 시작해요.';
  el.innerHTML=`<div class="hud" id="fh"></div>
  <div class="tools" id="ft" style="justify-content:center;margin-bottom:12px"></div>
  <div style="position:relative"><div class="farm" id="fg"></div>
    <div class="cover" id="cover" style="border-radius:18px">${ic('🌸','i4')}<p>스마트팜 가동!<br>${cfg.time}초 안에 동강할미꽃 씨앗 ${cfg.goal}개를 모으세요.</p><button class="btn primary" id="fgo">농사 시작</button></div></div>
  <p class="toast" id="fm"></p>
  <p class="hint" style="text-align:center">파란 막대는 IoT 센서가 잰 흙의 수분이에요. 초록 구간에 있을 때만 자라요. 빨간 테두리는 AI가 해충을 발견했다는 뜻이에요.</p>`;
  const stageIcon=p=>p.st==='empty'?'🟫':p.st==='dead'?'🥀':p.g>=100?'🌸':p.g>=67?'🌷':p.g>=34?'🌿':'🌱';
  const stageText=p=>p.st==='empty'?'빈 화분':p.st==='dead'?'시들었어요':p.g>=100?'수확 가능!':p.m<30?'목말라요':p.m>85?'물이 너무 많아요':p.pest?'해충 발견!':`자라는 중 ${Math.floor(p.g)}%`;
  function renderTools(){$('#ft',el).innerHTML=TOOLS.map(x=>`<button class="tool" aria-pressed="${tool===x.id}" data-t="${x.id}">${ic(x.i,'i1')} <b>${x.n}</b></button>`).join('');$$('#ft .tool',el).forEach(b=>b.onclick=()=>{tool=b.dataset.t;renderTools()})}
  function render(){
    $('#fg',el).innerHTML=P.map((p,k)=>`<button class="plot ${p.pest&&p.st==='grow'?'pest':''} ${p.st==='grow'&&p.g>=100?'ready':''}" data-k="${k}" aria-label="화분 ${k+1}: ${stageText(p)}">
      ${p.pest&&p.st==='grow'?'<span class="bug emo">🐛</span>':''}${p.st==='empty'?'<span class="soil" aria-hidden="true"></span>':ic(stageIcon(p),'')}
      <div class="mbar"><span class="z"></span><i style="width:${p.st==='grow'?p.m:0}%"></i></div>
      <div class="gbar"><i style="width:${p.st==='grow'?p.g:0}%"></i></div>
      <span class="st">${stageText(p)}</span></button>`).join('');
    $('#fh',el).innerHTML=`<span>⏱ 남은 시간 <b>${Math.max(0,Math.ceil(cfg.time-t))}</b>초</span><span>${ic('🌰','i1')} 씨앗 <b>${seeds}</b> / ${cfg.goal}</span>`;
    $('#fm',el).textContent=msg;
  }
  $('#fg',el).addEventListener('click',e=>{const b=e.target.closest('.plot');if(!b||!running||over)return;const p=P[+b.dataset.k];
    if(tool==='plant'){if(p.st==='grow'){msg='이미 자라고 있어요.';sfx.bad()}else{Object.assign(p,{st:'grow',g:0,m:55,pest:0,pt:0,wilt:0});msg='씨앗을 심었어요! 수분을 초록 구간으로 유지해요.';sfx.tick()}}
    else if(tool==='water'){if(p.st!=='grow'){msg='먼저 씨앗을 심어요.';sfx.bad()}else{p.m=Math.min(100,p.m+30);msg=p.m>85?'물이 너무 많아요! 뿌리가 숨을 못 쉬어요.':'촉촉해졌어요.';p.m>85?sfx.bad():sfx.tick()}}
    else if(tool==='bug'){if(p.st==='grow'&&p.pest){p.pest=0;p.pt=0;msg='해충을 잡았어요!';sfx.ok()}else{msg='이 화분에는 해충이 없어요.';sfx.bad()}}
    else if(tool==='cut'){if(p.st==='grow'&&p.g>=100){p.st='empty';p.g=0;seeds+=3;msg='수확 성공! 씨앗 3개를 얻었어요.';sfx.ok();if(seeds>=cfg.goal)finish(true)}else{msg='아직 꽃이 피지 않았어요.';sfx.bad()}}
    render()});
  function tick(){if(!running||over)return;const dt=.1;t+=dt;
    P.forEach(p=>{if(p.st!=='grow')return;p.m=Math.max(0,p.m-6.5*dt);
      if(p.pest){p.pt+=dt;if(p.pt>6){p.g=Math.max(0,p.g-25);p.pt=0;msg='해충 때문에 식물이 상했어요!'}}
      else if(p.g>10&&p.g<100&&Math.random()<.012){p.pest=1;p.pt=0}
      if(p.m>=30&&p.m<=85&&!p.pest&&p.g<100)p.g=Math.min(100,p.g+8.5*dt);
      if(p.m<15){p.wilt+=dt;if(p.wilt>5){p.st='dead';msg='물을 못 받아 시들었어요. 다시 심어요.';sfx.bad()}}else p.wilt=0});
    if(t>=cfg.time)return finish(false);
    render()}
  function finish(ok){over=true;running=false;clearInterval(iv);render();
    const c=$('#cover',el);c.hidden=false;c.innerHTML=ok?`${ic('🌰','i4')}<p style="font-size:1.15rem">씨앗 ${seeds}개 수확! ${Math.floor(t)}초 걸렸어요.</p>`:`${ic('😢','i4')}<p>시간이 다 됐어요. 씨앗 ${seeds}개를 모았어요.</p>`;
    const tt=setTimeout(()=>done(ok?(t<=60?3:t<=80?2:1):0),1400);cleanups.push(()=>clearTimeout(tt))}
  renderTools();render();
  cleanups.push(()=>clearInterval(iv));
  el._dbg={P,get seeds(){return seeds},set seeds(v){seeds=v}};
  $('#fgo',el).onclick=()=>{$('#cover',el).hidden=true;running=true;iv=setInterval(tick,100);sfx.tick()};
};

/* ---------- 지층 발굴 ---------- */
ENG.dig=(el,cfg,done)=>{
  const R=7,C=8;
  const LAY=[{n:'표토',c:'#d6f0c4'},{n:'인류세',c:'#efe5d4'},{n:'백악기',c:'#f6dcbb'},{n:'트라이아스기',c:'#f1ccae'},{n:'페름기',c:'#e9bfa9'},{n:'데본기',c:'#dcb7b2'},{n:'오르도비스기',c:'#cdb3c6'}];
  const cells=Array.from({length:R*C},(_,k)=>({open:false,hp:1,item:null,hint:false}));
  cfg.finds.forEach((f,i)=>{const r=i+1;let c;do{c=Math.random()*C|0}while(false);cells[r*C+c].item=i});
  let rocks=0;while(rocks<7){const k=C+(Math.random()*(R-1)*C|0);if(cells[k].item==null&&cells[k].hp===1){cells[k].hp=2;rocks++}}
  let energy=cfg.energy,gpr=3,mode='dig',found=0,over=false,msg='맨 위 표토부터 파 내려가요.';
  const nb=k=>{const r=k/C|0,c=k%C,o=[];if(r>0)o.push(k-C);if(r<R-1)o.push(k+C);if(c>0)o.push(k-1);if(c<C-1)o.push(k+1);return o};
  const canDig=k=>(k/C|0)===0||nb(k).some(x=>cells[x].open);
  const near=k=>{const r=k/C|0,c=k%C;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=R||cc>=C||(!dr&&!dc))continue;const x=cells[rr*C+cc];if(x.item!=null&&!x.open)return true}return false};
  el.innerHTML=`<div class="hud" id="dh"></div>
  <div class="tools" id="dt" style="justify-content:center;margin-bottom:12px"></div>
  <div class="digwrap"><div class="layers" style="grid-template-rows:repeat(${R},1fr)">${LAY.map(l=>`<span>${l.n}</span>`).join('')}</div><div class="dig" id="dg"></div></div>
  <p class="toast" id="dm"></p>
  <p class="hint" style="text-align:center">노란 테두리는 3D 스캐너가 '바로 옆에 화석이 있다'고 알려 주는 표시예요. ✨는 레이더가 찾은 화석 위치예요.</p>`;
  function render(){
    $('#dh',el).innerHTML=`<span>${ic('⚡','i1')} 발굴 에너지 <b>${energy}</b></span><span>${ic('📡','i1')} 레이더 <b>${gpr}</b>회</span><span>${ic('🦴','i1')} 찾은 증거 <b>${found}</b> / ${cfg.finds.length}</span>`;
    $('#dt',el).innerHTML=`<button class="tool" aria-pressed="${mode==='dig'}" data-m="dig">${ic('⛏️','i1')} <b>발굴 붓</b> · 에너지 1</button><button class="tool" aria-pressed="${mode==='gpr'}" data-m="gpr" ${gpr?'':'disabled'}>${ic('📡','i1')} <b>지표투과레이더</b> · 주변 3×3 탐지</button>`;
    $$('#dt .tool',el).forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
    $('#dg',el).innerHTML=cells.map((x,k)=>{const r=k/C|0;const it=x.item!=null?cfg.finds[x.item]:null;
      const inner=x.open?(it?ic(it.e,''):''):(x.hint?ic('✨',''):x.hp>1?ic('🪨',''):'');
      return `<button class="dc ${x.open?'open':''} ${x.open&&near(k)?'near':''}" data-k="${k}" style="background:${LAY[r].c}" aria-label="${LAY[r].n} ${k%C+1}번째 칸">${inner}</button>`}).join('');
    $('#dm',el).textContent=msg;
  }
  $('#dg',el).addEventListener('click',e=>{const b=e.target.closest('.dc');if(!b||over)return;const k=+b.dataset.k,x=cells[k];
    if(mode==='gpr'){if(gpr<=0)return;gpr--;mode='dig';const r=k/C|0,c=k%C;let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=R||cc>=C)continue;const y=cells[rr*C+cc];if(y.item!=null&&!y.open){y.hint=true;n++}}
      msg=n?`레이더 반응! 주변에 화석 ${n}개가 묻혀 있어요.`:'레이더 반응이 없어요. 다른 곳을 살펴봐요.';sfx.ping();return render()}
    if(x.open)return;
    if(!canDig(k)){msg='위나 옆 칸을 먼저 파야 이곳에 닿을 수 있어요.';sfx.bad();return render()}
    if(energy<=0)return;
    energy--;x.hp--;
    if(x.hp>0){msg='단단한 암석이에요! 한 번 더 파야 해요.';sfx.tick()}
    else{x.open=true;sfx.scan();msg='';
      if(x.item!=null){found++;const f=cfg.finds[x.item];sfx.ok();render();
        modal(`<div class="mi">${bub(f.e,'i4','var(--butter)')}</div><h2 style="text-align:center">${f.n}</h2><p class="label" style="text-align:center">${LAY[(k/C|0)].n} 지층 · 방사성 연대 측정: ${f.age}</p><p>${f.x}</p>`,[{t:found===cfg.finds.length?'발굴 완료!':'계속 발굴하기',c:'primary',f:()=>{if(found===cfg.finds.length)finish(true)}}]);
        msg=`${f.n} 발견!`}}
    if(!over&&energy<=0&&found<cfg.finds.length)return finish(false);
    render()});
  function finish(ok){if(over)return;over=true;render();
    const tt=setTimeout(()=>done(ok?(energy>=14?3:energy>=6?2:1):0),ok?300:1200);cleanups.push(()=>clearTimeout(tt));if(!ok){msg='에너지가 모두 떨어졌어요...';$('#dm',el).textContent=msg}}
  el._dbg={cells,open:k=>{cells[k].open=true}};
  render();
};

/* ================= 7. 연구 기록실 ================= */
function archive(tab){
  const effName={p:'개인',s:'사회',g:'국제'};
  let body='';
  if(tab==='items'){
    const groups=[['tool','장비'],['deco','연구실 장식'],['pet','도우미 펫']];
    body=groups.map(([k,t])=>`<h3>${t}</h3><div class="grid3">${Object.entries(ITEMS).filter(([,x])=>x.k===k).map(([id,x])=>has(id)?`<div class="itm px">${ic(x.i,'i3')}<div><b>${x.n}</b><small>${x.d}${x.fx?'<br><b>능력: '+x.fx+'</b>':''}</small></div></div>`:`<div class="itm px lock">${ic(x.i,'i3')}<div><b>???</b><small>임무를 해결하면 얻을 수 있어요.</small></div></div>`).join('')}</div>`).join('');
  }else if(tab==='dex'){
    body=`<div class="grid3">${ISLANDS.flatMap((is,i)=>is.missions.map((m,j)=>{const st=S.stars[mk(i,j)];return st?`<div class="itm px">${ic(m.from.e,'i3')}<div><b>${m.from.n}</b><small>${is.name} · ${m.issue}</small><span class="stars">${starStr(st)}</span><small>${m.fact}</small></div></div>`:`<div class="itm px lock">${ic(m.from.e,'i3')}<div><b>???</b><small>${i<=S.promoted?is.name+'에서 기다리고 있어요.':'아직 만나지 못한 친구예요.'}</small></div></div>`})).join('')}</div>`;
  }else{
    const dn=ISLANDS.flatMap((is,i)=>is.missions.map((m,j)=>({m,i,st:S.stars[mk(i,j)]}))).filter(x=>x.st);
    body=dn.length?dn.map(({m})=>`<div class="px stack" style="gap:8px"><h3>${ic(m.from.e,'i1')} ${m.issue} <span class="tag ${m.focus}">${effName[m.focus]} 노력 중심</span></h3><div class="effs"><div class="eff px p"><b>개인</b><p>${m.eff.p}</p></div><div class="eff px s"><b>사회</b><p>${m.eff.s}</p></div><div class="eff px g"><b>국제</b><p>${m.eff.g}</p></div></div></div>`).join(''):`<p class="muted">임무를 해결하면 개인·사회·국제의 노력 카드가 여기에 모여요.</p>`;
  }
  const cnt={items:S.items.length+'/'+Object.keys(ITEMS).length,dex:doneCount()+'/18',eff:doneCount()+'장'};
  show(`<div class="playhead"><h2>${ic('📚','i2')} 연구 기록실</h2></div>
  <div class="row" role="tablist">${[['items','장비·장식·펫'],['dex','구조한 생물 도감'],['eff','노력 카드']].map(([k,t])=>`<button class="chip" role="tab" aria-selected="${tab===k}" data-t="${k}">${t} (${cnt[k]})</button>`).join('')}</div>
  ${body}
  <div class="px" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="muted">처음부터 새 캐릭터로 다시 시작할 수 있어요. 지금까지의 기록은 사라져요.</span><button class="btn small" id="reset">처음부터 다시</button></div>`);
  $$('[data-t]').forEach(b=>b.onclick=()=>archive(b.dataset.t));
  $('#reset').onclick=()=>modal(`<div class="mi">${ic('⚠️','i4')}</div><p style="text-align:center">정말 처음부터 다시 시작할까요?<br>모든 승진·보상·기록이 지워져요.</p>`,[{t:'취소'},{t:'처음부터 시작',c:'pink',f:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;renderTop();create()}}]);
}

    <h2>지구구조단장 ${esc(S.name)}</h2>
    <p>위 사람은 인류세의 위기 속에서 과학기술과 따뜻한 마음으로<br>지구의 모든 생명을 지켜 냈기에 이 임명장을 드립니다.</p>
    <div style="width:100%;max-width:440px;text-align:left"><label for="pledge" class="label">나의 지구 지킴 약속 (게임 밖에서도 실천할 한 가지)</label><textarea id="pledge" rows="2" maxlength="80" placeholder="예: 학교 갈 때 텀블러 챙기기">${esc(S.pledge||'')}</textarea></div>
    <p id="pl" style="font-weight:700;font-size:1.15rem">${S.pledge?'“'+esc(S.pledge)+'”':''}</p>
    <div class="seal">지구<br>구조단</div>
    <p class="muted">${new Date().toISOString().slice(0,10).replace(/-/g,'.')} · 지구 생명 연합</p>
  </div>
  <div class="center"><button class="btn primary" id="off">연구실로 돌아가기</button></div>`);
  $('#pledge').oninput=e=>{S.pledge=e.target.value.trim();save();$('#pl').textContent=S.pledge?'“'+S.pledge+'”':''};
  $('#off').onclick=office;
  sfx.win();
}

/* ================= 시작 ================= */
S=load();
let booted=false;
const boot=()=>{if(booted)return;booted=true;if(S&&S.name){office()}else{create()}};
/* 캔버스에 쓰는 글자(한글 제목 글꼴)와 이모지를 먼저 받아 둔다. 2.5초 안에 못 받으면 그냥 시작하고, 나중에 도착하면 다시 그린다 */
const redrawCanvases=()=>{for(const k in EC)delete EC[k];for(const k in AVI)delete AVI[k];const o=$('#ocv');if(o)drawOffice(o);const m=$('#mcv');if(m)drawMap(m)};
(function(){
  if(!(document.fonts&&document.fonts.load)){boot();return}
  const src=JSON.stringify(ISLANDS)+JSON.stringify(ITEMS)+RANKS.join('')+((document.currentScript&&document.currentScript.textContent)||'');
  const uniq=a=>[...new Set(a||[])].join('');
  const hangul=uniq(src.match(/[\uAC00-\uD7A3]/g));
  let emojis='';try{emojis=uniq(src.match(/\p{Extended_Pictographic}/gu))}catch(e){}
  const apple=/Mac|iPhone|iPad|iPod/.test(navigator.platform||navigator.userAgent||'');
  const jobs=[document.fonts.load('16px Jua',hangul+'0123456789')];
  if(emojis&&!apple)jobs.push(document.fonts.load('16px "Noto Color Emoji"',emojis));
  let late=false;
  const t=setTimeout(()=>{late=true;boot()},2500);
  Promise.all(jobs).then(()=>{clearTimeout(t);if(late)redrawCanvases();else boot()},()=>{clearTimeout(t);boot()});
})();
</script>
